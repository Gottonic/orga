<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Banque</title>
<meta name="theme-color" content="#1E3A5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(../commun/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(../commun/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:600;font-style:normal;font-display:swap;src:url(../commun/fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-style:normal;font-display:swap;src:url(../commun/fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
/* Banque : style « Wallet » des maquettes — gris clair, cartes blanches arrondies, accent ambre */
:root{
  color-scheme:light;
  --bg:#F4F5F7; --head:#FFFFFF; --card:#FFFFFF; --tile:#EEF0F3; --protile:#E8EEFB; --seg:#E9ECF0; --line:#E2E5EA; --line2:#C9CED6;
  --text:#17181B; --muted:#5C6270; --acc:#9A6A00; --accsoft:#FBEFD6; --amber:#F0B54A; --amberink:#1A1406; --pro:#3E7BFA;
  --neg:#C8322B; --pos:#1E7F47; --possoft:#E3F4EA; --suggest:#FBF4E4;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --title:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-family:var(--title)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
svg.i{flex:none;display:block}

/* en-tête */
.ibtn{width:48px;height:48px;border:0;background:transparent;border-radius:24px;display:grid;place-items:center;color:var(--text);flex:none;text-decoration:none}
.ibtn:hover{background:var(--tile)}
.hd h1{flex:1;font-size:24px;font-weight:700}
.sync{height:32px;padding:0 12px;border:0;border-radius:16px;background:var(--tile);font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sync.ok{background:var(--possoft);color:var(--pos)} .sync.pend{background:var(--accsoft);color:var(--acc)} .sync.err{background:#FDE7E5;color:var(--neg)}

main{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:26;width:60px;height:60px;border:0;border-radius:18px;background:var(--amber);color:var(--amberink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(154,106,0,.35)}
@media (min-width:800px){.fab{right:calc(50% - 380px + 16px)}}

.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--seg)}
.seg button{flex:1 1 0;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.card>h2,.sect>.st h2{font-size:19px;font-weight:600}
.cap{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sect{display:flex;flex-direction:column;gap:10px}
.st{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--tile);border:0;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:64px;min-width:0}
.tile.pro{background:var(--protile)}
.tile.inv{background:#F7F0E1}
.tile:hover{filter:brightness(.97)}
.tile .n{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.totrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 2px 0}
.totrow span:first-child{font-size:13px;color:var(--muted)} .totrow b{font-size:16px;font-variant-numeric:tabular-nums}
.big{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.big b{font-family:var(--title);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 12px}
.kpis>div{background:var(--tile);border-radius:12px;padding:8px 10px;min-width:0}
.kpis .v{font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;font-size:14px}
.bar .dot{grid-row:1/3;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:#fff}
.bar .track{height:6px;border-radius:3px;background:var(--tile);grid-column:2/4}
.bar .fill{height:100%;border-radius:3px}
.dette{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.dette:first-of-type{border-top:0}

.ops{list-style:none;margin:0;padding:0}
.op{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0;text-align:left;color:inherit}
.ops li:first-child .op{border-top:0}
.ic{position:relative;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:#fff;flex:none}
.op .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.op .ti{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .ti:has(.tt){display:flex;align-items:center;min-width:0}
.op .ti .tt{flex:0 1 auto;min-width:3ch;overflow:hidden;text-overflow:ellipsis}
.op .ti .tg{flex:0 0 auto;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .end{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.op .mt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.op .ac{font-size:12px;color:var(--muted)}
.tg{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);background:var(--accsoft);border-radius:8px;padding:0 6px;margin-left:5px;vertical-align:1px}
.lien{height:44px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--acc);font-size:15px;font-weight:700;text-align:left;padding:0;width:100%;margin-top:4px}
.jour{display:flex;justify-content:space-between;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}

.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-family:var(--title);font-size:19px;font-weight:600;text-transform:capitalize}
.rond{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--acc);display:grid;place-items:center}
.filtres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filtres .wide{grid-column:1/-1}
.sel,.input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;font-size:15px}
.input.area{height:auto;padding:10px 12px}
.pill{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
.pill.dash{border:1px dashed var(--line2);background:transparent}
.pill.tagp[aria-pressed="true"]{background:var(--accsoft);border-color:var(--amber);color:var(--acc)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills.scroll::-webkit-scrollbar{display:none}
.btn{height:52px;border:0;border-radius:16px;background:var(--amber);color:var(--amberink);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.warn{background:transparent;color:var(--neg);border:1px solid #F1C4C0}
.btn.sm{height:44px;font-size:14px;width:auto;padding:0 16px}
.note{font-size:13px;color:var(--muted);margin:0}
.empty{font-size:14px;color:var(--muted);margin:0;padding:6px 0}
.err{color:var(--neg);font-weight:700;font-size:14px;margin:0}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:middle}
.table tr:first-child td{border-top:0}
.table td.r{text-align:right;font-variant-numeric:tabular-nums}
.table input{width:120px;text-align:right;height:38px}
.cpt{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.cpt:first-of-type{border-top:0}
.cpt.off{opacity:.55}
.cpt-l,.cpt-r{display:flex;flex-direction:column;gap:6px;min-width:0}
.cpt-r .input{text-align:right}
@media (max-width:420px){.cpt{grid-template-columns:1fr}}

/* feuille de saisie */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:100%;height:100%;overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@media (min-width:600px){.scrim{align-items:center}.sheet{height:auto;max-height:94%;border-radius:24px;padding-top:6px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sh{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:4px;margin:0 -8px;padding:calc(6px + env(safe-area-inset-top,0px)) 0 4px}
.sh h2{font-size:20px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.okb{height:42px;padding:0 12px 0 10px;border:0;border-radius:21px;background:var(--amber);color:var(--amberink);font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px;flex:none;margin-right:8px}
.okb:active{filter:brightness(.95)}
.montant{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:2px 0}
.montant b{font-family:var(--title);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.montant span{font-size:18px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px}
@media (min-width:480px){.cats{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cat{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;font-size:12px;line-height:1.2;text-align:center;color:var(--text)}
.cat .ic{width:46px;height:46px;border-radius:23px}
.cat[aria-pressed="true"]{font-weight:700}
.cat[aria-pressed="true"] .ic{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--amber)}
.subs{background:var(--card);border-radius:14px;padding:8px}
.montant .sg{min-width:.5ch}
.m-in{font-family:var(--title);font-size:48px;font-weight:700;line-height:1.15;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;text-align:center;width:5.5ch;field-sizing:content;min-width:2.2ch;max-width:70vw;padding:0 4px;font-variant-numeric:tabular-nums;caret-color:var(--acc)}
.m-in:focus{outline:none;border-bottom-color:var(--amber)}
.m-in::placeholder{color:var(--line2)}
.part{display:grid;grid-template-columns:100px 1fr 44px;gap:6px}
.part button{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}

.cgrp{padding:8px 16px 12px}
.cgrp.off{opacity:.7}
.crow{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0;text-align:left;color:inherit;font-size:15px;min-height:44px}
.card>.crow:first-child,.crow.maitre{border-top:0}
.crow.maitre{font-weight:700}
.crow.off{opacity:.6}
.crow .dot{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;flex:none}
.crow .cn{flex:1;min-width:0}
.crow .cv{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px}
.buds{display:flex;flex-direction:column;margin-top:6px}
.bud{display:flex;flex-direction:column;gap:6px;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0;text-align:left;color:inherit;width:100%}
.bud:first-child{border-top:0}
.bud-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bud-n{font-size:15px;min-width:0}
.bud-h>.num{white-space:nowrap;flex:none}
.bud-t{position:relative;height:10px;border-radius:5px;background:var(--tile);overflow:visible}
.bud-t i{display:block;height:100%;border-radius:5px}
.bud-t em{position:absolute;top:-3px;width:2px;height:16px;margin-left:-1px;background:var(--text);border-radius:1px}
.vite{color:var(--acc);font-weight:700}
.hist{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
.hist>span{display:flex;flex-direction:column;align-items:center;background:var(--tile);border-radius:10px;padding:6px 2px;font-size:13px}
.hist>span.neg b{color:var(--neg)}
.rel{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:14px}
input[type=checkbox]{accent-color:var(--acc)}
.exl .chk{padding:7px 0;align-items:flex-start}
.exl .chk input{margin-top:1px;flex:none}
.exl .cap{display:block;margin-top:10px}
.avl{display:flex;flex-direction:column;margin-top:6px}
.avr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.avr:first-child{border-top:0}
.avn{display:flex;flex-direction:column;gap:2px;min-width:0}
.avr.alerte{font-size:14px}
.avr b.num{white-space:nowrap}
.rec{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.card>h2+.rec,.card>.note+.rec{border-top:0}
.rec.off{opacity:.65}
.rec-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:0;background:transparent;padding:0;text-align:left;color:inherit;font-size:15px}
.rec-n{font-weight:700}
.rec-m{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.rec-a{flex-basis:100%;display:flex;gap:6px;justify-content:flex-end}
.vt{display:flex;gap:4px;flex:none}
.tbtn.ic2{width:36px;padding:0;display:grid;place-items:center}
.tbtn.ic2[aria-pressed="true"]{background:var(--text);color:#fff}
.fro{display:flex;justify-content:center;margin:4px 0 10px}
.fro .part{cursor:pointer;outline:none}
.fro .part:hover,.fro .part:focus-visible{filter:brightness(1.08)}
.fro .part:focus-visible{stroke:var(--acc);stroke-width:3}
.rk.leg2 .rk-b{display:none}
.rk.leg2 .rk-row{padding:5px 4px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:8px 0;text-align:left;color:inherit;font-size:14px}
.mrow .rk-n{white-space:normal}
.piste{padding:12px 0;border-top:1px solid var(--line)}
.piste:first-of-type{border-top:0;padding-top:6px}
.piste .pv{font-weight:700;white-space:nowrap}
.kpis .note{font-size:12px}
.dsec{margin-top:10px}
.dsec>.st{padding-bottom:4px}
.dette-b{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;color:inherit;font-size:15px}
.dette-b .note{font-size:13px}
.dette.off{opacity:.75}
.retard{color:var(--neg);font-weight:700}
.bon{color:var(--pos);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.big b.neg{color:var(--neg)}
.big b small{font-size:.55em;font-weight:600;color:var(--muted)}
.sh2{font-size:19px;font-weight:600;margin:22px 4px 10px}
.vrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.vrow .input{flex:1;max-width:200px}
.etapes{list-style:none;margin:8px 0 0;padding:0}
.etape{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.etape:first-child{border-top:0}
.etape .no{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--tile);color:var(--text);margin-top:1px}
.etape.ok .no{background:var(--pos)}
.etape .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.etape.ok .tx b{color:var(--muted);font-weight:600}
.etape .act{flex:none;align-self:center}
.docs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}
.doc{position:relative}
.doc-v{width:76px;height:76px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--tile);padding:0;display:grid;place-items:center;flex:none}
.doc-v img{width:100%;height:100%;object-fit:cover;display:block}
.doc-pdf{font-weight:700;font-size:13px;color:var(--neg)}
.doc-x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;padding:0}
.doc-att{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(255,255,255,.9);border-radius:6px;padding:1px 4px;color:var(--muted)}
.clip{flex:none;margin-left:4px;font-size:13px;cursor:pointer}
.docv{position:fixed;inset:0;z-index:100;background:rgba(10,10,12,.94);display:flex;flex-direction:column;color:#fff}
.docv[hidden]{display:none}
.docv-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px 16px;font-weight:600}
.docv-h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docv-c{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px 8px calc(12px + env(safe-area-inset-bottom,0px))}
.docv-c img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.docv-c iframe{width:100%;flex:1;border:0;background:#fff;border-radius:6px}
.ij{display:flex;gap:12px;align-items:flex-start}
.ij-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ij-l{display:flex;justify-content:space-between;gap:8px}
.ij-l b:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gdt-f{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gdt-f .input{flex:1 1 180px}
.sem{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

function pointsSolde(c,per){

  else { const pas=per==='3m'?1:7, n=per==='3m'?91:53; for(let i=n-1;i>=0;i--){ const d=plus(t,-i*pas); if(d>=veille(p0)) D.push(d); } if(D.length&&D[0]>veille(p0)&&p0>plus(t,-(n-1)*pas)) D.unshift(veille(p0)); }

/* Photo, image ou PDF joint à une opération. Images réduites à 1600 px (WebP), PDF tels quels, 10 Mo au plus.
   Ligne « f:<id> » = {id, tx, nom, type, taille, path, cree} ; l'opération garde docs:[ids].
   Hors ligne d'abord : le fichier reste sur l'appareil (cache « banque-docs-media ») ; path = null tant qu'il n'est pas
   envoyé dans le dossier privé « cash-documents » (<utilisateur>/<id>.webp ou .pdf). */
const DOCS_BUCKET='cash-documents', DOCS_MEDIA='banque-docs-media', DOC_MAX=10*1024*1024, DOC_PX=1600;

const docCle=id=>new URL('__docs/'+id,location.href).href;
async function docGarder(id,blob){ docMem.set(id,blob); try{ const c=await caches.open(DOCS_MEDIA); await c.put(docCle(id),new Response(blob,{headers:{'content-type':blob.type}})); }catch(e){} }
async function docLocal(id){ if(docMem.has(id)) return docMem.get(id); try{ const c=await caches.open(DOCS_MEDIA), r=await c.match(docCle(id)); if(r){ const b=await r.blob(); docMem.set(id,b); return b; } }catch(e){} return null; }
async function docOublier(id){ docMem.delete(id); const u=docUrls.get(id); if(u){ URL.revokeObjectURL(u); docUrls.delete(id); } try{ const c=await caches.open(DOCS_MEDIA); await c.delete(docCle(id)); }catch(e){} }
async function docBlob(f){ let b=await docLocal(f.id); if(!b&&f.path&&sb&&navigator.onLine){ try{ const {data}=await sb.storage.from(DOCS_BUCKET).download(f.path); if(data){ b=data; docGarder(f.id,data); } }catch(e){} } return b; }
async function docUrl(f){ if(docUrls.has(f.id)) return docUrls.get(f.id); const b=await docBlob(f); if(!b) return null; const u=URL.createObjectURL(b); docUrls.set(f.id,u); return u; }
async function reduireImage(file){
  let src=null; try{ src=await createImageBitmap(file); }catch(e){ src=await new Promise((ok,ko)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>ko(new Error('image illisible')); im.src=URL.createObjectURL(file); }); }
  const w0=src.width||src.naturalWidth, h0=src.height||src.naturalHeight, k=Math.min(1,DOC_PX/Math.max(w0,h0)), w=Math.max(1,Math.round(w0*k)), h=Math.max(1,Math.round(h0*k));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d'); g.fillStyle='#FFFFFF'; g.fillRect(0,0,w,h); g.drawImage(src,0,0,w,h);
  let blob=await new Promise(ok=>cv.toBlob(ok,'image/webp',0.82)); if(!blob||blob.type!=='image/webp') blob=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.85));

function docsEffacer(L){ const k='banque-docs-effacer-'+UID; try{ if(L) localStorage.setItem(k,JSON.stringify(L)); else return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }

const TAUX_DEV={EUR:0.94,USD:0.80,GBP:1.07,SEK:0.084};

/* étiquettes de la saisie : les 6 plus utilisées ces derniers temps (+ celles déjà choisies ou en cours), le reste replié */
function etiquettesSaisie(d){
  const lim=isoD(new Date(Date.now()-120*864e5)), n={}, der={};
  for(const t of Object.values(S.tx)){ if(t.source==='miroir') continue; (t.tags||[]).forEach(g=>{ if(t.date>=lim) n[g]=(n[g]||0)+1; if(!der[g]||t.date>der[g]) der[g]=t.date; }); }

  const tri=dispo.slice().sort((a,b)=>(n[b.id]||0)-(n[a.id]||0)||String(der[b.id]||b.du||'').localeCompare(String(der[a.id]||a.du||''))||a.nom.localeCompare(b.nom));
  const top=tri.slice(0,6).map(g=>g.id), vis=new Set(top.concat(d.tags,actifs));
  const montres=d.toutesEtiq?tri:tri.filter(g=>vis.has(g.id)), caches=tri.length-montres.length;

    +(caches>0?'<button class="pill dash" data-act="etiqplus">+ '+caches+' autre'+(caches>1?'s':'')+'</button>':d.toutesEtiq&&tri.length>vis.size?'<button class="pill dash" data-act="etiqmoins">Moins</button>':'')
    +'<button class="pill dash" data-act="nouveautag">+ Étiquette</button></div></div>';
}
function frequentes(type){

    for(const l of lignes(t)){ if(!l.cat||l.cat===AJU||l.cat===VIR||(type==='depense'?l.montant>=0:l.montant<=0)) continue; n[l.cat]=(n[l.cat]||0)+1; } }

    else if(t==='INVEST_RECURRING_ORDER_EXECUTED'||t==='INVEST_ORDER_EXECUTED'){
      if(r.actif==='SWQ'){ m.montant=r.cre; m.tiers='Swissqoins vendus'; m.canal='regle'; m.cat='revenus.interets-dividendes'; }

      m.montant=t.includes('DEPOSIT')?-Math.abs(mt):Math.abs(mt); m.tiers='Projet Yuh « '+o+' »'; m.canal='objectif'; m.vers='yuh-epargne'; }

    if(m.montant==null||isNaN(m.montant)) return;
    if(m.vers&&!S.comptes[m.vers]) m.vers=null;
    m.banque=m.tiers; M.push(m); });
  /* changes automatiques : le coût en CHF d'un paiement en devise est celui de l'ordre de change du même montant (± 3 jours) */
  const taux={};
  fx.forEach(f=>{ if(f.cdeb==='CHF'&&f.cre&&f.deb) (taux[f.ccre]=taux[f.ccre]||[]).push([f.date,Math.abs(f.deb)/Math.abs(f.cre)]);
    else if(f.ccre==='CHF'&&f.deb&&f.cre) (taux[f.cdeb]=taux[f.cdeb]||[]).push([f.date,Math.abs(f.cre)/Math.abs(f.deb)]); });

/* =============================== Statistiques =============================== */
const SERIE={dep:'#E0612E',rev:'#2A78D6',pat:'#9A6A00'};   /* palette validée (validate_palette.js) */
function isoD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* sens d'une ligne : dépense (les remboursements d'une catégorie de dépense la diminuent), revenu, ou rien (virements, ajustements) */
function sensLigne(l){ if(!l.cat||l.cat===VIR||l.cat===AJU) return null; const m=maitreDe(l.cat); if(!m||m==='autres') return null;
  if(m==='revenus') return 'rev'; if(m==='pro') return l.montant>0?'rev':'dep'; return 'dep'; }
function statsBornes(){ const t=today();
  if(ui.sPer==='annee'){ const f=ui.sAn+'-12-31'; return [ui.sAn+'-01-01',f<t?f:t]; }
  if(ui.sPer==='12m'){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-11); return [isoD(d),t]; }
  let min=t; for(const x of Object.values(S.tx)) if(x.date<min) min=x.date; return [min.slice(0,7)+'-01',t]; }
function moisEntre(a,b){ const L=[]; let [y,m]=a.slice(0,7).split('-').map(Number); const fin=b.slice(0,7);
  for(let i=0;i<240;i++){ const k=y+'-'+String(m).padStart(2,'0'); if(k>fin) break; L.push(k); if(++m>12){ m=1; y++; } } return L; }

function statsCalc(){
  const [a,b]=statsBornes(), mois=moisEntre(a,b), parMois={}, parCat={}, parSous={}, parRev={}, pro={}, tags={}, nCat={}, L=[];
  mois.forEach(m=>{ parMois[m]={dep:0,rev:0}; });
  for(const t of Object.values(S.tx)){ if(t.date<a||t.date>b) continue;
    for(const l of lignes(t)){ const s=sensLigne(l); if(!s||!txScope(l.cat)) continue; const v=s==='dep'?-l.montant:l.montant, mo=t.date.slice(0,7), pm=parMois[mo];
      if(pm) pm[s]+=v;
      const m=maitreDe(l.cat); L.push({t,s,v,cat:l.cat,maitre:m,mois:mo,date:t.date,cle:cle(t.banque_nom||t.tiers),nom:t.tiers||t.banque_nom||''});
      if(s==='dep'){ parCat[m]=(parCat[m]||0)+v; parSous[l.cat]=(parSous[l.cat]||0)+v; nCat[m]=(nCat[m]||0)+1; } else parRev[l.cat]=(parRev[l.cat]||0)+v;
      if(estPro(l.cat)&&l.cat!=='pro'){ const p=pro[l.cat]=pro[l.cat]||{rev:0,dep:0}; p[s]+=v; }
      (t.tags||[]).forEach(g=>{ tags[g]=(tags[g]||0)-l.montant; }); } }

  const cs=comptesTri().filter(c=>!(c.devise&&c.devise!=='CHF')&&(ui.scope==='tout'||(ui.scope==='pro'?groupeDe(c)==='pro':groupeDe(c)!=='pro')));
  const veille=isoD(new Date(Date.parse(a+'T12:00')-864e5));
  const pat=[{d:a,m:'debut',v:r2(cs.reduce((x,c)=>x+(soldeAu(c,veille)||0),0))}].concat(mois.map(m=>{ const d=finMois(m)<b?finMois(m):b; return {d,m,v:r2(cs.reduce((x,c)=>x+(soldeAu(c,d)||0),0))}; }));

/* le détail d'une catégorie : mois par mois et commerçants (ou payeurs) */

/* Une opération règle une ou plusieurs dettes : elle prend leur catégorie (partagée si elles diffèrent) */
function reglerAvec(t,ids){
  const L=ids.map(id=>S.dettes[id]).filter(d=>d&&!d.reglee); if(!t||!L.length) return;
  let reste=Math.abs(t.montant); const P2=[];
  L.forEach(d=>{ const part=r2(Math.min(reste,d.montant)); if(part<=0) return; reste=r2(reste-part); P2.push([d,part]);
    d.paiements=(d.paiements||[]).concat([{tx:t.id,montant:part,date:t.date}]); if(d.montant_initial==null) d.montant_initial=d.montant;
    d.montant=r2(d.montant-part); if(d.montant<0.005){ d.montant=0; d.reglee=true; d.reglee_le=t.date; } });
  if(!P2.length) return;
  t.dette=P2.map(x=>x[0].id);
  if(!t.cat&&!(t.parts&&t.parts.length)){ const sg=t.montant<0?-1:1, def=sg>0?'revenus.remboursements':null, cats=P2.map(([d])=>d.cat||def);
    if(new Set(cats).size===1) t.cat=cats[0];
    else if(cats.every(Boolean)){ t.parts=P2.map(([d,m],i)=>({montant:sg*m,cat:cats[i]})); if(reste>0) t.parts[t.parts.length-1].montant=r2(t.parts[t.parts.length-1].montant+sg*reste); } }
}
function rouvrir(D){ (D.paiements||[]).forEach(p=>{ D.montant=r2(D.montant+p.montant); const t=p.tx&&S.tx[p.tx]; if(t&&t.dette){ t.dette=t.dette.filter(x=>x!==D.id); if(!t.dette.length) delete t.dette; } });

function delierPaiement(d,txid){
  const p=(d.paiements||[]).find(x=>x.tx===txid); if(!p) return;
  d.paiements=d.paiements.filter(x=>x!==p); d.montant=r2(d.montant+p.montant); d.reglee=false; d.reglee_le=null;
  const t=S.tx[txid]; if(t&&t.dette){ t.dette=t.dette.filter(x=>x!==d.id); if(!t.dette.length) delete t.dette; }
}
/* Pour une opération : la dette (ou le groupe de dettes d'une même personne) dont le montant tombe juste */

  const un=L.filter(d=>Math.abs(d.montant-m)<0.005); if(un.length===1) return [un[0].id];
  if(un.length>1){ const c=cle(t.banque_nom||t.tiers), bon=un.filter(d=>cle(d.personne)===c); return bon.length===1?[bon[0].id]:null; }
  const parP={}; L.forEach(d=>{ (parP[d.personne]=parP[d.personne]||[]).push(d); });
  const g=Object.values(parP).filter(G=>G.length>1&&Math.abs(G.reduce((x,d)=>x+d.montant,0)-m)<0.005);
  return g.length===1?g[0].map(d=>d.id):null;
}
function candidatsPaiement(d){
  const sg=signeDette(d), depuis=d.date?isoD(new Date(Date.parse(d.date+'T12:00')-7*864e5)):'0000', memes=dettesOuvertes().filter(x=>x.personne===d.personne&&signeDette(x)===sg);

const GENRES=[['voyage','Voyage'],['projet','Projet'],['événement','Événement'],['partage','Partage'],['autre','Autre']];
function genreNom(g){ const x=GENRES.find(y=>y[0]===g); return x?x[1]:''; }
function usageCat(){ const n={}; for(const t of Object.values(S.tx)) for(const l of lignes(t)) if(l.cat) n[l.cat]=(n[l.cat]||0)+1;
  for(const d of Object.values(S.dettes)) if(d.cat) n[d.cat]=(n[d.cat]||0)+1; for(const b of Object.values(S.budgets)) if(b.cible==='cat') n[b.ref]=(n[b.ref]||0)+1; return n; }
function usageTag(){ const n={}, net={}; for(const t of Object.values(S.tx)) for(const g of (t.tags||[])){ n[g]=(n[g]||0)+1; for(const l of lignes(t)) if(sensLigne(l)) net[g]=(net[g]||0)-l.montant; } return {n,net}; }
function navRetour(titre,vers,droite){ return '<div class="nav"><button class="rond" data-tab="'+vers+'" aria-label="Retour">'+svg(P.chevL,20)+'</button><b>'+titre+'</b>'+(droite||'<span style="width:44px"></span>')+'</div>'; }
function vCats(){
  const U=usageCat(), M=Object.values(S.cats).filter(c=>!c.parent&&c.id!=='autres').sort((a,b)=>(a.ordre||0)-(b.ordre||0));
  let h=navRetour('Catégories','reglages')+'<p class="note">Les catégories principales gardent leur couleur : tu peux les renommer ou les masquer. Les sous-catégories se créent, se renomment, se fusionnent ou se suppriment.</p>';
  M.forEach(m=>{ const subs=Object.values(S.cats).filter(c=>c.parent===m.id).sort((a,b)=>(a.ordre||0)-(b.ordre||0)), tot=(U[m.id]||0)+subs.reduce((x,s)=>x+(U[s.id]||0),0);
    h+='<section class="card cgrp'+(m.archive?' off':'')+'"><button class="crow maitre" data-ecat="'+esc(m.id)+'"><span class="dot" style="background:'+couleur(m.id)+'">'+svg(icCat(m.id),16,'#fff',2.2)+'</span><span class="cn">'+esc(m.nom)+(m.archive?' <span class="note">· masquée</span>':'')+'</span><span class="note">'+tot+'</span></button>'
      +subs.map(s=>'<button class="crow'+(s.archive?' off':'')+'" data-ecat="'+esc(s.id)+'"><span class="cn">'+esc(s.nom)+(s.archive?' <span class="note">· masquée</span>':'')+'</span><span class="note">'+(U[s.id]||0)+'</span></button>').join('')
      +'<button class="pill dash" data-nsub="'+esc(m.id)+'" style="height:34px;margin-top:6px">+ Sous-catégorie</button></section>'; });
  return h;
}
let ec=null;
function vCat(){
  const c=ec, C=c.id?S.cats[c.id]:null, U=usageCat(), n=c.id?U[c.id]||0:0, P0=S.cats[c.parent||(C&&C.parent)];
  let h='<div class="sh"><button class="ibtn" data-act="fermer" aria-label="Fermer">'+svg(P.x,24)+'</button><h2 id="sh-titre">'+(c.id?'Catégorie':'Sous-catégorie')+'</h2>'+okBtn('catsave')+'</div>';
  if(P0) h+='<p class="note">Dans <b>'+esc(P0.nom)+'</b>'+(c.id?' · '+n+' opération'+(n>1?'s':''):'')+'</p>';
  h+='<div class="field"><label class="lbl" for="c-nom">Nom</label><input class="input" id="c-nom" value="'+esc(c.nom)+'"></div>';
  if(!c.id&&P0&&!sousDe(P0.id).length&&(U[P0.id]||0)) h+='<p class="note">'+esc(P0.nom)+' n’a pas encore de sous-catégorie : ses '+U[P0.id]+' opérations restent dans « '+esc(P0.nom)+' », mais à la saisie il faudra ensuite choisir une sous-catégorie.</p>';
  if(C) h+='<label class="note chk"><input type="checkbox" id="c-arch"'+(c.archive?' checked':'')+'> Masquer à la saisie (l’historique la garde)</label>';
  if(C&&C.parent){ const cibles=catsTri().filter(x=>x.id!==C.id&&maitreDe(x.id)!=='autres'&&(x.parent||!sousDe(x.id).length));
    h+='<div class="field"><label class="lbl" for="c-fus">Fusionner dans</label><select class="sel" id="c-fus"><option value="">—</option>'+maitres().filter(m=>m.id!=='autres').map(m=>{ const L=cibles.filter(x=>maitreDe(x.id)===m.id); return L.length?'<optgroup label="'+esc(m.nom)+'">'+L.map(x=>'<option value="'+x.id+'"'+(c.fus===x.id?' selected':'')+'>'+esc(x.nom)+'</option>').join('')+'</optgroup>':''; }).join('')+'</select><p class="note">Ses opérations, dettes et budgets passent dans la catégorie choisie, puis elle disparaît.</p></div>'; }
  if(sheetErr) h+='<p class="err" role="alert">'+esc(sheetErr)+'</p>';
  if(C&&C.parent&&!n) h+='<button class="btn warn" data-act="catsuppr">Supprimer (pas utilisée)</button>';
  ouvrir(h);
}
function remplacerCat(a,b){
  for(const t of Object.values(S.tx)){ if(t.cat===a) t.cat=b; if(t.parts) t.parts.forEach(p=>{ if(p.cat===a) p.cat=b; }); }
  for(const d of Object.values(S.dettes)) if(d.cat===a) d.cat=b;
  for(const x of Object.values(S.budgets)) if(x.cible==='cat'&&x.ref===a) x.ref=b;
}
function enregistrerCat(){
  const g=id=>document.getElementById(id), nom=(g('c-nom').value||'').trim(), c=ec;
  if(!nom){ sheetErr='Donne-lui un nom.'; vCat(); return; }
  if(!c.id){ const id=c.parent+'.'+(slug(nom)||uid()), ex=S.cats[id];
    if(ex&&!ex.archive){ sheetErr='Cette sous-catégorie existe déjà.'; vCat(); return; }
    const ordre=Math.max(-1,...Object.values(S.cats).filter(x=>x.parent===c.parent).map(x=>x.ordre||0))+1;
    S.cats[id]=Object.assign({},ex||{},{id,nom,parent:c.parent,ordre,archive:false}); save(); fermer(); render(); return; }
  const C=S.cats[c.id]; C.nom=nom; if(g('c-arch')) C.archive=g('c-arch').checked;
  const fus=g('c-fus')&&g('c-fus').value;
  if(fus&&S.cats[fus]){ const n=usageCat()[C.id]||0; if(!confirm('Fusionner « '+catChemin(C.id)+' » ('+n+') dans « '+catChemin(fus)+' » ?')) return; remplacerCat(C.id,fus); delete S.cats[C.id]; }
  save(); fermer(); render();
}
function vTags(){
  const {n,net}=usageTag(), td=today(), L=Object.values(S.tags).sort((a,b)=>(!!a.archive-!!b.archive)||String(b.du||'').localeCompare(String(a.du||''))||a.nom.localeCompare(b.nom));
  let h=navRetour('Étiquettes','reglages','<button class="btn sm" data-act="ntag" style="width:auto">+ Nouvelle</button>')+'<p class="note">Les catégories disent à quoi sert l’argent, les étiquettes donnent le contexte (un voyage, un projet). Avec des dates et l’ajout automatique, chaque saisie et chaque import de la période reçoit l’étiquette.</p>';
  if(!L.length) return h+'<p class="empty">Aucune étiquette.</p>';
  h+='<section class="card">'+L.map(g=>{ const enc=g.actif&&g.du&&g.au&&td>=g.du&&td<=g.au;
    return '<button class="crow'+(g.archive?' off':'')+'" data-etag="'+esc(g.id)+'"><span class="cn">#'+esc(g.nom)+'<span class="note"> '+[genreNom(g.genre),g.du?(g.au&&g.au!==g.du?dDate(g.du)+' → '+dDate(g.au):dDate(g.du)):'',g.actif?'auto':'',g.archive?'masquée':''].filter(Boolean).map(esc).join(' · ')+'</span>'+(enc?' <span class="tg">en cours</span>':'')+'</span><span class="cv"><b class="num">'+fmt(r2(net[g.id]||0))+'</b><span class="note">'+(n[g.id]||0)+' op.</span></span></button>'; }).join('')+'</section>';
  return h;
}
let et=null;
function lireTag(){ const g=id=>document.getElementById(id); if(!et) return; if(g('g-nom')) et.nom=g('g-nom').value; if(g('g-du')) et.du=g('g-du').value; if(g('g-au')) et.au=g('g-au').value; if(g('g-auto')) et.actif=g('g-auto').checked; if(g('g-arch')) et.archive=g('g-arch').checked; if(g('g-fus')) et.fus=g('g-fus').value; }
function vTag(){
  const t=et, G=t.id?S.tags[t.id]:null, {n}=usageTag(), k=t.id?n[t.id]||0:0;
  let h='<div class="sh"><button class="ibtn" data-act="fermer" aria-label="Fermer">'+svg(P.x,24)+'</button><h2 id="sh-titre">'+'Étiquette'+'</h2>'+okBtn('tagsave')+'</div>';
  if(G) h+='<p class="note">'+k+' opération'+(k>1?'s':'')+'.</p>';
  h+='<div class="field"><label class="lbl" for="g-nom">Nom</label><input class="input" id="g-nom" value="'+esc(t.nom)+'" placeholder="Suède 2027, Van, Anniversaire…"></div>';
  h+='<div class="field"><span class="lbl">Genre</span><div class="pills">'+GENRES.map(([v,nm])=>'<button class="pill" data-gtype="'+v+'" aria-pressed="'+(t.genre===v)+'">'+nm+'</button>').join('')+'</div></div>';
  h+='<div class="filtres"><div class="field"><label class="lbl" for="g-du">Du</label><input class="input" type="date" id="g-du" value="'+esc(t.du||'')+'"></div><div class="field"><label class="lbl" for="g-au">Au</label><input class="input" type="date" id="g-au" value="'+esc(t.au||'')+'"></div></div>';
  h+='<label class="note chk"><input type="checkbox" id="g-auto"'+(t.actif?' checked':'')+'> Ajouter automatiquement aux saisies et aux imports de ces dates</label>';
  if(G) h+='<label class="note chk"><input type="checkbox" id="g-arch"'+(t.archive?' checked':'')+'> Masquer à la saisie (l’historique la garde)</label>';
  if(G){ const autres=Object.values(S.tags).filter(x=>x.id!==G.id).sort((a,b)=>a.nom.localeCompare(b.nom));
    if(autres.length) h+='<div class="field"><label class="lbl" for="g-fus">Fusionner dans</label><select class="sel" id="g-fus"><option value="">—</option>'+autres.map(x=>'<option value="'+esc(x.id)+'"'+(t.fus===x.id?' selected':'')+'>#'+esc(x.nom)+'</option>').join('')+'</select><p class="note">Ses opérations et budgets passent sur l’étiquette choisie, puis elle disparaît.</p></div>'; }
  if(sheetErr) h+='<p class="err" role="alert">'+esc(sheetErr)+'</p>';
  if(G) h+='<button class="btn warn" data-act="tagsuppr">Supprimer l’étiquette'+(k?' (elle est retirée de '+k+' opération'+(k>1?'s':'')+')':'')+'</button>';
  ouvrir(h);
}
function retirerTag(a,b){
  for(const t of Object.values(S.tx)){ if(!(t.tags||[]).includes(a)) continue; t.tags=t.tags.filter(x=>x!==a); if(b&&!t.tags.includes(b)) t.tags.push(b); }
  for(const x of Object.values(S.budgets)) if(x.cible==='tag'&&x.ref===a){ if(b) x.ref=b; else delete S.budgets[x.id]; }
  delete S.tags[a];
}
function enregistrerTag(){
  lireTag(); const t=et, nom=(t.nom||'').trim();
  if(!nom){ sheetErr='Donne-lui un nom.'; vTag(); return; }
  if(t.du&&t.au&&t.au<t.du){ sheetErr='La date de fin est avant la date de début.'; vTag(); return; }
  if(t.actif&&!(t.du&&t.au)){ sheetErr='Pour l’ajout automatique, indique les deux dates.'; vTag(); return; }
  let id=t.id; if(!id){ id=slug(nom)||uid(); if(S.tags[id]) id+='-'+uid().slice(-4); }
  if(t.id&&t.fus&&S.tags[t.fus]){ if(!confirm('Fusionner #'+S.tags[t.id].nom+' dans #'+S.tags[t.fus].nom+' ?')) return; retirerTag(t.id,t.fus); save(); fermer(); render(); return; }
  S.tags[id]=Object.assign({},S.tags[id]||{},{id,nom,genre:t.genre||null,du:t.du||null,au:t.au||null,actif:!!t.actif,archive:!!t.archive});
  save(); fermer(); render();
}

/* =============================== Budgets =============================== */
function fenetre(b,ref){ const t=ref||today();
  if(b.periode==='mois') return [t.slice(0,7)+'-01',finMois(t.slice(0,7))];
  if(b.periode==='annee') return [t.slice(0,4)+'-01-01',t.slice(0,4)+'-12-31'];
  if(b.periode==='dates') return [b.du||'0000-01-01',b.au||'9999-12-31'];
  return ['0000-01-01','9999-12-31']; }
function depense(b,a,z){ let s=0;
  for(const t of Object.values(S.tx)){ if(t.date<a||t.date>z) continue;
    if(b.cible==='tag'){ if((t.tags||[]).includes(b.ref)) for(const l of lignes(t)) if(sensLigne(l)) s-=l.montant; }
    else for(const l of lignes(t)) if(sensLigne(l)==='dep'&&(l.cat===b.ref||maitreDe(l.cat)===b.ref)) s-=l.montant; }
  return r2(s); }
function nomBudget(b){ return b.cible==='tag'?'#'+(S.tags[b.ref]?S.tags[b.ref].nom:b.ref):catNom(b.ref); }
function libPeriode(b){ return b.periode==='mois'?'ce mois':b.periode==='annee'?'cette année':b.periode==='dates'?(b.du?dDate(b.du):'…')+' → '+(b.au?dDate(b.au):'…'):'au total'; }
function etatBudget(b){ const [a,z]=fenetre(b), dep=depense(b,a,z), t=today(); let rythme=null;
  if(b.periode!=='total'){ const tot=jours(z,a)+1; if(a<=t&&t<=z&&tot>1) rythme=(jours(t,a)+1)/tot; }
  return {a,z,dep,reste:r2(b.montant-dep),part:b.montant>0?dep/b.montant:0,rythme,finJ:t<=z&&t>=a?jours(z,t):null}; }
function couleurBudget(b){ return b.cible==='tag'?SERIE.pat:couleur(b.ref); }
function carteBudgets(){
  const L=Object.values(S.budgets).filter(b=>!b.archive).sort((x,y)=>(x.ordre||0)-(y.ordre||0)||nomBudget(x).localeCompare(nomBudget(y)));
  let h='<section class="card" aria-labelledby="t-bud"><div class="st"><h2 id="t-bud">Budgets</h2><button class="pill dash" data-act="nbudget" style="height:34px">+ Budget</button></div>';
  if(!L.length) return h+'<p class="note" style="margin-top:4px">Fixe-toi une limite par catégorie (par mois, par année, entre deux dates) ou pour une étiquette (un voyage, un projet).</p></section>';
  h+='<div class="buds">'+L.map(b=>{ const E=etatBudget(b), col=couleurBudget(b), dep=E.part>1;
    const txt=dep?'<span class="retard">Dépassé de '+fmt(-E.reste)+'</span>':'Reste '+fmt(E.reste)+(E.finJ!=null&&b.periode!=='total'?' · '+(E.finJ===0?'dernier jour':'encore '+E.finJ+' j'):'')+(E.rythme!=null&&E.part>E.rythme*1.1&&E.part>0.2?' · <span class="vite">un peu vite</span>':'');
    return '<button class="bud" data-ebud="'+esc(b.id)+'"><span class="bud-h"><span class="bud-n">'+esc(nomBudget(b))+' <span class="note">· '+esc(libPeriode(b))+'</span></span><span class="num"><b>'+fmt0(E.dep)+'</b><span class="note"> / '+fmt0(b.montant)+'</span></span></span>'
      +'<span class="bud-t" role="img" aria-label="'+Math.round(E.part*100)+' % utilisé"><i style="width:'+Math.min(100,E.part*100)+'%;background:'+(dep?'var(--neg)':col)+'"></i>'+(E.rythme!=null?'<em style="left:'+(E.rythme*100)+'%" title="Où tu devrais en être aujourd’hui"></em>':'')+'</span><span class="note">'+txt+'</span></button>'; }).join('')+'</div>';
  if(L.some(b=>etatBudget(b).rythme!=null)) h+='<p class="note" style="margin-top:6px">Le petit trait montre où tu devrais en être aujourd’hui pour finir pile.</p>';
  return h+'</section>';
}
let eb=null;
function lireBudget(){ const g=id=>document.getElementById(id); if(!eb) return; if(g('b-ref')) eb.ref=g('b-ref').value; if(g('b-montant')) eb.montant=g('b-montant').value; if(g('b-du')) eb.du=g('b-du').value; if(g('b-au')) eb.au=g('b-au').value; }
function vBudget(){
  const b=eb, B=b.id?S.budgets[b.id]:null, t=today();
  let h='<div class="sh"><button class="ibtn" data-act="fermer" aria-label="Fermer">'+svg(P.x,24)+'</button><h2 id="sh-titre">'+'Budget'+'</h2>'+okBtn('budsave')+'</div>';
  h+=seg('bcible',b.cible,[['cat','Catégorie'],['tag','Étiquette']],'Budget sur');
  if(b.cible==='cat') h+='<div class="field"><label class="lbl" for="b-ref">Catégorie</label><select class="sel" id="b-ref"><option value="">Choisis…</option>'+maitres().filter(m=>m.id!=='autres'&&m.id!=='revenus').map(m=>{ const ss=sousDe(m.id); return '<optgroup label="'+esc(m.nom)+'"><option value="'+m.id+'"'+(b.ref===m.id?' selected':'')+'>'+esc(m.nom)+(ss.length?' (tout)':'')+'</option>'+ss.map(s=>'<option value="'+s.id+'"'+(b.ref===s.id?' selected':'')+'>'+esc(s.nom)+'</option>').join('')+'</optgroup>'; }).join('')+'</select></div>';
  else h+='<div class="field"><label class="lbl" for="b-ref">Étiquette</label><select class="sel" id="b-ref"><option value="">Choisis…</option>'+Object.values(S.tags).filter(g=>!g.archive||g.id===b.ref).sort((x,y)=>String(y.du||'').localeCompare(String(x.du||''))||x.nom.localeCompare(y.nom)).map(g=>'<option value="'+esc(g.id)+'"'+(b.ref===g.id?' selected':'')+'>#'+esc(g.nom)+'</option>').join('')+'</select></div>';
  h+='<div class="field"><span class="lbl">Période</span>'+seg('bper',b.periode,[['mois','Par mois'],['annee','Par année'],['dates','Dates'],['total','Au total']],'Période du budget')+'</div>';
  if(b.periode==='dates') h+='<div class="filtres"><div class="field"><label class="lbl" for="b-du">Du</label><input class="input" type="date" id="b-du" value="'+esc(b.du||'')+'"></div><div class="field"><label class="lbl" for="b-au">Au</label><input class="input" type="date" id="b-au" value="'+esc(b.au||'')+'"></div></div>';
  h+='<div class="field"><label class="lbl" for="b-montant">Montant (CHF)</label><input class="input num" id="b-montant" inputmode="decimal" value="'+esc(b.montant)+'" style="font-size:22px;height:52px"></div>';
  if(b.ref){ const x={cible:b.cible,ref:b.ref,periode:b.periode,du:b.du,au:b.au};
    if(b.periode==='mois'){ const L=[]; let [y,m]=t.slice(0,7).split('-').map(Number); for(let i=0;i<6;i++){ if(--m<1){ m=12; y--; } const k=y+'-'+String(m).padStart(2,'0'); L.push([k,depense(x,k+'-01',finMois(k))]); }
      let m0=today(); for(const x of Object.values(S.tx)) if(x.date<m0) m0=x.date; m0=m0.slice(0,7);
      const avec=L.filter(z=>z[0]>=m0), moy=avec.length?r2(avec.reduce((s,z)=>s+z[1],0)/avec.length):0, bm=num(b.montant);
      h+='<section class="card"><p class="note" style="margin:0">Moyenne des '+avec.length+' derniers mois complets : <b>'+fmt(moy)+'</b> par mois.</p><div class="hist">'+avec.slice().reverse().map(([k,v])=>'<span class="'+(bm&&v>bm?'neg':'')+'"><span class="note">'+esc(moisCourt(k))+'</span><b class="num">'+fmt0(v)+'</b></span>').join('')+'</div></section>'; }
    else { const [a,z]=fenetre(x); h+='<p class="note">Déjà dépensé sur cette période : <b>'+fmt(depense(x,a,z))+'</b>.</p>'; } }
  if(sheetErr) h+='<p class="err" role="alert">'+esc(sheetErr)+'</p>';
  if(B) h+='<button class="btn warn" data-act="budsuppr">Supprimer ce budget</button>';
  ouvrir(h);
}
function enregistrerBudget(){
  lireBudget(); const b=eb, m=num(b.montant);
  if(!b.ref){ sheetErr=b.cible==='tag'?'Choisis une étiquette.':'Choisis une catégorie.'; vBudget(); return; }
  if(!m||m<=0){ sheetErr='Indique un montant.'; vBudget(); return; }
  if(b.periode==='dates'&&!(b.du&&b.au)){ sheetErr='Indique les deux dates.'; vBudget(); return; }
  if(b.periode==='dates'&&b.au<b.du){ sheetErr='La date de fin est avant la date de début.'; vBudget(); return; }
  const id=b.id||'b'+uid(), old=S.budgets[id]||{};
  S.budgets[id]=Object.assign({},old,{id,cible:b.cible,ref:b.ref,montant:r2(m),periode:b.periode,du:b.periode==='dates'?b.du:null,au:b.periode==='dates'?b.au:null,cree:old.cree||new Date().toISOString()});
  save(); fermer(); render();
}

/* =============================== Export =============================== */
let ex=null, exMsg='', exErr=false;
const EXDEF={format:'md',per:'annee',du:'',au:'',scope:'tout',comptes:null,ops:true,resume:true,soldes:true,listes:true,dettes:true,budgets:true,virements:false,notes:true,tiers:true,anonyme:false,lieux:true,orig:true};
function ouvrirExport(){ let o=null; try{ o=JSON.parse(localStorage.getItem('banque-export')||'null'); }catch(e){}
  ex=Object.assign({},EXDEF,o||{}); const ids=comptesTous().map(c=>c.id); ex.comptes=(ex.comptes||ids).filter(id=>S.comptes[id]); if(!ex.comptes.length) ex.comptes=ids; exMsg=''; vExport(); }
function lireExport(){ if(!ex) return; const g=id=>document.getElementById(id);
  document.querySelectorAll('[data-exo]').forEach(i=>{ ex[i.dataset.exo]=i.checked; });
  const cs=[...document.querySelectorAll('[data-exc]')]; if(cs.length) ex.comptes=cs.filter(i=>i.checked).map(i=>i.dataset.exc);
  if(g('x-du')) ex.du=g('x-du').value; if(g('x-au')) ex.au=g('x-au').value; }
function bornesExport(o){ const t=today();
  if(o.per==='annee') return [t.slice(0,4)+'-01-01',t];

const RYTHMES={semaine:[7,'chaque semaine',3,52],deuxsem:[14,'toutes les 2 semaines',4,26],mois:[30.44,'chaque mois',7,12],trimestre:[91.3,'tous les 3 mois',15,4],annee:[365.25,'chaque année',30,1]};

  else if(a==='fermerdoc') fermerDoc();
  else if(a==='ijok'){ if(!ij) return; appliquerJustificatifs().then(([j,c])=>{ fermer(); render(); setTimeout(()=>alert(j+' justificatif'+(j>1?'s':'')+' joint'+(j>1?'s':'')+', '+c+' opération'+(c>1?'s':'')+' créée'+(c>1?'s':'')+'.'),50); }); }
  else if(a==='importok'){ if(!imp) return; const n=appliquerImport(imp); fermer(); const o=orphelines().length; if(aClasser().length||o) ui.tab='rappro'; ui.limite=150; window.scrollTo(0,0); render(); setTimeout(()=>alert(n+' ligne'+(n>1?'s':'')+' du relevé importée'+(n>1?'s':'')+'.'+(o?'\n\n⚠ '+o+' saisie'+(o>1?'s':'')+' pas retrouvée'+(o>1?'s':'')+' dans le relevé : à vérifier, sinon le solde est faux.':'')),50); }
  else if(a==='toutvalider'){ const H=historique(); let n=0; aClasser().forEach(t=>{ const dm=detteQuiColle(t); if(dm){ reglerAvec(t,dm); n++; return; } const p=twintPersonne(t)?null:proposer(t,H); if(p&&p.sure&&S.cats[p.cat]){ t.cat=p.cat; n++; } }); if(n){ save(); render(); } }
  else if(a==='nouvelledette') nouvelleDette();
  else if(a==='nrecur'){ er={id:null,nom:'',sens:'sortie',montant:'',compte:dernierCompte(),rythme:'annee',debut:'',cat:''}; sheetErr=''; vRecurEdit(); }
  else if(a==='recursave') enregistrerRecur();
  else if(a==='recursuppr'){ if(er&&er.id&&confirm('Supprimer « '+er.nom+' » ?')){ const c=S.regl.recurrents=Object.assign({},S.regl.recurrents||{}); delete c[er.id]; save(); fermer(); render(); } }
  else if(a==='exporter') ouvrirExport();
  else if(a==='exportdl') telechargerExport();
  else if(a==='exportcopie') copierExport();
  else if(a==='catsave') enregistrerCat();
  else if(a==='catsuppr'){ const C=ec&&S.cats[ec.id]; if(C&&confirm('Supprimer « '+catChemin(C.id)+' » ?')){ delete S.cats[C.id]; save(); fermer(); render(); } }
  else if(a==='ntag'){ et={id:null,nom:'',genre:'voyage',du:'',au:'',actif:false,archive:false}; sheetErr=''; vTag(); }
  else if(a==='tagsave') enregistrerTag();
  else if(a==='tagsuppr'){ const G=et&&S.tags[et.id]; if(G&&confirm('Supprimer #'+G.nom+' ? Elle sera retirée de toutes ses opérations.')){ retirerTag(G.id,null); save(); fermer(); render(); } }
  else if(a==='nbudget'){ eb={id:null,cible:'cat',ref:'',montant:'',periode:'mois',du:'',au:''}; sheetErr=''; vBudget(); }
  else if(a==='budsave') enregistrerBudget();
  else if(a==='budsuppr'){ const B=eb&&S.budgets[eb.id]; if(B&&confirm('Supprimer le budget « '+nomBudget(B)+' » ?')){ delete S.budgets[B.id]; save(); fermer(); render(); } }
  else if(a==='dettesave') enregistrerDette();
  else if(a==='dettepayer'){ lireDette(); dd.payer=true; vDette(); }
  else if(a==='paieretour'){ dd.payer=false; vDette(); }
  else if(a==='payesans'){ const D=dd&&S.dettes[dd.id]; if(D&&confirm('Marquer « '+(D.objet||D.personne)+' » comme payée, sans opération liée ?')){ if(D.montant_initial==null) D.montant_initial=D.montant; D.paiements=(D.paiements||[]).concat([{tx:null,montant:D.montant,date:today()}]); D.montant=0; D.reglee=true; D.reglee_le=today(); save(); fermer(); render(); } }
  else if(a==='detterouvrir'){ const D=dd&&S.dettes[dd.id]; if(D){ rouvrir(D); save(); ouvrirDette(D.id); render(); } }
  else if(a==='dettesuppr'){ const D=dd&&S.dettes[dd.id]; if(D&&confirm('Supprimer la dette « '+(D.objet||D.personne)+' » ?')){ (D.paiements||[]).forEach(p=>{ const t=p.tx&&S.tx[p.tx]; if(t&&t.dette){ t.dette=t.dette.filter(x=>x!==D.id); if(!t.dette.length) delete t.dette; } }); delete S.dettes[D.id]; save(); fermer(); render(); } }
  else if(a==='voirreglees'){ ui.dReglees=!ui.dReglees; render(); }
  else if(a==='frequentes'){ lireChamps(); draft.toutes=false; vSaisie(); }
  else if(a==='voirTiers'){ lireChamps(); draft.voirTiers=true; vSaisie(); setTimeout(()=>{ const i=document.getElementById('s-tiers'); if(i) i.focus(); },30); }
  else if(a==='etiqplus'){ lireChamps(); draft.toutesEtiq=true; vSaisie(); }
  else if(a==='etiqmoins'){ lireChamps(); draft.toutesEtiq=false; vSaisie(); }
  else if(a==='voirNote'){ lireChamps(); draft.voirNote=true; vSaisie(); setTimeout(()=>{ const i=document.getElementById('s-note'); if(i) i.focus(); },30); }
  else if(a==='partager'){ lireChamps(); const m=num(draft.montant)||0; draft.parts=[{montant:m?String(m):'',cat:draft.cat},{montant:'',cat:null}]; vSaisie(); }
  else if(a==='partajout'){ lireChamps(); const tot=num(draft.montant)||0, s=draft.parts.reduce((x,p)=>x+(num(p.montant)||0),0); draft.parts.push({montant:tot-s>0?String(r2(tot-s)):'',cat:null}); vSaisie(); }
  else if(a==='partstop'){ lireChamps(); draft.cat=draft.parts[0]&&draft.parts[0].cat; draft.maitre=draft.cat?maitreDe(draft.cat):null; draft.parts=null; vSaisie(); }
  else if(a==='nouveautag'){ lireChamps(); const nom=(prompt('Nom de l’étiquette (un voyage, un projet…) :')||'').trim(); if(!nom) return; const id=slug(nom)||uid(); if(!S.tags[id]) S.tags[id]={id,nom}; if(!draft.tags.includes(id)) draft.tags.push(id); save(); vSaisie(); }
  else if(a==='plus'){ ui.limite+=300; render(); }
  else if(a==='cplus'){ ui.cLim=(ui.cLim||100)+300; render(); }
  else if(a==='cvaleur'){ const c=S.comptes[ui.cpt], i=document.getElementById('c-valeur'), v=i&&num(i.value); if(!c||v==null||isNaN(v)){ if(i) i.focus(); return; } mettreValeur(c,v); save(); render(); }
  else if(a==='espok'){ const c=comptesTri().find(x=>typeDe(x)==='especes'), i=document.getElementById('p-esp'), v=i&&i.value.trim()?num(i.value):null;
    if(c&&v!=null&&!isNaN(v)){ const e=r2(v-solde(c)); if(Math.abs(e)>=0.005){ const id=uid(); S.tx[id]={id,date:today(),compte:c.id,montant:e,tiers:'Comptage des espèces',cat:AJU,tags:[],note:'Compté : '+fmt(v)+' (Banque disait '+fmt(r2(v-e))+')',parts:null,autre:null,lien:null,source:'saisie',cree:new Date().toISOString(),sans_banque:true}; } }
    S.regl.especesVu=lundiDe(today()); save(); render(); }
  else if(a==='gdtco'){ const m=(document.getElementById('g-mail')||{}).value, pw=(document.getElementById('g-pass')||{}).value; if(!m||!pw){ gdtMsg='Tape ton e-mail et ton mot de passe GDT.'; render(); return; }
    const c=gdtClient(); if(!c) return; gdtMsg=''; c.auth.signInWithPassword({email:m.trim(),password:pw}).then(({error})=>{ if(error){ gdtMsg='Connexion à GDT impossible : '+(error.message||error); render(); return; }
      S.regl.gdt=Object.assign({depuis:'2026-01-01',compte:'bas-cc'},gdtCfg(),{co:true}); save(); render(); syncGdt(true); }); }
  else if(a==='gdtsync') syncGdt(true);
  else if(a==='gdtdeco'){ if(!confirm('Délier GDT ? Les opérations déjà reliées restent comme elles sont.')) return; const c=gdtClient(); if(c) c.auth.signOut(); S.regl.gdt={ignore:gdtCfg().ignore||{},depuis:gdtCfg().depuis}; gdtMsg=''; save(); render(); }
  else if(a==='gdtok'){ if(!gdtP) return; const n=appliquerGdt(gdtP,gdtP.ajout); gdtP=null; fermer(); render(); setTimeout(()=>alert('GDT : '+n+' changement'+(n>1?'s':'')+' dans Banque.'),50); }
  else if(a==='gretour'){ ui.gChoix=null; vGdt(); }
  else if(a==='gplus'){ ui.gLim=9999; vGdt(); }
  else if(a==='pointok'){ S.regl.point=lundiDe(today()); save(); render(); }
  else if(a==='reglages'){ ui.tab='reglages'; render(); }
  else if(a==='charger') document.getElementById('fichier').click();
  else if(a==='synchro'){ syncErr=''; pull().then(()=>push()).then(()=>render()); }
  else if(a==='export'){ const blob=new Blob([JSON.stringify({exporte:new Date().toISOString(),donnees:rowsOf(S)},null,1)],{type:'application/json'}); const u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='banque-sauvegarde-'+today()+'.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
  else if(a==='logout'){ if(!confirm('Te déconnecter ?'+(dirty.size?' '+dirty.size+' changement(s) ne sont pas encore envoyés.':''))) return; try{ localStorage.removeItem(CK()); }catch(err){} UID=null; sb.auth.signOut().finally(()=>location.reload()); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-periode'){ ui.periode=t.value; ui.limite=150; render(); }
  else if(t.id==='f-compte'){ ui.fCompte=t.value; render(); }
  else if(t.id==='f-cat'){ ui.fCat=t.value; render(); }
  else if(t.id==='f-tag'){ ui.fTag=t.value; if(t.value) ui.periode='tout'; render(); }
  else if(eb&&(t.id==='b-ref'||t.id==='b-du'||t.id==='b-au')){ lireBudget(); vBudget(); }
  else if(ex&&(t.dataset.exo||t.dataset.exc||t.id==='x-du'||t.id==='x-au')){ lireExport(); exMsg=''; vExport(); }
  else if((t.id==='s-doc'||t.id==='s-cam')&&draft){ const fs=[...(t.files||[])]; t.value=''; if(!fs.length) return; lireChamps(); const tid=draft.id||(draft.newId=draft.newId||uid()); sheetErr='';
    (async()=>{ for(const f of fs){ try{ const id=await ajouterDoc(tid,f); draft.docs.push(id); }catch(err){ sheetErr=(f.name||'Fichier')+' : '+(err.message||err); } } const tx=S.tx[tid]; if(tx){ tx.docs=draft.docs.slice(); } save(); vSaisie(); envoyerDocs(); })(); }
  else if(t.id==='imp-histo'&&imp){ const h=t.checked; imp=preparerAvecBrut(JSON.parse(imp.brut),Object.assign({},imp.meta,{historique:h})); vImport(); }
  else if(t.dataset.impvers!=null&&imp){ const m=imp.nouveaux[+t.dataset.impvers]; if(m){ m.vers=t.value||null; vImport(); } }
  else if(t.dataset.solde){ const c=S.comptes[t.dataset.solde]; if(c){ c.solde_initial=num(t.value); save(); render(); } }
  else if(t.dataset.nomc){ const c=S.comptes[t.dataset.nomc], v=t.value.trim(); if(c&&v){ c.nom=v; save(); render(); } }
  else if(t.dataset.groupe){ const c=S.comptes[t.dataset.groupe]; if(c){ c.groupe=t.value; c.pro=t.value==='pro'; save(); render(); } }
  else if(t.dataset.archive){ const c=S.comptes[t.dataset.archive]; if(c){ c.archive=t.checked; save(); render(); } }
  else if(t.dataset.valeur){ const c=S.comptes[t.dataset.valeur], v=num(t.value); if(!c||v==null) return; mettreValeur(c,v); save(); render(); }
  else if(t.id==='s-tiers'&&draft&&!draft.cat&&!draft.parts){ lireChamps(); const q=draft.tiers.trim().toLowerCase(); if(!q) return;
    const ex=Object.values(S.tx).filter(x=>!estVir(x)&&x.source!=='miroir'&&x.cat&&(x.tiers||'').toLowerCase()===q&&(draft.type==='depense'?x.montant<0:x.montant>0)).sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(ex){ draft.cat=ex.cat; draft.maitre=maitreDe(ex.cat); vSaisie(); } }
  else if(t.dataset.partC!=null||t.dataset.partM!=null){ lireChamps(); vSaisie(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='s-montant'&&draft){ const v=e.target.value.replace(/[^0-9.,]/g,''); if(v!==e.target.value) e.target.value=v; draft.montant=v; const c=!num(v)?'var(--muted)':draft.type==='depense'?'var(--neg)':draft.type==='revenu'?'var(--pos)':'var(--text)'; e.target.style.color=c; const sg=document.getElementById('s-sg'); if(sg) sg.style.color=c; return; }
  if(e.target.id==='g-q'){ ui.gQ=e.target.value; const m=gdtP&&gdtP.introuvables.find(x=>x.gk===ui.gChoix), L=document.getElementById('g-liste'); if(m&&L) L.innerHTML=gdtListe(m); return; }
  if(e.target.id==='f-q'){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const i=document.getElementById('f-q'); if(i){ i.focus(); try{ i.setSelectionRange(pos,pos); }catch(x){} } } });
document.addEventListener('keydown',e=>{
  const dv=document.getElementById('docv'); if(dv&&!dv.hidden&&e.key==='Escape'){ e.preventDefault(); fermerDoc(); return; }
  if($scrim.hidden) return;
  if(e.key==='Escape'&&!draft){ e.preventDefault(); fermer(); return; }
  if(!draft) return;
  const champ=/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
  if(e.key==='Escape'){ e.preventDefault(); fermer(); return; }
  if(e.key==='Enter'&&(!champ||e.target.type!=='date')){ e.preventDefault(); enregistrer(); return; }
  if(champ) return;
  if(/^[0-9.,]$/.test(e.key)||e.key==='Backspace'){ const i=document.getElementById('s-montant'); if(i){ i.focus(); const v=i.value.length; try{ i.setSelectionRange(v,v); }catch(x){} } }
});
$scrim.addEventListener('click',e=>{ if(e.target===$scrim) fermer(); });
document.getElementById('f-just').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ ij=await preparerJustificatifs(f); draft=null; vJustif(); }
  catch(err){ ij=null; alert('Impossible de lire ce lot de justificatifs : '+(err.message||err)); }
});
document.getElementById('f-yuh').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ imp=await preparerFichier(f); draft=null; vImport(); }
  catch(err){ imp=null; alert('Impossible de lire ce relevé : '+(err.message||err)); }
});
document.getElementById('fichier').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const D=JSON.parse(await f.text()); const n=importer(D); ui.tab='accueil'; render(); alert(n+' opérations chargées. Elles partent maintenant vers ta base.'); }
  catch(err){ const out=document.getElementById('r-import'); const msg='Impossible de lire ce fichier : '+(err.message||err); if(out) out.textContent=msg; else alert(msg); }
});

/* =============================== Démarrage =============================== */
function showLogin(msg){ booted=false; document.getElementById('login').hidden=false; const er=document.getElementById('l-err'); er.hidden=!msg; er.textContent=msg||''; try{ document.getElementById('l-mail').focus(); }catch(e){} }
async function enter(user){
  UID=user.id; EMAIL=user.email||''; document.getElementById('login').hidden=true;
  let c=null; try{ c=JSON.parse(localStorage.getItem(CK())||'null'); }catch(e){}
  if(c){ prev=c.prev||{}; dirty=new Set(c.dirty||[]); lastPull=c.lastPull||null; }
  S=fromRows(prev); booted=true; render(); setSync();
  await pull(!c); if(!Object.keys(S.cats).length){ semerCategories(); save(); render(); }
  push(); setTimeout(envoyerDocs,2500);
  if(gdtCfg().me) setTimeout(()=>syncGdt(false),1500);
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); const mail=document.getElementById('l-mail').value.trim(), pass=document.getElementById('l-pass').value;
  try{ const {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass}); if(error) throw error; await enter(data.user); }
  catch(err){ showLogin('Connexion impossible : '+((err&&err.message)||err)); }
});
async function start(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('../sw.js',{scope:'../'}); }catch(e){} }
  if(!window.supabase||!window.supabase.createClient){ $view.innerHTML='<p class="empty">Impossible de charger l’app. Recharge la page.</p>'; return; }
  try{ if(!localStorage.getItem('orga-auth')&&localStorage.getItem('etabli-auth')) localStorage.setItem('orga-auth',localStorage.getItem('etabli-auth')); }catch(e){}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'orga-auth'}});
  let session=null; try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(session&&session.user) await enter(session.user); else showLogin();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'&&UID){ UID=null; showLogin(); } });
  addEventListener('online',()=>{ setSync(); pull().then(()=>push()).then(()=>envoyerDocs()); });
  addEventListener('offline',()=>setSync());
  document.addEventListener('visibilitychange',()=>{ if(!UID) return; if(document.visibilityState==='visible') pull().then(()=>push()); else push(); });
  setInterval(()=>{ if(UID&&document.visibilityState==='visible') pull(); },60000);
}
render(); start();
</script>
