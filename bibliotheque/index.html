<!doctype html>
<html lang="fr" data-lieu="bibliotheque">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Bibliothèque</title>
<meta name="theme-color" content="#5E1F2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icons/tete-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* La Bibliothèque : charte du 15.11 (commun/CHARTE.md) : une reliure. Murs bordeaux (le fond), pages claires (le contenu),
   dorure pour l'accent ; polices et formes de la Forge. Les jetons du lieu viennent de commun/lieux.css. */
:root{
  --bg:var(--surface); --card:var(--surface-3); --line2:var(--line); --text:var(--ink); --muted:var(--on-page-2); --bord:var(--accent-ink); --bord2:color-mix(in srgb,var(--accent-ink) 80%,#000); --bordpale:color-mix(in srgb,var(--accent-ink) 12%,var(--surface));
  --body:var(--f-body); --serif:var(--f-display); --mono:var(--f-mono);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--bord);outline-offset:2px}
main{max-width:820px;margin:12px auto calc(110px + env(safe-area-inset-bottom,0px));padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px;background:var(--surface);color:var(--ink);border-radius:var(--r);min-height:60vh;--muted:var(--ink-3)}
@media (max-width:860px){main{margin-left:max(8px,env(safe-area-inset-left,0px));margin-right:max(8px,env(safe-area-inset-right,0px))}}
h2.titre{margin:4px 0 0;font:700 1.45rem/1.15 var(--serif);letter-spacing:-.025em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2.titre small{font:400 .9rem var(--body);color:var(--muted)}
.cap{font:400 .7rem/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:6px 0 -6px}
.note{color:var(--muted);font-size:.88rem;margin:0}
.carte{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);--muted:var(--ink-3)}
.alerte{background:var(--bordpale);border:1px solid color-mix(in srgb,var(--accent-ink) 25%,var(--surface));border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;color:var(--text);--muted:var(--ink-3)}
.btn{border:0;background:var(--bord);color:var(--on-ink);font-weight:600;border-radius:var(--pill);padding:10px 18px}
.btn2{border:1px solid var(--line2);background:var(--card);border-radius:var(--pill);padding:8px 16px;font-weight:600;color:var(--text);--muted:var(--ink-3)}
.lien{border:0;background:none;color:var(--bord);font-weight:600;padding:4px 0;text-align:left}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.in{width:100%;border:1px solid var(--line2);background:var(--surface-3);border-radius:12px;padding:11px 14px;color:var(--text);--muted:var(--ink-3)}
.capture{display:flex;gap:8px}
.capture .in{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.88rem;color:var(--text);--muted:var(--ink-3)}
a.chip{color:inherit;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--bord);border-color:var(--bord);color:var(--on-ink)}
/* arbre des projets */
.dom{margin-top:8px}
.dom>button{display:flex;gap:8px;align-items:baseline;width:100%;border:0;background:none;text-align:left;padding:8px 0 4px;font:700 1.02rem var(--serif);letter-spacing:-.02em;border-bottom:2px solid var(--text)}
.dom>button small{font:400 .8rem var(--mono);color:var(--muted);margin-left:auto}
.plist{list-style:none;margin:0;padding:0}
.plist button{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:9px 4px}
.plist button:hover{background:var(--card);color:var(--text);--muted:var(--ink-3)}
.plist .nm{flex:1;font-weight:600}
.plist .et{font-size:.75rem;font-family:var(--mono);color:var(--muted)}
.plist .nb{font-size:.75rem;font-family:var(--mono);color:var(--muted);min-width:3ch;text-align:right}
.plist .arch .nm{color:var(--muted);font-weight:400}
/* onglet Notes : la ligne « Domaines » (15.11) */
.olx{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:8px 6px 4px;color:var(--text);--muted:var(--ink-3)}
.olx+.ol{border-top:0;border-radius:0 0 14px 14px;padding-top:0}
.olx .ln{grid-template-columns:22px 1fr}
.olx .lnk{border:0;background:none;text-align:left;padding:5px 2px;line-height:1.35;min-height:30px;display:flex;gap:8px;align-items:baseline;font-weight:600}
.olx .lnk small{font:400 .75rem var(--mono);color:var(--muted)}
.olx .lnk.arch{color:var(--muted);font-weight:400}
.plinks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);--muted:var(--ink-3)}
.plinks a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.plinks li:last-child a{border-bottom:0}
.plinks .nm{flex:1;font-weight:600}.plinks .et{font:400 .75rem var(--mono);color:var(--muted)}.plinks .go{color:var(--bord);font-weight:700}
.plinks .arch .nm{color:var(--muted);font-weight:400}
/* trois vues des Notes (26.11) */
.vues{display:inline-flex;margin-left:auto;border:1px solid var(--line2);border-radius:var(--pill);overflow:hidden;background:var(--card);font:600 .8rem var(--body);letter-spacing:0}
.vues button{border:0;background:none;padding:6px 10px;display:flex;gap:5px;align-items:center;color:var(--ink)}
.vues button[aria-pressed="true"]{background:var(--bord);color:#FFF6EC}
.vues .ic{width:15px;height:15px;vertical-align:0}
@media (max-width:520px){.vues button span{display:none}}
h2.titre{align-items:center}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc,var(--muted));margin-right:6px;vertical-align:0;flex:none}
.filtres{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filtres .chip{white-space:nowrap;display:flex;align-items:center}
.murs{columns:2 150px;column-gap:10px}
@media (min-width:700px){.murs{columns:3 190px}}
.pi{display:block;width:100%;break-inside:avoid;margin:0 0 10px;border:0;border-radius:4px 4px 16px 4px;background:color-mix(in srgb,var(--pc) 42%,#FFFDF7);color:#2B2320;text-align:left;padding:12px 12px 9px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 5px 12px rgba(40,10,16,.12)}
.pi b{display:block;font:700 1rem/1.2 var(--serif);letter-spacing:-.015em;margin-bottom:5px;overflow-wrap:anywhere}
.pi span{display:block;font-size:.86rem;line-height:1.35;white-space:pre-line;max-height:8em;overflow:hidden;overflow-wrap:anywhere}
.pi small{display:block;margin-top:8px;font:400 .68rem var(--mono);opacity:.7}
.nliste{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.nliste button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;color:var(--ink)}
.nliste li:last-child button{border-bottom:0}
.nliste b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nliste small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nliste .qd{color:var(--ink-2);font-weight:600;margin-right:6px}
.nliste.dos button{display:flex;align-items:center;gap:8px}
.nliste.dos .nm{flex:1;font-weight:600}.nliste.dos small{margin:0;font-family:var(--mono)}.nliste.dos .go{color:var(--muted)}
.ntete{border-left:6px solid var(--pc);padding-left:12px;display:flex;flex-direction:column;gap:8px}
.titreN{width:100%;border:0;background:transparent;font:700 1.5rem/1.2 var(--serif);letter-spacing:-.02em;resize:none;overflow:hidden;padding:2px 0;color:var(--ink)}
.titreN:focus{outline:0}
.ntete .chips{align-items:center}
.page .ol{border:0;background:transparent;padding:0}
.page .ln .bul{opacity:.4}
.ln.dos>textarea{font-weight:700}
.teintes{display:flex;flex-wrap:wrap;gap:8px}
.teintes button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;background:color-mix(in srgb,var(--pc) 70%,#fff);font:700 .8rem var(--mono);color:#2B2320}
.teintes button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.code{font:700 1.15rem/1.4 var(--mono);letter-spacing:.08em;background:var(--card);border:1px dashed var(--line2);border-radius:12px;padding:12px;text-align:center;word-break:break-all}
.chpied{margin-top:8px;text-align:center}
.sansdos .dos-b{display:none}
.ln.dos>.bul{color:var(--bord)}
/* mode « seul » : la Bibliothèque montrée dans l'Établi, juste les notes d'un projet */
html.seul .oh{display:none}
html.seul,html.seul body{background:var(--surface);color:var(--text);--muted:var(--ink-3)}
html.seul main{margin:0 auto;border-radius:0;min-height:100vh;padding-top:10px}
html.dans,html.dans body{background:transparent!important;height:auto;min-height:0}
html.dans main{min-height:0;margin:0;padding:0 0 2px;background:transparent;max-width:none}
html.dans .outils{position:static;border-radius:12px;margin-top:6px;padding:6px}
html.dans .login{position:static;background:transparent;padding:0}
.fil{display:flex;gap:4px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.fil button{border:0;background:none;padding:0;color:var(--bord);font-weight:600}
/* l'éditeur en arbre */
.ol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px 10px;color:var(--text);--muted:var(--ink-3)}
.ln{display:grid;grid-template-columns:22px 1fr auto;column-gap:4px;align-items:start;padding-left:calc(var(--lv,0) * 22px)}
.ln .bul{width:22px;height:30px;border:0;background:none;padding:0;color:var(--muted);font-size:1rem;line-height:30px;text-align:center;border-radius:4px}
.ln .bul.has{color:var(--text)}
.ln .bul:hover{background:var(--bordpale);color:var(--text);--muted:var(--ink-3)}
.ln textarea{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;padding:5px 2px;line-height:1.35;min-height:30px}
.ln textarea:focus{outline:0;background:var(--hl);border-radius:3px;color:var(--text);--muted:var(--ink-3)}
.ln .nd{grid-column:2/4;font-size:.86rem;color:var(--muted);min-height:24px;padding:2px 2px 4px}
.ln.fait>textarea{text-decoration:line-through;color:var(--muted)}
.ln.archi{opacity:.5}
.ln .lk{display:flex;gap:2px;align-items:center}
.ln .lk a{color:var(--bord);text-decoration:none;font-weight:600;padding:4px 5px;border-radius:4px}
.ln .lk a:hover{background:var(--bordpale);color:var(--text);--muted:var(--ink-3)}
.ln .go{border:1px solid var(--line2);background:var(--card);border-radius:var(--pill);padding:2px 9px;font-size:.8rem;margin-top:3px;color:var(--bord);font-weight:600;--muted:var(--ink-3)}
.ol .vide{color:var(--muted);padding:8px 10px;margin:0}
.outils{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--head)}
.outils button{border:0;background:var(--bordeaux);color:var(--on-page);border-radius:10px;min-width:42px;height:40px;padding:0 8px;display:grid;place-items:center}
.outils .ic{width:20px;height:20px;vertical-align:0}
@media (pointer:coarse){.outils .emo-b{display:none}}
.emojis{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:31;width:min(460px,94vw);max-height:56vh;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:14px;box-shadow:0 6px 24px rgba(40,10,16,.25);--muted:var(--ink-3)}
.emojis .tete{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
.emojis .tete input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;background:var(--surface-3);color:var(--text);--muted:var(--ink-3)}
.emojis .liste{overflow:auto;padding:4px 8px 8px}
.emojis details{border-bottom:1px solid var(--line)}
.emojis summary{display:flex;gap:10px;align-items:center;padding:8px 2px;cursor:pointer;list-style:none}
.emojis summary::-webkit-details-marker{display:none}
.emojis summary b{font-weight:600}.emojis summary span{flex:1;opacity:.85;letter-spacing:2px}.emojis summary small{font:400 .72rem var(--mono);color:var(--muted)}
.emojis .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:2px;padding-bottom:6px}
.emojis .grille button{border:0;background:none;font-size:1.35rem;height:38px;border-radius:8px;padding:0}
.emojis .grille button:hover{background:var(--bordpale);color:var(--text);--muted:var(--ink-3)}
.emojis .sans{border:0;background:none;font:600 .85rem var(--body);color:var(--bord);padding:4px 6px;white-space:nowrap}
.emojis .rien{color:var(--muted);margin:10px 4px}
.semaine{display:flex;align-items:center;gap:8px}
.semaine b{font:700 1.1rem var(--serif);letter-spacing:-.02em}
.semaine button .ic{width:18px;height:18px;vertical-align:0}
.btn.plus{width:48px;padding:0;display:grid;place-items:center}.btn.plus .ic{width:20px;height:20px;vertical-align:0}
.semaine button{display:grid;place-items:center;flex:none;border:1px solid var(--line2);background:var(--card);border-radius:var(--pill);width:40px;height:40px;font-size:1.1rem;color:var(--text);--muted:var(--ink-3)}
.dix{display:flex;gap:4px;flex-wrap:wrap}
.dix button{width:36px;height:36px;border:1px solid var(--line2);background:var(--card);border-radius:var(--pill);font:600 .9rem var(--mono);color:var(--text);--muted:var(--ink-3)}
.dix button[aria-pressed="true"]{background:var(--bord);border-color:var(--bord);color:var(--on-ink)}
.axes{display:flex;flex-direction:column;gap:12px}
.axe .cap{margin:0 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.axe .cap b{font-weight:600;color:var(--ink)}
.axe .dix{display:grid;grid-template-columns:repeat(10,minmax(0,40px));gap:4px}
.axe .dix button{width:auto;height:38px;padding:0}
.rappel{display:flex;flex-direction:column;gap:8px}
.res{list-style:none;margin:0;padding:0}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 4px}
.res small{display:block;color:var(--muted);font-size:.8rem}
.res mark{background:var(--hl);color:var(--text);--muted:var(--ink-3)}
/* fenêtre et messages */
.scrim{position:fixed;inset:0;background:rgba(40,10,16,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;--muted:var(--ink-3)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:var(--r)}}
.sh{display:flex;align-items:center;gap:10px}
.sh h3{flex:1;margin:0;font:700 1.1rem var(--serif);letter-spacing:-.02em}
.pick{list-style:none;margin:0;padding:0;max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);--muted:var(--ink-3)}
.pick button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px}
.pick .g{font:400 .7rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding:8px 12px 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:var(--pill);z-index:50;max-width:90vw;font-size:.92rem}
.login{position:fixed;inset:0;background:var(--page);z-index:60;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px;background:var(--surface);color:var(--ink);border-radius:var(--r);padding:22px;--muted:var(--ink-3)}
.lbox .logo{width:64px;height:64px;border-radius:16px}
.lbox h1{margin:0;font:700 1.4rem var(--serif);letter-spacing:-.025em}
.err{color:var(--bad)}
</style>
<link rel="stylesheet" href="../commun/cadre.css">
<link rel="stylesheet" href="../commun/lieux.css">
<script src="../commun/couleurs.js"></script>
</head>
<body>
<div id="login" class="login" hidden><form class="lbox" id="loginForm"><img class="logo" src="icons/icon-192.png" alt=""><h1>La Bibliothèque</h1><p>Connecte-toi avec ton compte Locus.</p><label for="l-mail">Adresse e-mail</label><input class="in" type="email" id="l-mail" autocomplete="username" required><label for="l-pass">Mot de passe</label><input class="in" type="password" id="l-pass" autocomplete="current-password" required><button class="btn" type="submit">Se connecter</button><p class="err" id="l-err" hidden></p></form></div>
<header class="oh"><div class="oh-bar"><a class="oh-orga" href="../" aria-label="Retour à l'accueil de Locus"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M8.5 8.5h3v3h-3zM10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18"/></svg></a><h1 class="oh-nom">La Bibliothèque</h1><button class="sync" id="sync" data-sync data-act="reglages" aria-label="État de la synchronisation">…</button><span class="oh-sp"></span><button class="oh-b" type="button" data-ampoule><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 15h6M8 18h4M10 2a5 5 0 0 0-3.2 8.8V13h6.4v-2.2A5 5 0 0 0 10 2z"/></svg></button><button class="oh-b" type="button" data-act="reglages" aria-label="Réglages"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3M4 4l2.1 2.1M13.9 13.9 16 16M16 4l-2.1 2.1M6.1 13.9 4 16"/></svg></button></div>

<script>
'use strict';
/* =====================================================================================================
   La Bibliothèque (étape 4 du plan, 14.11.2026) : le « Workflowy maison » de Locus.
   Trois parties : Vide-tête (une seule boîte d'entrée), Projets (l'arbre commun : domaines › projets, avec leurs notes),
   Journal (une page par semaine). Archives = les lignes archivées (filtre) et les projets archivés.
   Données : table `biblio_rows`, une ligne par ligne de notes :
     n:<id>  { id, p (parent : id d'une ligne, ou racine 'vide' | 'p:<projet>' | 'd:<domaine>' | 'j:<AAAA-Wss>'), o (ordre),
               t (texte), d (note sous la ligne), x (fait), a (archivée le), c (repliée), cree }
     w:<AAAA-Wss>  { calme, energie, prod (bilan de la semaine, chacun sur 10 ; 15.11) ; n (ancienne note unique sur 10) }
     s:reprise  { le, notes, vrac }
     s:push-<appareil>  { sub (abonnement aux notifications), pub, priv (clés VAPID de cet appareil), appareil, le }
       → lu par la fonction locus_rappel(cle) (supabase/rappel.sql) pour la notification du dimanche matin (.github/workflows/rappel-dimanche.yml)
   ===================================================================================================== */
const SB_URL='https://rzcpjsffpvuvbdtqymms.supabase.co', SB_KEY='sb_publishable_mJNXDji0NMOmLFqo3GusGg_JBkFhJmC', TABLE='biblio_rows';
let sb=null, UID=null, booted=false, PB=null;
let N={}, W={}, REG={}; /* lignes, semaines, réglages */
let prev={}, dirty=new Set(), lastPull=null, pushing=false, pushTimer=null, syncErr='';
const CK=()=>'biblio-cache-'+UID;
/* SEUL : la racine montrée seule (bibliotheque/?seul=p:<id>, dans la fenêtre de notes de l'Établi) */
const SEUL=(()=>{ try{ const v=new URLSearchParams(location.search).get('seul'); return v&&/^[pd]:/.test(v)?v:null; }catch(e){ return null; } })();
if(SEUL) document.documentElement.classList.add('seul');
/* DANS : montrée dans la fiche du projet de l'Établi (&dans=fiche) : fond transparent, hauteur au contenu, envoyée à l'Établi */
const DANS=!!SEUL&&window.parent!==window&&/[?&]dans=/.test(location.search);
if(DANS) document.documentElement.classList.add('dans');
const ui={tab:'projets', page:null, zoom:null, arch:false, wk:null, q:'', focus:null, caret:null, archP:false};
const $view=document.getElementById('view'), $scrim=document.getElementById('scrim'), $sheet=document.getElementById('sheet'), $toast=document.getElementById('toast'), $outils=document.getElementById('outils');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
function wkKey(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3); const y=t.getUTCFullYear(); const f=new Date(Date.UTC(y,0,4)); const w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7); return y+'-W'+pad(w); }
function wkMon(k){ return new Date(Projets.lundi(k)+'T12:00'); }
function wkAdd(k,n){ const m=wkMon(k); m.setDate(m.getDate()+7*n); return wkKey(m); }
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function wkLabel(k){ const m=wkMon(k), e=new Date(m); e.setDate(e.getDate()+6); return 'S'+Number(k.split('-W')[1])+' · '+m.getDate()+' '+MOIS[m.getMonth()]+' – '+e.getDate()+' '+MOIS[e.getMonth()]+' '+e.getFullYear(); }
const plain=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function toast(m,ms){ $toast.textContent=m; $toast.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{ $toast.hidden=true; },ms||Math.max(2600,m.length*55)); }

/* =============================== Données et synchro =============================== */
function canon(v){ if(Array.isArray(v)) return '['+v.map(x=>canon(x===undefined?null:x)).join(',')+']'; if(v&&typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'; return JSON.stringify(v===undefined?null:v); }
function charger(){ N={}; W={}; REG={}; CH.verrou=0; for(const k in prev){ let d; try{ d=JSON.parse(prev[k]); }catch(e){ continue; } if(!d) continue; if(k.startsWith('n:')){ if(d.z){ CH.verrou++; continue; } N[d.id]=d; } else if(k.startsWith('w:')) W[k.slice(2)]=d; else if(k.startsWith('s:')) REG[k.slice(2)]=d; } }
function persist(){ if(!UID) return; try{ localStorage.setItem(CK(),JSON.stringify({prev,dirty:[...dirty],lastPull,chz:[...CHZ]})); }catch(e){} }
/* Annuler / refaire (16.11) : chaque changement d'une ligne (n:) ou d'un bilan (w:) garde l'état d'avant. Les changements rapprochés
   (moins d'une seconde, sur la même ligne) forment un seul pas ; une touche spéciale, un clic ou une autre ligne en commencent un nouveau.
   Ctrl+Z (ou ↶ dans l'en-tête) annule un pas, Ctrl+Maj+Z ou Ctrl+Y le refait. */
const HIST={pile:[],refaire:[],tx:null,dernier:0,coupe:false,rejeu:false,cle:null};
function noter(key,avant){ if(HIST.rejeu||!/^[nw]:/.test(key)) return; const now=Date.now();
  if(!HIST.tx||HIST.coupe||now-HIST.dernier>1000){ HIST.tx={av:new Map()}; HIST.pile.push(HIST.tx); if(HIST.pile.length>200) HIST.pile.shift(); HIST.coupe=false; }
  HIST.refaire=[]; if(!HIST.tx.av.has(key)) HIST.tx.av.set(key,avant); HIST.dernier=now; annulable(); }
const couper=()=>{ HIST.coupe=true; };
/* le bouton ↶ de l'en-tête commun (commun/cadre.js) : il demande « locus:annuler », on lui dit s'il y a quelque chose à annuler */
const annulable=()=>document.dispatchEvent(new CustomEvent('locus:annulable',{detail:{n:HIST.pile.length,refaire:HIST.refaire.length}}));
document.addEventListener('locus:annuler',e=>annuler(!!(e.detail&&e.detail.refaire)));
function annuler(redo){ couper(); const src=redo?HIST.refaire:HIST.pile, tx=src.pop(); if(!tx){ toast(redo?'Rien à refaire':'Rien à annuler'); return; }
  const inv={av:new Map()}; let vu=null; HIST.rejeu=true;
  tx.av.forEach((v,k)=>{ inv.av.set(k,k in prev?prev[k]:null); const d=v==null?null:JSON.parse(v); ecrire(k,d); const id=k.slice(2);
    if(k.startsWith('n:')){ if(d){ N[id]=d; if(!vu||!d.a) vu=id; } else delete N[id]; } else { if(d) W[id]=d; else delete W[id]; } });
  HIST.rejeu=false; (redo?HIST.pile:HIST.refaire).push(inv); HIST.tx=null; annulable();
  const ici=vu&&document.querySelector(`textarea[data-id="${vu}"]`); refaire(ici?vu:null); if(!ici) toast(redo?'Refait':'Annulé'); }
function ecrire(key,data){ const v=data==null?null:canon(data); if(v==null){ if(!(key in prev)) return; noter(key,prev[key]); delete prev[key]; } else { if(prev[key]===v) return; noter(key,key in prev?prev[key]:null); prev[key]=v; } dirty.add(key); persist(); setSync(); clearTimeout(pushTimer); pushTimer=setTimeout(push,900); }
/* 26.11 : chaque ligne garde la date de sa dernière modification (m, en ms) ; les vues Post-its et Liste trient les notes par là.
   Rien n'est écrit si seul m changerait ; les reprises silencieuses (HIST.rejeu) ne touchent pas m. */
const ecrireN=n=>{ const k='n:'+n.id, old=prev[k];
  if(old){ let o=null; try{ o=JSON.parse(old); }catch(e){} if(o&&canon(Object.assign({},n,{m:o.m}))===old) return; }
  if(!HIST.rejeu) n.m=Date.now(); ecrire(k,n); };
function effacerN(id){ delete N[id]; ecrire('n:'+id,null); }
async function push(){
  if(!sb||!UID||pushing||!dirty.size||!navigator.onLine){ setSync(); return; }
  /* chiffrement (26.11) : une ligne des notes ne part jamais en clair quand le chiffrement est activé ; sans la clé sur cet appareil, elle attend */
  if(chOn()&&!CH.cle&&!chV1()){ try{ await cleCompte(); }catch(e){} }
  const bloque=k=>chOn()&&!CH.cle&&k.startsWith('n:')&&(k in prev)&&(()=>{ const d=JSON.parse(prev[k]); return d&&!d.z&&racineData(d); })();
  const keys=[...dirty].filter(k=>!bloque(k)).slice(0,300), sent={}, zz={}; if(!keys.length){ setSync(); return; }
  pushing=true; setSync();
  let rows; try{ rows=await Promise.all(keys.map(async k=>{ sent[k]=prev[k]; if(!(k in prev)) return {user_id:UID,key:k,data:null,deleted:true};
    let d=JSON.parse(prev[k]); if(k.startsWith('n:')&&chOn()&&CH.cle&&!d.z&&racineData(d)){ d=await chiffrer(d); zz[k]=1; } else if(k.startsWith('n:')) zz[k]=d.z?1:0;
    return {user_id:UID,key:k,data:d,deleted:false}; })); }catch(e){ pushing=false; syncErr='chiffrement : '+((e&&e.message)||e); setSync(); return; }
  try{ const {error}=await sb.from(TABLE).upsert(rows,{onConflict:'user_id,key'}); if(error) throw error;
    keys.forEach(k=>{ if(k in zz){ if(zz[k]) CHZ.add(k); else CHZ.delete(k); } if(prev[k]===sent[k]) dirty.delete(k); }); syncErr=''; persist(); pushing=false; setSync(); if(dirty.size){ clearTimeout(pushTimer); pushTimer=setTimeout(push,300); }
  }catch(e){ pushing=false; syncErr=(e&&e.message)||String(e); setSync(); clearTimeout(pushTimer); pushTimer=setTimeout(push,15000); } }
async function pull(full){
  if(!sb||!UID||!navigator.onLine){ setSync(); return false; }
  try{ const since=full?null:lastPull; let ch=false, max=lastPull, de=0;
    for(;;){ let q=sb.from(TABLE).select('key,data,deleted,updated_at').order('updated_at',{ascending:true}).range(de,de+999); if(since) q=q.gte('updated_at',since);
      const {data,error}=await q; if(error) throw error;
      for(const r of (data||[])){ if(!max||r.updated_at>max) max=r.updated_at; if(dirty.has(r.key)) continue;
        if(r.deleted||r.data==null){ CHZ.delete(r.key); if(r.key in prev){ delete prev[r.key]; ch=true; } continue; }
        let d=r.data; if(r.key.startsWith('n:')){ if(d.z){ CHZ.add(r.key); if(CH.cle){ try{ d=await dechiffrer(d); }catch(e){} } } else CHZ.delete(r.key); }
        const v=canon(d); if(prev[r.key]!==v){ prev[r.key]=v; ch=true; } }
      if(!data||data.length<1000) break; de+=1000; }
    lastPull=max; syncErr=''; persist(); if(ch){ charger(); if(chOn()&&!CH.cle&&REG.chiffre&&REG.chiffre.k){ try{ CH.cle=await importer(REG.chiffre.k); await toutDechiffrer(); }catch(e){} } aRechiffrer(); if(!editing()) render(); } setSync(); return true;
  }catch(e){ syncErr=(e&&e.message)||String(e); setSync(); return false; } }
function setSync(){ const el=document.getElementById('sync'); if(!el) return; let t='✓', tip='Tout est enregistré';
  if(!navigator.onLine){ t='hors ligne'+(dirty.size?' · '+dirty.size:''); tip='Hors ligne : les changements partiront au retour du réseau'; }
  else if(syncErr){ t='⚠'+(dirty.size?' '+dirty.size:''); tip='Problème de synchro : '+syncErr+(/biblio_rows/.test(syncErr)?' (lance supabase/biblio.sql)':''); }
  else if(pushing||dirty.size){ t='↻'+(dirty.size?' '+dirty.size:''); tip='Envoi en cours'; }
  el.textContent=t; el.title=tip; }

/* =============================== Notes chiffrées : le « rideau » (26.11, option A choisie par Nicolas) ===============================
   But : que le texte des notes ne soit pas lisible en ouvrant la base (Supabase, administrateur), sans rien à retenir pour la personne :
   connectée = notes ouvertes, quel que soit le mot de passe (le changer ou le réinitialiser ne change rien).
   - Une clé AES-GCM 256 par compte, créée toute seule et rangée dans s:chiffre { v:2, k (clé brute en base64), le } de biblio_rows.
     Elle est donc lisible par qui gère la base et le code : c'est un rideau, pas un coffre (dit tel quel dans l'app).
   - Activé par défaut pour tout le monde ; s:chiffre { off:1 } = plus de chiffrement (Notes › en bas).
   - Ce qui est chiffré : le texte (t, d) des lignes dont la racine est la page Notes (arbre), un domaine (d:) ou un projet (p:).
     Restent en clair : le vide-tête, les tâches (racine taches) et le journal, que l'accueil et « Ma semaine » lisent dans Supabase.
   - Champ z = iv + texte chiffré de {t, d} ; structure, ordre, dates et dos restent lisibles. La copie locale (biblio-cache-<uid>) est en clair.
   - Sans la clé (première ouverture hors ligne), les lignes chiffrées restent cachées et les nouvelles attendent : jamais de texte des notes en clair vers Supabase.
   - La clé est créée en ligne seulement, par un « insérer si absent » puis relue : deux appareils ne peuvent pas en créer deux différentes.
   - CHZ : lignes connues chiffrées sur le serveur (gardé dans la copie locale) ; une ligne des notes en clair qui n'y est pas repart chiffrée.
   - Version 1 du même soir (phrase secrète, s:chiffre { wp, wr }) : la phrase est demandée une dernière fois pour passer au rideau. */
const CH={cle:null,verrou:0,cree:false}; let CHZ=new Set();
const chOn=()=>!(REG.chiffre&&REG.chiffre.off);
const chV1=()=>!!(REG.chiffre&&REG.chiffre.wp&&!REG.chiffre.k);
function racineData(d){ let p=d.p, k=0; while(N[p]&&k++<80) p=N[p].p; p=String(p||'');
  if(p==='vide'||p==='taches'||p.startsWith('j:')) return false; return true; /* arbre, d:, p:, ou un parent encore chiffré */ }
const TE=new TextEncoder(), TD=new TextDecoder();
const b64e=u=>{ const a=new Uint8Array(u); let s=''; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s); };
const b64d=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function chiffrer(d){ const iv=crypto.getRandomValues(new Uint8Array(12)), ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},CH.cle,TE.encode(JSON.stringify({t:d.t||'',d:d.d})));
  const o=Object.assign({},d); delete o.t; delete o.d; const u=new Uint8Array(12+ct.byteLength); u.set(iv); u.set(new Uint8Array(ct),12); o.z=b64e(u); return o; }
async function dechiffrer(d){ const u=b64d(d.z), x=JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},CH.cle,u.slice(12))));
  const o=Object.assign({},d); delete o.z; o.t=x.t||''; if(x.d!=null) o.d=x.d; return o; }
const importer=k=>crypto.subtle.importKey('raw',b64d(k),{name:'AES-GCM'},false,['encrypt','decrypt']);
/* la clé du compte : celle de s:chiffre, sinon on la crée (en ligne seulement) */
async function cleCompte(){ if(CH.cle||chV1()) return CH.cle;
  if(REG.chiffre&&REG.chiffre.k){ CH.cle=await importer(REG.chiffre.k); return CH.cle; }
  if(!chOn()||!sb||!UID||!navigator.onLine||CH.cree) return null; CH.cree=true;
  try{ const k=b64e(await crypto.subtle.exportKey('raw',await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt'])));
    await sb.from(TABLE).upsert({user_id:UID,key:'s:chiffre',data:{v:2,k,le:today()},deleted:false},{onConflict:'user_id,key',ignoreDuplicates:true});
    const {data,error}=await sb.from(TABLE).select('data,deleted').eq('key','s:chiffre').maybeSingle(); if(error) throw error;
    if(data&&!data.deleted&&data.data){ prev['s:chiffre']=canon(data.data); REG.chiffre=data.data; persist(); if(data.data.k) CH.cle=await importer(data.data.k); }
  }catch(e){ CH.cree=false; }
  return CH.cle; }
async function toutDechiffrer(){ if(!CH.cle) return 0; let n=0;
  for(const k of Object.keys(prev)){ if(!k.startsWith('n:')) continue; let d; try{ d=JSON.parse(prev[k]); }catch(e){ continue; } if(!d||!d.z) continue;
    try{ prev[k]=canon(await dechiffrer(d)); CHZ.add(k); n++; }catch(e){} }
  if(n){ persist(); charger(); } return n; }
function aRechiffrer(){ if(!chOn()||!CH.cle) return 0; let n=0;
  for(const k of Object.keys(prev)){ if(!k.startsWith('n:')||CHZ.has(k)||dirty.has(k)) continue; let d; try{ d=JSON.parse(prev[k]); }catch(e){ continue; } if(d&&!d.z&&racineData(d)){ dirty.add(k); n++; } }
  if(n){ persist(); clearTimeout(pushTimer); pushTimer=setTimeout(push,400); } return n; }
/* tout remettre en place après un changement de clé ou de réglage */
async function chPreparer(){ if(chOn()) await cleCompte(); if(CH.cle){ await toutDechiffrer(); aRechiffrer(); } }
/* les bandeaux : passage de la version 1 (phrase), ou notes pas encore ouvertes (hors ligne) */
function verrouHtml(){
  if(chV1()) return `<form class="alerte" id="f-v1" autocomplete="off"><b>Une dernière fois : ta phrase secrète</b><span class="note">Tes notes s’ouvriront ensuite toutes seules dès que tu es connecté, sans rien à retenir.</span>
    <input class="in" type="password" id="i-phrase" placeholder="Phrase secrète (ou clé de secours)" autocomplete="current-password"><button class="btn" type="submit">Ouvrir</button></form>`;
  if(chOn()&&!CH.cle&&CH.verrou) return `<div class="alerte"><b>Ouverture des notes…</b><span class="note">Il faut une connexion la première fois sur cet appareil (${CH.verrou} ligne${CH.verrou>1?'s':''}).</span></div>`;
  return ''; }
const chLien=()=>`<p class="note chpied"><button class="lien" data-act="chSheet">${chOn()?'🔒 Notes masquées dans la base':'Notes en clair dans la base'}</button></p>`;
function chSheet(){ const on=chOn();
  $sheet.innerHTML=`<div class="sh"><h3>Notes masquées</h3><button class="btn2" data-act="fermer">Fermer</button></div>`+(on
    ?`<p class="note">🔒 Le texte de tes notes est chiffré avant de partir : en ouvrant la base de données (Supabase), on ne voit que du charabia. Pour toi, rien ne change : connecté, tes notes sont ouvertes, sur tous tes appareils.</p>
      <p class="note">C’est un rideau, pas un coffre : la clé est rangée avec ton compte, donc qui gère Locus pourrait la retrouver en le voulant vraiment. Le vide-tête, les tâches et le journal restent lisibles par l’accueil et « Ma semaine ».</p>
      <button class="lien" data-act="chArreter">Ne plus masquer mes notes</button>`
    :`<p class="note">Tes notes partent en clair dans la base de données (privées, mais lisibles en ouvrant la base).</p><button class="btn" data-act="chActiver">Masquer mes notes</button>`);
  $scrim.hidden=false; }
async function chAction(a,el){
  if(a==='chSheet'){ chSheet(); return; }
  if(a==='chActiver'){ const c=Object.assign({},REG.chiffre||{}); delete c.off; c.v=2; c.le=today(); REG.chiffre=c; ecrire('s:chiffre',c); CH.cree=false; await chPreparer(); fermer(); render(); push();
    toast(CH.cle?'Notes masquées':'Elles seront masquées à la prochaine connexion'); return; }
  if(a==='chArreter'){ if(!CH.cle){ toast('Il faut d’abord que tes notes soient ouvertes ici'); return; } await toutDechiffrer(); if(CH.verrou){ toast('Des lignes n’ont pas pu être ouvertes : rien n’a changé'); return; }
    Object.keys(prev).forEach(k=>{ if(CHZ.has(k)) dirty.add(k); }); const c=Object.assign({},REG.chiffre||{},{off:1,le:today()}); REG.chiffre=c; ecrire('s:chiffre',c);
    persist(); fermer(); render(); push(); toast('Tes notes repartent en clair'); return; }
}

/* ---------- la notification du dimanche matin (Web Push) ----------

  if(t.id==='i-q'){ ui.q=t.value; const pos=t.selectionStart; render(); const i=document.getElementById('i-q'); if(i){ i.focus(); i.setSelectionRange(pos,pos); } } });
document.addEventListener('keydown',e=>{ const t=e.target, ti=!!(t.classList&&t.classList.contains('ti'));
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='z'||e.key==='Z'||e.key==='y'||e.key==='Y')){
    if(!ti&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||'')) return; /* champs ordinaires : l'annulation du navigateur */
    e.preventDefault(); annuler(e.key==='y'||e.key==='Y'||e.shiftKey); return; }
  if(e.key==='Enter'||e.key==='Tab'||e.altKey||((e.ctrlKey||e.metaKey)&&e.key.length>1)) couper(); },true);
document.addEventListener('pointerdown',couper,true);
document.addEventListener('input',e=>{ const t=e.target; if(!t.classList||!t.classList.contains('titreN')) return;
  if(t.value.includes('\n')) t.value=t.value.replace(/\n+/g,' '); autoH(t); const n=N[t.dataset.id]; if(n){ if(HIST.cle!=='T'+n.id){ couper(); HIST.cle='T'+n.id; } n.t=t.value; ecrireN(n); } });
document.addEventListener('keydown',e=>{ const t=e.target; if(!t.classList||!t.classList.contains('titreN')) return;
  if(e.key==='Enter'||(e.key==='ArrowDown'&&t.selectionStart===t.value.length)){ e.preventDefault(); const n=N[t.dataset.id]; if(!n) return; const k=enfants(n.id); const c=k[0]||nouvelle(n.id,1,''); refaire(c.id,0); } });
document.addEventListener('keydown',e=>{ const t=e.target; if(!t.classList||!t.classList.contains('ti')) return;
  if(t.dataset.nid){ if(e.key==='Escape'||(e.key==='Enter'&&!e.shiftKey)){ e.preventDefault(); const n=N[t.dataset.nid]; if(n&&!n.d){ delete n.d; ecrireN(n); } refaire(t.dataset.nid); } return; }
  const n=N[t.dataset.id]; if(!n) return; const pos=t.selectionStart, fin=t.selectionEnd===t.value.length&&pos===t.value.length;
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); outil('done',n.id); return; }
  if(e.key==='Enter'&&e.shiftKey){ e.preventDefault(); outil('note',n.id); return; }
  if(e.key==='Enter'){ e.preventDefault(); const avant=t.value.slice(0,pos), apres=t.value.slice(t.selectionEnd);
    if(pos===0&&avant===''&&apres!==''){ /* au début : une ligne vide au-dessus */ const S=enfants(n.p,true), i=S.findIndex(x=>x.id===n.id), pr=S[i-1]; nouvelle(n.p,pr?(pr.o+n.o)/2:n.o-1,''); refaire(n.id,0); return; }
    n.t=avant; ecrireN(n); const kids=enfants(n.id);
    const m=kids.length&&!n.c?nouvelle(n.id,ordreDebut(n.id),apres):nouvelle(n.p,ordreApres(n),apres);
    if(kids.length&&n.c===true){} refaire(m.id,0); return; }
  if(e.key==='Tab'){ e.preventDefault(); n.t=t.value; if(e.shiftKey){ if(desindenter(n)) refaire(n.id,pos); } else if(indenter(n)) refaire(n.id,pos); return; }
  if(e.key==='Backspace'&&pos===0&&t.selectionEnd===0){ const pr=precedente(n.id);
    if(t.value===''&&!enfants(n.id,true).length){ e.preventDefault(); supprimer(n); refaire(pr?pr.id:null); return; }
    if(pr&&pr.p===n.p&&!enfants(n.id,true).length&&!enfants(pr.id,true).length){ e.preventDefault(); const c=pr.t.length; pr.t+=t.value; ecrireN(pr); supprimer(n); refaire(pr.id,c); return; } return; }
  if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); if(bouger(n,e.key==='ArrowUp'?-1:1)) refaire(n.id,pos); return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); if(enfants(n.id).length){ n.c=e.key==='ArrowUp'; if(!n.c) delete n.c; ecrireN(n); refaire(n.id,pos); } return; }
  const uneLigne=t.scrollHeight<=46;
  if(e.key==='ArrowUp'&&!e.shiftKey&&(pos===0||(uneLigne&&!t.value.slice(0,pos).includes('\n')))){ const pr=precedente(n.id); if(pr){ e.preventDefault(); const p2=document.querySelector(`textarea[data-id="${pr.id}"]`); if(p2){ p2.focus(); p2.setSelectionRange(p2.value.length,p2.value.length); } } return; }
  if(e.key==='ArrowDown'&&!e.shiftKey&&(fin||(uneLigne&&!t.value.slice(pos).includes('\n')))){ const nx=suivante(n.id); if(nx){ e.preventDefault(); const n2=document.querySelector(`textarea[data-id="${nx.id}"]`); if(n2){ n2.focus(); n2.setSelectionRange(0,0); } } return; }
  if(e.key==='Escape'){ t.blur(); } });

/* =============================== Ranger une idée du vide-tête =============================== */
function classerSheet(id,q){
  const n=N[id]; if(!n) return; q=q||''; const qq=plain(q);
  const D=PB?PB.domaines().filter(d=>!d.closed&&!d.auto).sort((a,b)=>a.name.localeCompare(b.name,'fr')):[], P=PB?PB.liste().filter(p=>!p.closed&&p.size!=='mini').sort((a,b)=>a.name.localeCompare(b.name,'fr')):[];
  const ok=t=>!qq||plain(t).includes(qq);
  let L=`<li><button data-act="classerVers" data-id="${id}" data-r="j:${wkKey(new Date())}">Journal de cette semaine</button></li><li><button data-act="classerVers" data-id="${id}" data-r="arbre">Notes (en dehors des domaines)</button></li>`;
  D.forEach(d=>{ const ps=P.filter(p=>p.parent===d.id&&ok(p.name)); if(!ok(d.name)&&!ps.length) return; L+=`<li class="g">${esc(d.name)}</li><li><button data-act="classerVers" data-id="${id}" data-r="d:${d.id}">${esc((d.emoji?d.emoji+' ':'')+d.name)} <span class="note">(le domaine)</span></button></li>`+ps.map(p=>`<li><button data-act="classerVers" data-id="${id}" data-r="p:${p.id}">&nbsp;&nbsp;${esc((p.emoji?p.emoji+' ':'')+p.name)}</button></li>`).join(''); });
  const au=P.filter(p=>(!p.parent||!D.some(d=>d.id===p.parent))&&ok(p.name)); if(au.length) L+=`<li class="g">Autres projets</li>`+au.map(p=>`<li><button data-act="classerVers" data-id="${id}" data-r="p:${p.id}">${esc((p.emoji?p.emoji+' ':'')+p.name)}</button></li>`).join('');
  $sheet.innerHTML=`<div class="sh"><h3>Ranger</h3><button class="btn2" data-act="fermer">Fermer</button></div><p style="margin:0"><b>${esc(n.t||'…')}</b></p>
  <input class="in" id="i-classer" data-id="${id}" placeholder="Chercher un projet…" value="${esc(q)}" autocomplete="off"><ul class="pick">${L}</ul>
  <p class="note">L'idée part en bas de la page choisie, avec ses sous-lignes. Pour un nouveau projet, crée-le dans l'Établi, puis range l'idée.</p>`;
  $scrim.hidden=false; setTimeout(()=>{ const i=document.getElementById('i-classer'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } },30); }
function fermer(){ $scrim.hidden=true; $sheet.innerHTML=''; }

/* =============================== Reprise : notes de l'Établi et vrac =============================== */
function reprisePanneau(){ return PB&&PB.pret()?`<div class="alerte"><div><b>Reprise.</b> Je reprends ici les notes de tes projets (feuilles de notes de l'Établi) et ce qui attend dans « En vrac ». Les notes restent aussi dans l'Établi en sauvegarde ; le vrac déménage ici.</div><button class="btn" data-act="reprise">Reprendre</button></div>`:''; }
async function reprise(){
  let nNotes=0, nVrac=0;
  const imp=(root,notes)=>{ const pile=[root]; let o=ordreFin(root); (notes||[]).forEach(x=>{ if(!x.t&&!(x.l>0)) return; const lv=Math.max(0,Math.min(x.l||0,pile.length-1)); pile.length=lv+1; const p=pile[lv];
    const n={id:uid(),p,o:p===root?o++:ordreFin(p),t:x.t||'',cree:today()}; if(x.d) n.x=true; if(x.c) n.c=true; N[n.id]=n; ecrireN(n); pile.push(n.id); nNotes++; }); };
  (PB?PB.liste():[]).forEach(p=>{ if(p.notes&&p.notes.some(x=>x.t)) imp('p:'+p.id,p.notes); });
  (PB?PB.domaines():[]).forEach(d=>{ if(d.notes&&d.notes.some(x=>x.t)) imp('d:'+d.id,d.notes); });
  try{ const {data,error}=await sb.from('rows').select('key,data,deleted').like('key','v:%'); if(error) throw error;
    const L=(data||[]).filter(r=>!r.deleted&&r.data&&(r.data.list||'inbox')==='inbox');
    let o=ordreFin('vide'); for(const r of L){ nouvelle('vide',o++,r.data.t||''); nVrac++; }
    if(L.length){ const {error:e2}=await sb.from('rows').upsert(L.map(r=>({user_id:UID,key:r.key,data:null,deleted:true})),{onConflict:'user_id,key'}); if(e2) throw e2; }
  }catch(e){ toast('Vrac de l’Établi pas repris : '+((e&&e.message)||e)); }
  REG.reprise={le:today(),notes:nNotes,vrac:nVrac}; ecrire('s:reprise',REG.reprise);
  render(); toast(nNotes+' ligne'+(nNotes>1?'s':'')+' de notes et '+nVrac+' idée'+(nVrac>1?'s':'')+' du vrac reprises'); }

function lireHash(){ if(SEUL){ ui.tab='projets'; ui.page=null; return; } const h=decodeURIComponent((location.hash||'').slice(1)); if(!h) return;
  if(h.startsWith('p:')){ location.replace('../etabli/#'+h); return; }
  if(h.startsWith('p:')||h.startsWith('d:')){ ui.tab='projets'; ui.page=h; } else if(['vide','projets','journal'].includes(h)){ ui.tab=h; ui.page=null; } }

async function enter(user){
  UID=user.id; document.getElementById('login').hidden=true;
  let c=null; try{ c=JSON.parse(localStorage.getItem(CK())||'null'); }catch(e){}
  if(c){ prev=c.prev||{}; dirty=new Set(c.dirty||[]); lastPull=c.lastPull||null; CHZ=new Set(c.chz||[]); }
  charger(); try{ if(REG.chiffre&&REG.chiffre.k&&chOn()){ CH.cle=await importer(REG.chiffre.k); await toutDechiffrer(); } }catch(e){} lireHash(); booted=true;
  try{ const q=new URLSearchParams(location.search), v=(q.get('note')||'').trim(); if(v){ nouvelle('vide',ordreDebut('vide'),v); ui.tab='vide'; ui.page=null; history.replaceState(null,'',location.pathname+'#vide'); setTimeout(()=>toast('Noté dans le vide-tête'),300); }
    if(q.get('bilan')){ ui.tab='journal'; ui.page=null; ui.wk=wkKey(new Date()); setTimeout(bilanSheet,60); } }catch(e){}
  PB=Projets.base(sb,UID); PB.surChangement(()=>{ if(booted&&!editing()) render(); });
  render(); setSync();
  await Promise.all([pull(!c),PB.tirer()]); sansEmojisJournal();
  try{ await chPreparer(); }catch(e){} if(!editing()) render(); push();
  { const v=versLocus('bibliotheque'); if(v&&v.id&&N[v.id]){ const b=document.createElement('button'); b.hidden=true; b.dataset.act='aller'; b.dataset.id=v.id; document.body.appendChild(b); b.click(); b.remove(); } }
}
document.getElementById('loginForm').addEventListener('submit',async e=>{ e.preventDefault();
  try{ const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('l-mail').value.trim(),password:document.getElementById('l-pass').value}); if(error) throw error; await enter(data.user); }
  catch(err){ showLogin('Connexion impossible : '+((err&&err.message)||err)); } });
async function start(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('../sw.js',{scope:'../'}); }catch(e){} }
  if(!window.supabase||!window.supabase.createClient){ $view.innerHTML='<p class="note">Impossible de charger l’app. Recharge la page.</p>'; return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'orga-auth'}});
  let session=null; try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(session&&session.user) await enter(session.user); else showLogin();
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT'&&UID){ UID=null; showLogin(); } });
  addEventListener('online',()=>{ setSync(); pull().then(()=>push()); if(PB) PB.tirer(); });
  addEventListener('offline',()=>setSync());
  document.addEventListener('visibilitychange',()=>{ if(!UID) return; if(document.visibilityState==='visible'){ pull(); if(PB) PB.tirer(); } else push(); });
  setInterval(()=>{ if(UID&&document.visibilityState==='visible'&&!editing()) pull(); },60000);
}
start();

  try{ new ResizeObserver(hauteur).observe(document.body); }catch(e){} addEventListener('load',hauteur); setTimeout(hauteur,300); }
