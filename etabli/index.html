<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L’Établi</title>
<meta name="theme-color" content="#FAF3E0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(../commun/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(../commun/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url(../commun/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-style:normal;font-display:swap;src:url(../commun/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout : appli mobile, la semaine comme unité (3 cases + 2 petits), création express en un écran ; angles droits, thème clair uniquement */
:root{
  --paper:#F3F1E7; --cell:#FFFFFF; --ink:#1E1E1E; --muted:#6B6A62; --line:#CFCCBF; --grid:#E2DFD3; --head:#ECEAE0;
  --band:#3C3C3C; --band-ink:#FFFFFF;
  --hl:#FFECB0; --other:#E4E2DA; --pos:#2E7D32; --neg:#B23A2B; --urg:#D9452E; --star:#E3A21A;
  --scrim:rgba(30,30,30,.45);
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
h1,h2,h3{margin:0;text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.top h1{font-size:1.05rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top .sub{font-family:var(--mono);font-size:.78rem;opacity:.75}
.top .btns{display:flex;gap:5px;flex:none}
@media (max-width:430px){.top .brand{gap:6px}.top .btns{gap:4px}.topbtn{padding:5px 6px}}
.top .orga{align-self:center;display:inline-flex;color:var(--band-ink);padding:4px 4px 4px 0;margin-right:2px;opacity:.9}
.topbtn{border:1px solid rgba(255,255,255,.55);background:transparent;color:var(--band-ink);padding:5px 8px;font-size:.8rem;font-weight:700;white-space:nowrap}
.topbtn.plus{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.note{margin:10px 0 0;font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:.8rem}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.empty{font-size:.86rem;color:var(--muted);padding:10px 12px}
.btn{border:1px solid var(--ink);padding:12px 16px;font-weight:700;background:var(--ink);color:var(--paper);width:100%}
.btn.ghost{background:var(--cell);color:var(--ink)}
.btn.warn{background:var(--cell);color:var(--neg);border-color:var(--neg)}
.sechead{background:var(--band);color:var(--band-ink);padding:8px 12px;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:20px;display:flex;justify-content:space-between;gap:10px}
.sechead span{font-family:var(--mono);font-weight:400;text-transform:none;letter-spacing:0}
.stars{color:var(--star);letter-spacing:-.05em;font-size:.9em;white-space:nowrap}
.stars .off{color:var(--line)}
.urg{background:var(--urg);color:#fff;font-family:var(--mono);font-size:.68rem;font-weight:600;padding:1px 5px;letter-spacing:.04em;white-space:nowrap}
.tg{display:inline-block;border:1px solid currentColor;font-size:.7rem;font-weight:700;padding:0 5px;letter-spacing:.02em;white-space:nowrap}

/* Navigation de semaine */
.wknav{display:flex;align-items:stretch;border:1px solid var(--ink);margin:14px 0 12px;background:var(--cell)}
.wknav button{border:0;background:var(--cell);width:48px;font-size:1.2rem;flex:none}
.wknav button:first-child{border-right:1px solid var(--ink)}
.wknav button:last-child{border-left:1px solid var(--ink)}
.wknav .mid{flex:1;text-align:center;padding:8px 6px;min-width:0}
.wknav .mid b{display:block;font-size:1.05rem}
.wknav .mid span{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.wknav .mid{background:var(--other)}
.wknav.cur .mid{background:var(--cell)}
.rule{font-size:.86rem;color:var(--muted);margin:0}
.rulerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.orgbtn{border:1px solid var(--ink);background:var(--cell);padding:6px 12px;font-weight:700;font-size:.85rem;flex:none}
.orgbtn.on{background:var(--ink);color:var(--paper)}
.orgbar{display:flex;border-top:1px solid var(--ink);background:var(--cell)}
.orgbar button{border:0;border-right:1px solid var(--ink);background:var(--cell);padding:10px 16px;font-weight:700;font-size:1rem}
.orgbar button[disabled]{color:var(--line)}
.orgbar .rm{margin-left:auto;border-right:0;border-left:1px solid var(--ink);color:var(--neg);font-size:.85rem}
.small .smx{align-self:flex-start;margin-top:4px;border:1px solid currentColor;background:transparent;color:inherit;font-size:.75rem;font-weight:700;padding:2px 7px}
.vrac{border:1px solid var(--line);border-top:0;background:var(--cell)}
.vrac .inline .input{border:0;border-top:1px solid var(--line)}
.vrac .inline .btn{border:0;border-top:1px solid var(--ink)}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{display:flex;align-items:center;gap:8px;padding:0 0 0 12px;border-top:1px solid var(--line);min-height:42px;font-size:.93rem}
.vlist li:first-child{border-top:0}
.vlist .t{flex:1;min-width:0;padding:8px 0}
.vlist .vb{border:1px solid var(--ink);background:var(--cell);padding:4px 8px;font-size:.8rem;font-weight:700;white-space:nowrap}
.vlist .vx{border:0;border-left:1px solid var(--line);background:none;align-self:stretch;width:44px;font-size:1.05rem;color:var(--muted)}
.sheet .vrac{border-top:1px solid var(--ink);border-color:var(--ink)}
.kb{display:none}
body.kbd .kb{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 3px;font-family:var(--mono);font-size:.7rem;font-weight:600;font-style:normal;background:var(--ink);color:var(--paper);line-height:1;flex:none;vertical-align:middle;letter-spacing:0;text-transform:none}
body.kbd .topbtn .kb{background:var(--band-ink);color:var(--band);margin-right:5px}
body.kbd .topbtn.plus .kb{background:var(--band);color:var(--band-ink)}
.tab{position:relative}
body.kbd .tab .kb{position:absolute;top:4px;right:6px}
body.kbd .tab[aria-current="page"] .kb{background:var(--paper);color:var(--ink)}
body.kbd .band .kb{background:var(--pt);color:var(--pc)}
body.kbd .xbtn .kb{background:currentColor;color:var(--pc,var(--band));margin-left:5px}
.vrac .inline .kb{align-self:center;margin:0 2px 0 10px}
body.kbd :focus{outline:3px solid var(--ink);outline-offset:-3px;box-shadow:inset 0 0 0 6px var(--hl)}
body.kbd .input:focus,body.kbd input:focus{box-shadow:inset 0 0 0 3px var(--hl)}
/* Mode mini (DumberOS, très petit écran) */
body.minimode .wrap>.note{display:none}
body.minimode .top .in{padding-block:6px}
.mbig{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.mbig button{border:2px solid var(--ink);background:var(--cell);padding:9px 4px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px}
.mbig button.dark{background:var(--ink);color:var(--paper)}
body.kbd .mbig button.dark .kb{background:var(--paper);color:var(--ink)}
.mlbl{margin-top:10px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
body.minimode .mrows{margin-top:4px;gap:4px}
body.minimode .mrow{height:44px}
.mnote{margin:6px 0 0;font-size:.78rem;color:var(--muted)}
body.minimode::before{background:var(--paper)}
body.minimode .wrap{padding-block:8px 8px}
.mhead{display:flex;align-items:stretch;border:1px solid var(--ink);background:var(--other);height:38px}
.mhead.cur{background:var(--cell)}
.mhead button{border:0;background:var(--cell);padding:0 8px;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:5px}
.mhead .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.8rem;border-left:1px solid var(--ink);border-right:1px solid var(--ink);font-family:var(--mono);min-width:0;white-space:nowrap;overflow:hidden}
.mhead .mid b{font-family:var(--body);font-size:1rem}
.mrows{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--pc);color:var(--pt);padding:0 8px;height:52px;text-align:left;min-width:0;width:100%}
.mrow .emo{font-size:1.3rem}
.mrow .kb{background:var(--pt)!important;color:var(--pc)!important}
.mrow .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.mrow .tx b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx small{font-size:.76rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.free{--pc:transparent;--pt:var(--muted);border-style:dashed;border-color:var(--muted)}
.mrow.free .kb{background:var(--muted)!important;color:var(--paper)!important}
.mchips{display:flex;gap:5px;margin-top:5px}
.mchip{flex:1;min-width:0;border:1px solid var(--ink);background:var(--pc);color:var(--pt);font-size:.8rem;font-weight:700;padding:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.minline{display:flex;align-items:center;margin-top:6px;border:1px solid var(--ink);background:var(--cell)}
.minline .kb{margin-left:8px}
.minline .input{border:0;padding:9px 8px;font-size:.92rem}
.minline .btn{width:auto;border:0;border-left:1px solid var(--ink);padding:9px 13px}
.mkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.mkeys button{border:1px solid var(--ink);background:var(--cell);font-size:.76rem;font-weight:700;padding:6px 2px;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.mmode{display:block;margin:6px auto 0;background:none;border:0;font-size:.74rem;color:var(--muted);text-decoration:underline}
.mback{margin:2px 0 8px}
.mback button{border:1px solid var(--ink);background:var(--cell);padding:6px 10px;font-weight:700;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
body.minimode .sheet{max-height:100%}
body.minimode .shead{padding-block:8px}
body.minimode .shead h2{font-size:1.02rem}
body.minimode .shead .emo{font-size:1.4rem}
body.minimode .sbody{gap:12px;padding-top:10px}
body.minimode .gnav{margin-top:0}
.st-proch{background:#F8C9A0}
.st-later{background:#E4E7F0}
.wkline{display:flex;align-items:stretch;margin-top:14px;border:1px solid var(--ink);background:var(--cell)}
.wklab{border:0;border-right:1px solid var(--ink);background:var(--cell);padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-family:var(--mono);line-height:1.15}
.wklab b{font-size:.85rem}
.wklab span{font-size:.7rem;color:var(--muted)}
.wkchips{display:flex;flex-direction:column;gap:4px;padding:5px;min-width:0;flex:1;justify-content:center}
.wkchips .mini{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:left;display:block;padding:5px 8px}
.wkchips .mini.sm{font-weight:400;font-size:.78rem}
.ctrl{display:flex;flex-direction:column;gap:8px;margin:14px 0 10px}
.ctrl .chips{margin:0}
.ptable th.pth{position:sticky;left:0;z-index:3;background:var(--head);border-right:1px solid var(--ink);min-width:210px}
tbody tr.qrow{cursor:default}
.qrow td{background:var(--head);height:auto;padding:6px 0;white-space:nowrap}
.qrow .quad{position:sticky;left:10px;display:inline-flex;margin:0;padding-right:10px}
.tagfilter{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.tab .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--urg);color:#fff;font-family:var(--mono);font-size:.64rem;font-weight:600;min-width:16px;height:16px;padding:0 3px;display:grid;place-items:center}
.vadd{margin-top:14px;border:1px solid var(--ink);background:var(--cell)}
.vadd .input{border:0}
.vadd .btn{border:0;border-left:1px solid var(--ink);width:auto;padding:0 18px}
.vlist .vt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 0;font-size:.95rem}
.vlist .vgo{color:var(--muted);padding:0 12px;font-size:1.1rem}
.vlist .vchk{width:22px;height:22px;margin:0;accent-color:var(--ink);flex:none}
.vlist li.done .vt{color:var(--muted);text-decoration:line-through}
.vlist li.empty{padding:10px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.optbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--ink);background:var(--cell);padding:10px 12px;text-align:left;width:100%}
.optbtn .oe{font-size:1.5rem;flex:none}
.optbtn .tx{display:flex;flex-direction:column;min-width:0}
.optbtn .tx span{font-size:.8rem;color:var(--muted)}
.wslots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wslots li{display:flex;align-items:stretch;gap:0}
.wslots .pickbtn{flex:1;min-width:0}
.wslots .wrm{border:1px solid var(--ink);border-left:0;background:var(--cell);color:var(--neg);font-weight:700;font-size:.8rem;padding:0 10px}
.wslots .slot.free{padding:12px}
.wkpick .wsep{background:var(--band);color:var(--band-ink);padding:4px 12px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:600px){.ptable th.pth{min-width:132px;max-width:132px}}
.bravo{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(20,20,20,.55);cursor:pointer}
.bravo canvas{position:absolute;inset:0;width:100%;height:100%}
.bravobox{position:relative;background:var(--pc);color:var(--pt);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:18px 28px;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:calc(100% - 48px);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.bravobox .emo{font-size:2.4rem}
.bravobox b{font-family:var(--mono);font-size:2.4rem;letter-spacing:.12em;line-height:1}
.bravobox small{font-size:.9rem;font-weight:700;text-align:center;overflow-wrap:anywhere}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.bravobox{animation:none}}
.notesprev{border:1px solid var(--ink);background:var(--cell);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%}
.notesprev span{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.notesprev b{font-size:.85rem;margin-top:4px}
.nlist{list-style:none;margin:0;padding:0;border:1px solid var(--ink);background:var(--cell)}
.nl{display:flex;align-items:center;padding-left:calc(var(--lv) * 22px);border-top:1px solid var(--grid)}
.nl:first-child{border-top:0}
.nb{width:30px;height:38px;flex:none;border:0;background:none;font-size:1rem;color:var(--muted);padding:0}
.nb.has{color:var(--ink);font-weight:700}
.ni{flex:1;min-width:0;border:0;background:transparent;padding:9px 8px 9px 0;font-size:1rem}
.ni:focus{outline:none;background:var(--hl)}
.nl.done .ni{text-decoration:line-through;color:var(--muted)}
.ntools{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin-top:14px;display:grid;grid-template-columns:repeat(6,1fr);border-top:2px solid var(--ink);background:var(--cell);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.ntools button{border:0;border-left:1px solid var(--line);background:var(--cell);padding:12px 0;font-size:1.15rem;font-weight:700}
.ntools button:first-child{border-left:0}
.sync{border:0;background:transparent;font-family:var(--mono);font-size:.74rem;font-weight:600;padding:2px 6px;color:var(--band-ink);opacity:.9}
.sync.ok{color:#A8E6A0}.sync.pend{color:#FFD873}.sync.err{color:#FF9C8A}.sync.off{color:#D8D8D4}
.login{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbox{width:100%;max-width:360px;border:2px solid var(--ink);background:var(--cell);box-shadow:6px 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:8px}
.lbox h1{margin:0 0 4px;font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase}
.lbox p{margin:0 0 8px;font-size:.9rem;color:var(--muted)}
.lbox label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:4px}
.lbox .btn{margin-top:10px}
.lerr{color:var(--neg)!important;font-weight:700}
@media (pointer:coarse){.tablebox,.gantt{scrollbar-width:none}.tablebox::-webkit-scrollbar,.gantt::-webkit-scrollbar{display:none}}
@media (pointer:fine){.tablebox,.gantt{scrollbar-width:auto;scrollbar-color:var(--ink) var(--head)}}
.sizes button[data-s="mini"]{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:10px}
.mgrp td{font-weight:700}
.mlist{list-style:none;margin:0;padding:0;border:1px solid var(--ink);background:var(--cell)}
.mlist li{display:flex;align-items:center;gap:10px;padding-left:12px;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0}
.mlist .mt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:9px 12px 9px 0;display:flex;flex-direction:column;gap:3px}
.mlist .mt b{font-size:.98rem}
.mlist li.empty{padding:12px}
.mminis{width:100%;margin-top:6px;border:2px solid var(--ink);background:var(--cell);padding:10px;font-weight:700;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
body.minimode .minline .input{padding:13px 10px;font-size:1.05rem}
body.minimode .minline .btn{padding:13px 16px;font-size:1.1rem}
body.minimode .mbig button{padding:16px 6px;font-size:1.08rem}
body.minimode .mrow{height:52px}
body.minimode .mrow .tx b{font-size:1.02rem}
body.minimode .kb{min-width:22px;height:22px;font-size:.8rem}
body.minimode .top .sub{font-size:.95rem}
body.minimode .sync{font-size:.9rem}
body.minimode .mlbl{font-size:.82rem}
body.minimode .mrow .tx small{font-size:.9rem}
body.minimode .mnote{font-size:.95rem}
body.minimode .mmode{font-size:.95rem}
body.minimode .empty{font-size:1rem}
body.minimode .note,body.minimode .duehint{font-size:.95rem}
body.minimode .lbl,body.minimode .field>label,body.minimode .field>.lbl{font-size:.8rem}
body.minimode .meta{font-size:.85rem}
body.minimode .shead h2 small{font-size:.88rem}
body.minimode pre.sum{font-size:.92rem}
body.minimode .sizes span{font-size:.85rem}
body.minimode .toast{font-size:1rem}
.mdue{flex:none;font-family:var(--mono);font-size:.8rem;font-weight:600;padding:3px 6px;background:var(--pt);color:var(--pc);white-space:nowrap}
.mdue.u{background:var(--urg);color:#fff}
body.minimode .mdue{font-size:.88rem}
.dweek .d7 button.due{box-shadow:inset 0 0 0 3px var(--urg);color:var(--urg);font-weight:700}
.duebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:2px solid var(--ink);background:var(--cell);padding:8px 12px;font-size:.92rem}
.wdue{color:var(--urg);font-weight:700}
.bravo.big{animation:party 2.4s steps(1,end) 3}
@keyframes party{0%{background:rgba(224,87,79,.6)}20%{background:rgba(245,207,78,.6)}40%{background:rgba(74,134,217,.6)}60%{background:rgba(91,174,91,.6)}80%{background:rgba(154,107,209,.6)}}
.bravo.big .bravobox{padding:26px 34px;box-shadow:12px 12px 0 var(--ink);animation:pop .45s cubic-bezier(.2,1.6,.4,1),wobble 1.2s ease-in-out .45s infinite}
.bravo.big .bravobox .emo{font-size:4rem}
.bravo.big .bravobox b{font-size:clamp(2.2rem,11vw,4.6rem);letter-spacing:.04em;white-space:nowrap}
.bravo.big .bravobox i{font-style:normal;font-weight:700;font-size:1rem;text-align:center}
.bravo.big .bravobox small{font-size:1.05rem}
@keyframes wobble{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.05)}}
.bravo.calm,.bravo.calm .bravobox{animation:none}
@media (prefers-reduced-motion:reduce){.bravo.big,.bravo.big .bravobox{animation:none}}
.durs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.durs button{border:2px solid var(--ink);background:var(--cell);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.durs button b{font-family:var(--mono);font-size:1.15rem}
.durs button span{font-size:.72rem;color:var(--muted)}
.durs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.durs button[aria-pressed="true"] span{color:var(--paper);opacity:.8}
.durs .dmini{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:10px;padding:8px 10px}
.durs .dother{grid-column:span 1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--muted);padding:2px 4px;font-size:.72rem;color:var(--muted)}
.durs .dother .input{border:0;padding:2px;text-align:center;font-family:var(--mono);font-size:1rem;background:transparent;width:100%}
.tasks li{gap:8px;padding-right:0}
.tasks .tt{flex:1;min-width:0;cursor:text;padding:2px 0}
.tasks .drag{flex:none;width:42px;align-self:stretch;display:grid;place-items:center;font-size:1.2rem;color:var(--muted);cursor:grab;touch-action:none;border-left:1px solid var(--line);user-select:none}
.tasks li.dragging{background:var(--hl);box-shadow:0 4px 0 var(--ink);position:relative;z-index:2}
.tasks li.done .tt{color:var(--muted);text-decoration:line-through}
.tedit{flex:1;min-width:0;padding:6px 8px;font-size:1rem}
.tdur{font-family:var(--mono);font-size:.78rem;font-weight:600;background:var(--head);border:1px solid var(--line);padding:0 4px;white-space:nowrap}
.tadm{font-size:.72rem;font-weight:700;background:var(--ink);color:var(--paper);padding:0 5px;text-transform:uppercase;letter-spacing:.05em}
.tfilt{margin-bottom:2px}
textarea.ni{resize:none;overflow:hidden;line-height:1.35;font-family:inherit;display:block;min-height:38px}
.tg.col,.tchip.col{display:inline-flex;align-items:center;gap:5px}
.tg.col::before,.tchip.col::before{content:"";width:9px;height:9px;background:var(--tc);flex:none;border:1px solid rgba(0,0,0,.25)}
.cdots{display:flex;gap:8px;flex-wrap:wrap}
.cdot{width:30px;height:30px;border:2px solid var(--ink);background:var(--sw);padding:0}
.cdot[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--cell);outline:2px solid var(--ink)}
.tcolors{display:flex;gap:4px;flex-wrap:wrap;width:100%;padding:4px 0 2px}
.tcol{width:24px;height:24px;border:1px solid var(--line);background:var(--sw);padding:0}
.tcol.none{background:linear-gradient(135deg,transparent 45%,var(--neg) 45%,var(--neg) 55%,transparent 55%),var(--cell)}
.tcol[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.durrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.durrow .dfree{grid-column:1/-1}
.dfree{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--cell);padding:0 10px}
.dfree .input{border:0;padding:10px 0;font-family:var(--mono);font-size:1.3rem;font-weight:600;width:100%;min-width:0;background:transparent}
.dfree span{font-size:.85rem;color:var(--muted);white-space:nowrap}
.dmini{border:2px solid var(--ink);background:var(--cell);font-weight:700;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dmini small{font-weight:400;font-size:.75rem;color:var(--muted)}
.dmini[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dmini[aria-pressed="true"] small{color:var(--paper);opacity:.8}
.tagdel{border:1px solid var(--neg);background:var(--cell);color:var(--neg);font-size:.8rem;font-weight:700;padding:5px 8px;white-space:nowrap}
.gwe{grid-row:1;margin:4px 0;background:rgba(255,255,255,.55);z-index:2;pointer-events:none}
.dfree{padding:0!important;gap:0!important}
.dfree .input{text-align:center;font-size:1.45rem!important;padding:12px 0!important}
.dfree span{padding-right:6px}
.dstep{flex:none;width:52px;align-self:stretch;border:0;background:var(--head);font-size:1.6rem;font-weight:700;color:var(--ink)}
.dstep:first-child{border-right:1px solid var(--line)}
.dstep:last-child{border-left:1px solid var(--line)}
.durrow{grid-template-columns:1.7fr 1fr!important}
.dmini{padding:12px 8px!important;font-size:1rem}
.tasks li.next{background:#FFF6D6;box-shadow:inset 4px 0 0 var(--star)}
.tasks li.next .tt{font-weight:700}
.tasks li.sec{padding-top:14px;border-top:2px solid var(--ink)}
.tasks li.sec:first-child{border-top:0;padding-top:6px}
.tasks li.sec .tt{font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.addrow{display:flex;gap:6px;align-items:stretch}
.addrow .inline{flex:1 1 auto;min-width:0;margin:0;display:flex}
.addrow .inline .input{flex:1;min-width:0;width:auto}
.addrow>.btn.ghost{flex:none;width:auto;padding-inline:12px;font-size:.85rem;white-space:nowrap}
.pchip.add{background:transparent;color:var(--ink);border:2px dashed var(--line)}
.pchip.dom{border-color:var(--ink)}
.pchip.dom.closed{opacity:.55}
.ptsec{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.domhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;font-weight:700}
.domhead button{border:0;background:none;padding:2px 0;font-weight:800;text-align:left}
.domhead span{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
@media (min-width:900px){.wrap,.top .in,.tabs .in{max-width:80vw}.sheet{max-width:min(80vw,960px)}}
.gwrap{display:flex;width:max-content}
.gmore{flex:none;width:58px;border:0;border-left:2px solid var(--ink);background:var(--head);font-size:1.6rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gmore small{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.bgc[data-act="cell"]{cursor:pointer}
.bgc[data-act="cell"]:hover{background:var(--hl)}
.grow.blank .gg{grid-template-rows:44px}
.laterbox{border:2px solid var(--ink);background:#E4E7F0;padding:12px;display:flex;flex-direction:column;gap:8px}
.st-prevu{background:#CFE3F5}
.pro{display:inline-block;border:1px solid currentColor;font-size:.66rem;font-weight:700;padding:0 4px;margin-left:6px;letter-spacing:.05em;text-transform:uppercase;vertical-align:middle;line-height:1.4}
.cnt{margin:10px 0 0;font-size:.9rem}
.infrow{margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.infrow .lbl small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.parcell{font-size:.85rem;white-space:nowrap}
.reprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--line);background:var(--cell);padding:8px 10px}
.reprow .nm{flex:1 1 170px;font-weight:700;min-width:0}
.reprow .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.reprow select{max-width:100%;padding:6px 8px;border:1px solid var(--ink);background:var(--cell)}
select.input{appearance:auto}
.dort{border-top:1px solid var(--ink);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.dort small{color:var(--muted);font-weight:400}
.dbtns{display:flex;flex-wrap:wrap;gap:6px}
.dbtns button{border:1px solid var(--ink);background:var(--cell);padding:6px 9px;font-weight:700;font-size:.85rem}
.laterbox span{font-size:.9rem;color:var(--muted)}
.vlist .lsw{width:30px;align-self:stretch;display:grid;place-items:center;background:var(--pc);flex:none;margin-left:-12px}
.okbtn{background:var(--pt,var(--band-ink))!important;color:var(--pc,var(--band))!important}
.gbar{touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gbar.dragging{opacity:.85;outline:3px solid var(--ink);z-index:5;cursor:grabbing;position:relative}
.gbar.dragging::after{content:attr(data-tip);position:absolute;left:0;top:-22px;background:var(--ink);color:#fff;font-size:.7rem;padding:1px 5px;white-space:nowrap}
.gbar.dragging{overflow:visible!important}
@media (pointer:fine){.gbar{cursor:grab}}
.danger{border:2px solid var(--neg);background:var(--cell);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}

/* Cases de la semaine */
.slots{display:grid;gap:8px}
.slot{display:flex;flex-direction:column;border:1px solid var(--ink);background:var(--cell);padding:0;text-align:left;width:100%;min-width:0}
.slot.free{border-style:dashed;border-color:var(--muted);background:transparent;color:var(--muted);flex-direction:row;align-items:center;gap:10px;padding:14px 12px;font-weight:700}
.slot.free .n{font-family:var(--mono);border:1px dashed var(--muted);width:28px;height:28px;display:grid;place-items:center;flex:none}
.band{background:var(--pc);color:var(--pt);display:flex;align-items:center;gap:10px;padding:10px 12px;min-width:0}
.emo{font-size:1.45rem;line-height:1;flex:none}
.band .nm{font-weight:700;font-size:1.08rem;flex:1;min-width:0;line-height:1.2}
.pbody{padding:9px 12px 10px;display:flex;flex-direction:column;gap:6px}
.pbody p{margin:0;font-size:.97rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;font-family:var(--mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:5px;background:var(--grid)}
.prog i{display:block;height:100%;background:var(--pc)}
.smalls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.small{border:1px solid var(--ink);background:var(--pc);color:var(--pt);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.small .r{display:flex;gap:7px;align-items:center;font-weight:700;font-size:.9rem;min-width:0}
.small .r span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.small .dd{font-family:var(--mono);font-size:.72rem;opacity:.85}
.small.free{background:transparent;color:var(--muted);border:1px dashed var(--muted);justify-content:center}
.wknext{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-top:0;background:var(--cell)}
.mini{background:var(--pc);color:var(--pt);padding:4px 8px;font-size:.84rem;font-weight:700;border:0;display:inline-flex;gap:5px;align-items:center}
.acts{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-top:0;background:var(--cell)}
.acts li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:.9rem}
.acts li:first-child{border-top:0}
.acts .v{margin-left:auto;font-family:var(--mono);font-size:.85rem}
.dot{width:10px;height:10px;background:var(--pc,var(--ink));flex:none;display:inline-block}

/* Planning : jours en colonnes, projets en lignes */
.gnav{display:flex;align-items:stretch;border:1px solid var(--ink);margin:14px 0 10px;background:var(--cell)}
.gnav button{border:0;border-left:1px solid var(--ink);background:var(--cell);padding:9px 12px;font-weight:700;font-size:.88rem}
.gnav button:first-child{border-left:0}
.gnav .mid{flex:1}
.gantt{overflow-x:auto;border:1px solid var(--ink);background:var(--cell);--cw:28px;--lw:0px}
.gantt .gl{display:none}
.glab{grid-row:1;z-index:1;align-self:center;font-size:.78rem;font-weight:700;line-height:1.15;overflow:hidden;padding-left:4px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.gin{width:calc(var(--lw) + var(--cw) * var(--n))}
.grow{display:flex;border-top:1px solid var(--grid)}
.grow:first-child{border-top:0}
.gl{position:sticky;left:0;z-index:3;width:var(--lw);flex:none;border:0;border-right:1px solid var(--ink);background:var(--head);display:grid;place-items:center;font-size:1.2rem;padding:0}
.grow.proj .gl{background:var(--pc)}
.gg{display:grid;grid-template-columns:repeat(var(--n),var(--cw));grid-template-rows:34px;flex:none}
.gg>*{grid-row:1;min-width:0}
.bgc{border-left:1px solid var(--grid)}
.bgc.mon{border-left:1px solid var(--line)}
.bgc.we{background:#EFEDE6}
.bgc.off{background:#F7CFE0}
.bgc.tod{background:#EDEBE3}
.hm .gg{grid-template-rows:26px;background:var(--band);color:var(--band-ink)}
.hm .gl{background:var(--band)}
.hm .mo{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:5px 6px;white-space:nowrap;overflow:hidden;border-left:1px solid #666}
.hw .gg{grid-template-rows:38px}
.hw .wk{border:0;border-left:1px solid var(--ink);background:var(--other);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 6px;text-align:left;gap:1px}
.hw .wk.cur{background:var(--cell)}
.hw .wk b{font-family:var(--mono);font-size:.82rem}
.hw .wk span{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.hw .wk span.full{color:var(--ink);font-weight:600}
.hd .gg{grid-template-rows:24px}
.hd .dn{display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;border-left:1px solid var(--grid);border-top:1px solid var(--line)}
.hd .dn.we{background:#E2DFD5}
.hd .dn.off{background:#EE9DC0}
.hd .dn.tod{background:var(--ink);color:#fff;font-weight:600}
.gbar{grid-row:1;margin:4px 0;border:0;background:var(--pc);color:var(--pt);font-size:.8rem;font-weight:700;padding:0 5px;display:flex;align-items:center;gap:4px;overflow:hidden;text-align:left;z-index:1;line-height:1.15}
.gbar .ge{flex:none}
.gbar:not(.s){overflow:hidden;overflow:clip}
.glbl{position:sticky;left:6px;display:flex;align-items:center;gap:4px;min-width:0;max-width:min(240px,100%)}
.gbar .gt{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.grow.proj .gg{grid-template-rows:64px}
.gbar.s{font-size:1.1rem}
.gbar.s{justify-content:center;padding:0}
.gdue{grid-row:1;z-index:2;align-self:center;justify-self:center;width:20px;height:20px;background:var(--ink);color:#fff;font-size:.68rem;display:grid;place-items:center;border:0;padding:0}
.planlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:10px;align-items:center}
.planlegend b{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px}
/* Filtres */
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--ink);background:var(--cell);padding:7px 11px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}

/* Tableau */
.tablebox{overflow-x:auto;border:1px solid var(--ink);background:var(--cell)}
table{border-collapse:collapse;min-width:820px;width:100%;font-size:.9rem}
th{background:var(--head);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--ink);border-left:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
th:first-child,td:first-child{border-left:0}
td{padding:0 10px;height:42px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.pcell{padding:0;position:sticky;left:0;z-index:1;background:var(--cell);min-width:210px;max-width:230px}
.pcell .in{display:flex;align-items:stretch;height:42px}
.pcell .sw{width:38px;background:var(--pc);display:grid;place-items:center;font-size:1.1rem;flex:none}
.pcell .nm{padding:0 10px;display:flex;align-items:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;border-right:1px solid var(--ink)}
td.st{font-weight:700;font-size:.86rem}
.pcell .nm>span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){
  td.pcell{min-width:132px;max-width:132px}
  .pcell .sw{width:30px;font-size:1rem}
  .pcell .nm{white-space:normal;font-size:.8rem;line-height:1.15;padding:0 7px}
  .pcell .nm>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
.st-cours{background:#F2A39C}.st-plan{background:var(--hl)}.st-attente{background:#D8D8D4}.st-perm{background:#E6E0F2}.st-fini{background:var(--cell)}
td .tg{margin-right:4px;color:var(--muted)}

/* Formulaires */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink)}
.seg button{border:0;border-left:1px solid var(--ink);background:var(--cell);padding:10px 6px;font-weight:700;font-size:.9rem}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.input{width:100%;border:1px solid var(--ink);background:var(--cell);padding:10px 12px;font-size:1rem;min-width:0}
textarea.input{min-height:70px;resize:vertical}
.amount{display:flex;align-items:stretch}
.amount .input{font-family:var(--mono);font-size:1.5rem;text-align:center;border-left:0;border-right:0}
.amount .step{flex:none;width:52px;border:1px solid var(--ink);background:var(--cell);font-size:1.3rem}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.qb{border:1px solid var(--ink);background:var(--cell);padding:6px 11px;font-size:.84rem;font-family:var(--mono)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:2px solid transparent;background:var(--pc);color:var(--pt);padding:6px 10px;font-size:.88rem;font-weight:700;display:inline-flex;gap:6px;align-items:center;text-align:left}
.pchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--cell)}
.pchips.dim .pchip[aria-pressed="false"]{opacity:.5}
.tchip{border:1px solid var(--ink);background:var(--cell);padding:6px 10px;font-size:.86rem;font-weight:700}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tchip.add{border-style:dashed;color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hbars{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-top:0;background:var(--cell)}
.hbars li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:.9rem}
.hbars li:first-child{border-top:0}
.hbars .b{grid-column:1/-1;height:8px;background:var(--grid)}
.hbars .b i{display:block;height:100%;background:var(--pc,var(--ink))}

/* Vue planning : une colonne par jour, une ligne par projet */
function vPlanning(){
  const tgt=ui.planStart||todayS, tD=parse(tgt), m0=monday(tD), k0=wkKey(m0);
  let lastP=tgt; open().forEach(p=>{ p.weeks.forEach(k=>{const e=wkDates(k)[1]; if(e>lastP) lastP=e;}); p.days.forEach(d=>{ if(d>lastP) lastP=d; }); });
  const W=Math.max(10,Math.ceil((parse(lastP)-m0)/864e5/7)+2)+(ui.planExtra||0), N=W*7;
  const pm=new Date(tD.getFullYear(),tD.getMonth()-1,1), nm=new Date(tD.getFullYear(),tD.getMonth()+1,1);
  const mlab=d=>MOIS_L[d.getMonth()]+(d.getFullYear()!==today.getFullYear()?' '+d.getFullYear():'');
  const dayS=[]; for(let i=0;i<N;i++){const d=new Date(m0); d.setDate(m0.getDate()+i); dayS.push(iso(d));}
  const idx=s=>dayS.indexOf(s), first=dayS[0], last=dayS[N-1];
  /* en-têtes */
  let mo='', curM=null, span=0, startI=0;
  dayS.forEach((s,i)=>{const m=s.slice(0,7); if(m!==curM){ if(curM) mo+=`<div class="mo" style="grid-column:${startI+1} / span ${span}">${MOIS_L[Number(curM.slice(5))-1]} ${curM.slice(0,4)}</div>`; curM=m; span=0; startI=i;} span++;});
  mo+=`<div class="mo" style="grid-column:${startI+1} / span ${span}">${MOIS_L[Number(curM.slice(5))-1]} ${curM.slice(0,4)}</div>`;
  let wk=''; for(let w=0;w<W;w++){const k=wkAdd(k0,w), c=inWeek(k), full=c.all.length>=MAXT; wk+=`<button class="wk${k===CUR?' cur':''}" style="grid-column:${w*7+1} / span 7" data-act="goWk" data-k="${k}"><b>S${wkNum(k)}</b><span class="${full?'full':''}">${c.all.length}/${MAXT}</span></button>`;}
  const dn=dayS.map((s,i)=>{const d=parse(s), we=d.getDay()===0||d.getDay()===6, off=offOn(s); return `<div class="dn${we?' we':''}${off?' off':''}${s===todayS?' tod':''}" style="grid-column:${i+1}"${off?` title="${esc(offLbl(s))}"`:''}>${d.getDate()}</div>`;}).join('');
  const bg=dayS.map((s,i)=>{const d=parse(s), we=d.getDay()===0||d.getDay()===6; return `<div class="bgc${i%7===0?' mon':''}${we?' we':''}${offOn(s)?' off':''}${s===todayS?' tod':''}" style="grid-column:${i+1}" data-act="cell" data-d="${s}"></div>`;}).join('');
  /* lignes : chaque projet garde une seule ligne, rangé le plus haut possible ; un autre projet peut se glisser dans ses trous */
  const items=open().map(p=>{
    const cov=new Set();
    (p.days||[]).forEach(d=>{const i=idx(d); if(i>=0) cov.add(i);});
    (p.weeks||[]).forEach(k=>{const i=idx(iso(wkMon(k))); if(i>=0) for(let j=0;j<5;j++) cov.add(i+j);});
    const bridge=new Set(); (p.weeks||[]).forEach(k=>{ if(!(p.weeks||[]).includes(wkAdd(k,1))) return; const i=idx(iso(wkMon(k))); if(i>=0) [5,6].forEach(j=>{ if(i+j<N){ bridge.add(i+j); cov.add(i+j);} }); });
    const ix=[...cov].sort((x,y)=>x-y), segs=[];
    ix.forEach(i=>{const g=segs[segs.length-1]; if(g&&g[1]===i-1) g[1]=i; else segs.push([i,i]);});
    return {p,ix,segs,bridge,start:ix[0],len:ix.length};
  }).filter(r=>r.len).sort((x,y)=>x.start-y.start||y.len-x.len||prioSort(x.p,y.p));
  const lanes=[];
  items.forEach(it=>{
    let L=lanes.findIndex(occ=>it.ix.every(i=>!occ.has(i)));
    if(L<0){L=lanes.length; lanes.push(new Set());}
    it.ix.forEach(i=>lanes[L].add(i)); it.lane=L;
  });
  const rowHtml=lanes.map((occ,L)=>{
    const freeAfter=b=>{let n=0; for(let i=b+1;i<N&&n<10&&!occ.has(i);i++) n++; return n;};
    const bars=items.filter(it=>it.lane===L).map(({p,segs,bridge})=>{ let named=false;
      return segs.map(([a,b])=>{const len=b-a+1, long=len>=5;
        let bgs=''; if([...bridge].some(i=>i>=a&&i<=b)){ const light=`color-mix(in srgb, ${p.color} 38%, #fff)`, st=[]; for(let i=a;i<=b;i++){ const c=bridge.has(i)?light:p.color, x0=((i-a)/len*100).toFixed(3), x1=((i-a+1)/len*100).toFixed(3); st.push(`${c} ${x0}% ${x1}%`); } bgs=`;background:linear-gradient(to right,${st.join(',')})`; }
        let out=`<button class="gbar${long?'':' s'}" style="${pv(p)};grid-column:${a+1} / span ${len}${bgs}" data-act="open" data-id="${p.id}" data-a="${dayS[a]}" data-b="${dayS[b]}" title="${esc(p.name)}">${long?`<span class="glbl"><span class="ge">${p.emoji}</span><span class="gt">${esc(p.name)}</span></span>`:`<span class="ge">${p.emoji}</span>`}</button>`;
        if(long) named=true; else if(!named){const f=freeAfter(b); if(f>=3){out+=`<span class="glab" style="grid-column:${b+2} / span ${f}">${esc(p.name)}</span>`; named=true;}} return out;}).join('');
    }).join('');
    return `<div class="grow proj"><div class="gl"></div><div class="gg">${bg}${bars}</div></div>`;
  }).join('');
  const cw=inWeek(CUR), cwl=[...weekOrder(CUR,cw.n),...cw.s];
  $view.innerHTML=`<div class="wkline"><button class="wklab" data-act="goWk" data-k="${CUR}"><b>S${wkNum(CUR)}</b><span>${cw.all.length}/${MAXT}</span></button><div class="wkchips">${cwl.map(p=>`<button class="mini${small(p)?' sm':''}" style="${pv(p)}" data-act="open" data-id="${p.id}">${p.emoji} ${esc(p.name)}</button>`).join('')||'<span class="note" style="margin:0">Rien cette semaine.</span>'}</div></div>
  <div class="gnav"><button data-act="planM" data-d="${iso(pm)}">‹ ${mlab(pm)}</button><button class="mid" data-act="planM" data-d="">Aujourd'hui</button><button data-act="planM" data-d="${iso(nm)}">${mlab(nm)} ›</button></div>
  <div class="gantt" id="gantt"><div class="gwrap"><div class="gin" style="--n:${N}">
   <div class="grow hm"><div class="gl"></div><div class="gg">${mo}</div></div>
   <div class="grow hw"><div class="gl" style="font-size:.7rem;font-family:var(--mono)">sem.</div><div class="gg">${wk}</div></div>
   <div class="grow hd"><div class="gl"></div><div class="gg">${dn}</div></div>
   ${rowHtml}
   <div class="grow proj blank"><div class="gl"></div><div class="gg">${bg}</div></div>
  </div><button class="gmore" data-act="planMore3" aria-label="Afficher 3 mois de plus">+<small>3 mois</small></button></div></div>
  <div class="planlegend"><span><b style="background:#EE9DC0"></b>vacances et congés</span><span><b style="background:#E2DFD5"></b>week-end</span><span>2/5 = projets dans la semaine (5 au plus, dont 3 sur la semaine entière)</span></div>
  <p class="note">Touche une case vide pour y placer un projet, une barre pour l'ouvrir. Pour déplacer une barre : glisse-la (au doigt, appuie longuement d'abord).</p>
  <button class="btn ghost" data-act="offs">🏖️ Vacances et congés prévus${S.offs.length?' ('+S.offs.length+')':''}</button>`;
  const g=document.getElementById('gantt'), ti=idx(tgt); if(g){ try{ if(ui.planScroll!=null){ g.scrollLeft=ui.planScroll; ui.planScroll=null; } else if(ti>=0) g.scrollLeft=ti*28; }catch(e){} }
}

/* Vue projets */
function needReprise(){ return !S.reprise&&S.projects.some(p=>(p.tags||[]).some(t=>T(t))); }
function vProjets(){
  const order={cours:0,proch:1,plan:2,attente:3,perm:3,prevu:4,later:5,fini:6};
  const E=p=>Projets.etat(p,todayS), f=ui.filter;
  const nCours=S.projects.filter(p=>!isMini(p)&&!isPerm(p)&&E(p)==='encours').length, nPrevu=S.projects.filter(p=>!isMini(p)&&E(p)==='prevu').length, nIdee=S.projects.filter(p=>!isMini(p)&&E(p)==='idee').length;
  let rows=S.projects.filter(p=>{ if(isMini(p)) return false; const e=E(p);
    if(f==='fini') return e==='archive'; if(f==='later') return e==='idee'; if(f==='prevu') return e==='prevu';
    if(f==='attente') return e==='encours'&&!isPerm(p)&&state(p)==='attente';
    return e==='encours'&&!isPerm(p); });
  const mOpen=S.projects.filter(p=>isMini(p)&&!p.closed), mBest=null; /* plus de mini projets : les petites tâches sont dans les domaines */
  const sort=ui.sort==='etat'||ui.sort==='parent'?ui.sort:'prio', prio=sort==='prio';

const plain=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function repriseInit(){
  const used=S.tags.filter(t=>S.projects.some(p=>(p.tags||[]).includes(t.id)));
  const R={tags:{},projs:{}};
  used.forEach(t=>{ const same=S.projects.find(p=>!p.closed&&!isMini(p)&&!p.parent&&plain(p.name)===plain(t.name));
    R.tags[t.id]={mode:/^perso$/i.test(t.name.trim())?'none':same?same.id:'new', nature:/talus|gdt|ouate|isol|expo|fertik|travaux|pro\b|mandat/i.test(t.name)?'pro':'perso'}; });
  S.projects.filter(p=>!p.closed&&!isMini(p)).forEach(p=>{ const t=(p.tags||[]).find(id=>R.tags[id]&&R.tags[id].mode!=='none');
    let par=p.parent||'';
    if(!par&&t){ const m=R.tags[t].mode; par=m==='new'?'tag:'+t:m; }
    if(par===p.id) par='';
    const t0=(p.tags||[]).find(id=>R.tags[id]);
    R.projs[p.id]={parent:par, nature:p.nature||(par?'':(t0?R.tags[t0].nature:'perso'))}; });
  return R; }

function backupDownload(tag){ try{ const blob=new Blob([JSON.stringify({app:'etabli',version:1,exported:new Date().toISOString(),data:S},null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='etabli-'+todayS+(tag?'-'+tag:'')+'.json'; document.body.appendChild(l); l.click(); setTimeout(()=>{URL.revokeObjectURL(u); l.remove();},1000); return true; }catch(e){ return false; } }
function repriseSave(){
  const R=ui.rep; if(!R) return; backupDownload('avant-reprise');
  const newIds={}; let i=0;
  Object.keys(R.tags).forEach(id=>{ const x=R.tags[id]; if(x.mode!=='new') return; if(!Object.values(R.projs).some(v=>v.parent==='tag:'+id)) return;
    const t=T(id); let em='✨'; for(const [re,e2] of SUGG){ if(re.test(t.name)){em=e2; break;} }
    const p={id:'p'+(Date.now()+(i++)),emoji:em,color:t.color||COLORS[i%COLORS.length],name:t.name,size:'perm',dur:null,imp:2,due:null,tags:[],weeks:[],days:[],why:'',next:'',folder:null,tasks:[],nature:x.nature};
    S.projects.push(p); newIds[id]=p.id; });
  Object.keys(R.tags).forEach(id=>{ const x=R.tags[id]; if(x.mode!=='new'&&x.mode!=='none'){ const tp=P(x.mode); if(tp&&!tp.nature) tp.nature=x.nature; } });
  Object.keys(R.projs).forEach(pid=>{ const p=P(pid), x=R.projs[pid]; if(!p) return; let par=x.parent||'';
    if(par.startsWith('tag:')) par=newIds[par.slice(4)]||'';

  /* deux niveaux au plus : un projet qui en contient d'autres reste au premier niveau */
  S.projects.forEach(p=>{ if(p.parent&&kidsOf(p.id).length) delete p.parent; });
  S.reprise={le:todayS}; ui.rep=null; quiet=true; save(); quiet=false; closeSheet(); toast('Nouvelle organisation enregistrée'); }

const dRecent=p=>{ const lim=iso(new Date(today.getFullYear(),today.getMonth(),today.getDate()-56)); return pWeeks(p).some(w=>w>=wkKey(parse(lim))); };

  S.projects.filter(p=>isMini(p)&&!p.closed).forEach(p=>{ R.minis[p.id]='d:'+AUTRES; });

  const topRows=Object.keys(R.tops).map(P).filter(Boolean).sort((a,b)=>(isPerm(b)-isPerm(a))||a.name.localeCompare(b.name,'fr')).map(p=>`<div class="reprow" style="border-left:6px solid ${p.color}"><span class="nm">${p.emoji} ${esc(p.name)}<small>${isPerm(p)?'∞ · ':''}${stName(p)} · ${natureOf(p)}</small></span><select data-drep-top="${p.id}" aria-label="Que devient ${esc(p.name)}"><option value="p"${R.tops[p.id].dom?'':' selected'}>reste un projet (Autres projets)</option><option value="d"${R.tops[p.id].dom?' selected':''}>devient un domaine</option></select></div>`).join('');

function dRepriseSave(){
  const R=ui.drep; if(!R) return; backupDownload('avant-domaines');
  S.projects.forEach(p=>{ if(!isMini(p)) p.nature=natureOf(p); }); /* perso/pro figé sur chaque projet, sans héritage */
  const conv=[...Object.keys(R.par),...Object.keys(R.tops).filter(id=>R.tops[id].dom)].map(P).filter(Boolean);
  let n=0; const keepers={};
  conv.forEach(p=>{ const d={id:p.id,kind:'domaine',name:p.name,emoji:p.emoji||'📁',color:p.color,tasks:p.tasks||[],cree:todayS};
    if(p.notes&&p.notes.length) d.notes=p.notes; if(p.closed) d.closed=p.closed; if(p.why) d.why=p.why;
    if(R.par[p.id]&&R.par[p.id].keep&&!p.closed){ const k=Projets.nouveau({id:'p'+(Date.now()+(n++)),emoji:p.emoji,color:p.color,name:p.name,size:'perm',dur:null,imp:p.imp||2,due:null,weeks:p.weeks||[],days:p.days||[],nature:natureOf(p),parent:p.id,touche:p.touche||todayS}); S.projects.push(k); keepers[p.id]=k.id; }
    S.domains.push(d); });
  const ids=new Set(conv.map(p=>p.id));
  S.projects=S.projects.filter(p=>!ids.has(p.id));
  S.projects.forEach(p=>{ if(p.parent&&!ids.has(p.parent)&&!S.domains.some(d=>d.id===p.parent)) delete p.parent; });
  S.entries.forEach(e=>{ if(keepers[e.pid]) e.pid=keepers[e.pid]; });
  Object.keys(S.order||{}).forEach(k=>{ S.order[k]=(S.order[k]||[]).map(x=>keepers[x]||x); });
  /* mini projets → tâches (une section s'il avait des étapes ou des notes) */
  Object.keys(R.minis).forEach(mid=>{ const m=P(mid), v=R.minis[mid]; if(!m) return;
    if(v==='keep'){ m.size='proj'; m.dur=0.5; if(!m.emoji) m.emoji='✨'; if(m.color===MINI_COLOR) m.color=COLORS[Math.floor(Math.random()*COLORS.length)]; m.nature=m.nature||'perso'; return; }
    const h=v.startsWith('p:')?P(v.slice(2)):D(v.slice(2)); if(!h) return;
    const notes=(m.notes||[]).filter(x=>x.t).map(x=>({t:'📝 '+x.t,d:!!x.d}));
    if(m.tasks.length||notes.length){ h.tasks.push({t:m.name,s:true}); m.tasks.forEach(x=>h.tasks.push({t:x.t,d:!!x.d})); notes.forEach(x=>h.tasks.push(x)); }
    else h.tasks.push({t:m.name+(m.due?' (⏱ '+fmt(m.due)+')':''),d:false});
    sinkDone(h); S.projects=S.projects.filter(x=>x!==m); });
  S.domains.sort((a,b)=>String(a.name).localeCompare(String(b.name),'fr'));
  S.domaines={le:todayS}; ui.drep=null; ui.sort='parent'; quiet=true; save(); quiet=false; markSeen(); closeSheet(); toast('Domaines enregistrés'); render(); }

function histPush(kind){ try{ history.pushState({etabli:kind},''); }catch(e){} }
function histDrop(n){ if(n>0){ skipPop++; try{ history.go(-n); }catch(e){ skipPop--; } } }

function openSheet(html,key){ if($scrim.hidden&&!histSheet){ histSheet=true; histPush('sheet'); } const keep=!$scrim.hidden&&key&&key===sheetKey; const st=$sheet.scrollTop; const opened=keep?[...$sheet.querySelectorAll('details')].map(d=>d.open):null; $sheet.innerHTML=html; $scrim.hidden=false; if(keep){ $sheet.querySelectorAll('details').forEach((d,i)=>{ if(opened[i]!=null) d.open=opened[i]; }); $sheet.scrollTop=st; } else $sheet.scrollTop=0; sheetKey=key||null; }

function canAdd(p,k,mode){const c=inWeek(k), inIt=c.all.includes(p); if(mode==='s'){ if(p.weeks.includes(k)) return true; if(c.n.length>=MAXW) return false; } return inIt||c.all.length<MAXT;}

  return `<div class="alert"><div>La semaine ${wkNum(k)} a déjà ${wk?MAXW+' projets sur toute la semaine':MAXT+' projets'}. Lequel laisse sa place à <b>${p.emoji} ${esc(p.name)}</b> ?</div><div class="pchips">${list.map(a=>`<button class="pchip" style="${pv(a)}" data-act="swapWk" data-out="${a.id}" data-in="${p.id}" data-k="${k}">${a.emoji} ${esc(a.name)}</button>`).join('')}</div></div>`;}
function removeFromWeek(p,k){ const [a,b]=wkDates(k); p.days=p.days.filter(d=>d<a||d>b); p.weeks=p.weeks.filter(w=>w!==k); }

function starPick(cur,act){return `<div class="starpick">${[1,2,3].map(n=>`<button data-act="${act}" data-n="${n}" class="${n<=cur?'on':''}" aria-label="${IMP[n]}">★</button>`).join('')}<span class="cap">${IMP[cur]}</span></div>`;}
const TASK_DUR=/\((\d+(?:[.,]\d+)?)\s*(min|h|j)\)/i;
function parseTask(t){ const m=String(t).match(TASK_DUR); let mins=null; if(m){ const v=parseFloat(m[1].replace(',','.')), u=m[2].toLowerCase(); mins=u==='min'?v:u==='h'?v*60:v*480; } return {mins, admin:/(^|\s)@admin\b/i.test(t)}; }
function fmtMins(m){ if(!m) return ''; if(m>=480&&m%480===0) return (m/480)+' j'; const h=Math.floor(m/60), r=Math.round(m%60); return h?(h+' h'+(r?' '+String(r).padStart(2,'0'):'')):r+' min'; }
function taskText(t){ return esc(t).replace(/\((\d+(?:[.,]\d+)?)\s*(min|h|j)\)/ig,'<span class="tdur">$1 $2</span>').replace(/(^|\s)@admin\b/ig,'$1<span class="tadm">admin</span>'); }
const nextOf=p=>{ const t=(p.tasks||[]).find(x=>!x.d&&!x.s); return t?t.t.replace(TASK_DUR,'').replace(/(^|\s)@admin\b/ig,' ').replace(/\s+/g,' ').trim():(p.next||''); };
function sinkDone(p){ const nt=Projets.trierTaches(p.tasks); if(nt.some((x,i)=>x!==p.tasks[i])) p.tasks=nt; }
function tasksBlock(p,closed,word){
  const all=p.tasks.map((x,i)=>({x,i})), adminN=all.filter(o=>!o.x.s&&parseTask(o.x.t).admin).length, only=!!(ui.taskAdmin&&adminN);
  const T0=p.tasks.filter(x=>!x.s), list=(only?all.filter(o=>!o.x.s&&parseTask(o.x.t).admin):all).filter(o=>ui.showDone||!o.x.d), n=T0.length, d=T0.filter(x=>x.d).length;
  const rest=all.filter(o=>!o.x.s&&!o.x.d).reduce((a,o)=>a+(parseTask(o.x.t).mins||0),0), firstOpen=p.tasks.findIndex(x=>!x.d&&!x.s);
  return `<div class="field"><span class="lbl">${word==='étape'?'Étapes':'Tâches'} ${n?d+'/'+n:''}${rest?' · reste ≈ '+fmtMins(rest):''}</span>
   ${adminN?`<div class="seg tfilt"><button data-act="tfilt" data-v="0" aria-pressed="${!only}">Toutes</button><button data-act="tfilt" data-v="1" aria-pressed="${only}">Admin (${adminN})</button></div>`:''}

function durPick(mode,dur,act){ const isM=mode===true||mode==='mini', isP=mode==='perm'; return `<div class="durrow"><div class="dfree${isM||isP?'':' on'}"><button class="dstep" data-act="durStep" data-d="-1" data-for="${act}" aria-label="Un jour de moins">−</button><input class="input" type="number" min="0.5" step="any" inputmode="decimal" data-durother="${act}" value="${!isM&&!isP&&dur!=null?dur:''}" placeholder="—" aria-label="Durée en jours"><span>j</span><button class="dstep" data-act="durStep" data-d="1" data-for="${act}" aria-label="Un jour de plus">+</button></div><button class="dmini" data-act="${act}" data-v="perm" aria-pressed="${isP}">∞ Perpétuel<small>sans fin ni durée</small></button></div>`; }
function applyDur(p,v){ if(v==='perm'){ if(isPerm(p)){ p.size='proj'; p.dur=p.dur||5; return; } if(isMini(p)){ if(!p.emoji) p.emoji='✨'; if(p.color===MINI_COLOR) p.color=COLORS[Math.floor(Math.random()*COLORS.length)]; } p.size='perm'; p.due=null; return; } if(v!=='mini'&&Number(v)<0.5) v=0.5; if(v==='mini'){ p.size='mini'; p.dur=null; p.emoji=''; p.color=MINI_COLOR; p.weeks=[]; p.days=[]; return; } const n=Number(v); if(!(n>0)) return; if(isMini(p)){ if(!p.emoji) p.emoji='✨'; if(p.color===MINI_COLOR) p.color=COLORS[Math.floor(Math.random()*COLORS.length)]; } p.size='proj'; p.dur=n; }

function tagPick(sel,act){return `<div class="pchips">${S.tags.map(t=>`<button class="tchip${t.color?' col':''}"${tcs(t)} data-act="${act}" data-t="${t.id}" aria-pressed="${sel.includes(t.id)}">${esc(t.name)}</button>`).join('')}</div>

function dueHint(due,dur){ if(!due) return 'Pas d\'échéance, pas d\'urgence.'; dur=dur||0; const n=days(due); if(n<0) return 'Échéance dépassée : urgent.'; const L=urgLimit(dur); if(L==null) return 'À '+n+' jour'+(n>1?'s':'')+(n<=7?' : urgent (dernière semaine).':' : urgent dans la dernière semaine.'); const w=workdaysUntil(due); return 'À '+w+' jour'+(w>1?'s':'')+' ouvrable'+(w>1?'s':'')+(w<=L?' : urgent':' : pas encore urgent')+' (urgent dès '+L+' j ouvrables, 3 × la durée).'; }

/* Argent et heures d'un projet, lus dans la Banque (opérations reliées au projet) et la Mine (son mandat) — étape 2 */
let apercuMem=null;
const apercuK=()=>'etabli-apercu-'+UID;
function apercuGet(id){ if(!apercuMem){ try{ apercuMem=JSON.parse(localStorage.getItem(apercuK())||'{}')||{}; }catch(e){ apercuMem={}; } } return apercuMem[id]||null; }
function apercuSet(id,a){ apercuGet(id); apercuMem[id]=a; try{ localStorage.setItem(apercuK(),JSON.stringify(apercuMem)); }catch(e){} }
const chf=v=>Number(v||0).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const estProCat=c=>c==='pro'||String(c||'').startsWith('pro.');
function apercuHtml(a){ if(!a) return ''; const L=[];
  if(a.mandat) L.push(`<p style="margin:0">⛏️ <b>${esc(a.mandat)}</b> · ${nf((a.min||0)/60)} h · facturé ${chf(a.fact)} · encaissé ${chf(a.enc)}</p>`);
  if(a.n) L.push(`<p style="margin:0">🏦 ${a.n} opération${a.n>1?'s':''} · dépenses <b>${chf(-a.dep)}</b>${a.rec?` · recettes <b>${chf(a.rec)}</b>`:''} · net ${chf(a.dep+a.rec)} CHF</p>`);
  return L.length?`<div class="field"><span class="lbl">Argent et heures <small style="font-weight:400;text-transform:none;letter-spacing:0">· lus dans ${a.mandat?'la Mine et ':''}la Banque</small></span>${L.join('')}</div>`:''; }
async function chargerApercu(p){
  const show=a=>{ const b=document.getElementById('apercu'); if(b&&sheetId===p.id) b.innerHTML=apercuHtml(a); };
  show(apercuGet(p.id));
  if(!sb||!UID||!navigator.onLine) return;
  try{
    const A={n:0,dep:0,rec:0}, vus=new Set();
    const ajoute=(t,proSeul)=>{ if(!t||vus.has(t.id)) return; vus.add(t.id); const L=t.parts&&t.parts.length?t.parts:[{montant:t.montant,cat:t.cat}]; let v=0; L.forEach(l=>{ if(!proSeul||estProCat(l.cat)) v+=+l.montant||0; }); if(!v) return; A.n++; if(v<0) A.dep+=v; else A.rec+=v; };
    const {data:tx,error}=await sb.from('cash_rows').select('key,data').eq('kind','tx').eq('deleted',false).eq('data->>projet',p.id); if(error) throw error;
    (tx||[]).forEach(r=>ajoute(r.data,false));
    if(natureOf(p)==='pro'){
      const {data:ms}=await sb.from('mine_rows').select('key,data').like('key','m:%').eq('deleted',false).eq('data->>projet',p.id);
      const m=(ms||[]).map(r=>r.data).find(Boolean);
      if(m){ A.mandat=m.nom; A.fact=0; A.enc=0;
        const {data:hs}=await sb.from('mine_rows').select('data').like('key','h:%').eq('deleted',false).eq('data->>mandat',m.id);
        A.min=(hs||[]).reduce((x,r)=>x+((r.data&&+r.data.min)||0),0);
        const {data:ds}=await sb.from('mine_rows').select('data').like('key','d:%').eq('deleted',false).eq('data->>mandat',m.id);
        (ds||[]).forEach(r=>{ const d=r.data; if(!d||d.type!=='facture') return; const tot=Math.round((d.lignes||[]).reduce((x,l)=>x+(+l.qte||0)*(+l.prix||0),0)*20)/20; if(d.etat==='envoyee'||d.etat==='payee') A.fact+=tot; if(d.etat==='payee') A.enc+=tot; });
        const {data:ls}=await sb.from('mine_rows').select('key').like('key','l:%').eq('deleted',false).eq('data->>mandat',m.id);
        const keys=(ls||[]).map(r=>'t:'+r.key.slice(2));
        for(let i=0;i<keys.length;i+=100){ const {data:t2}=await sb.from('cash_rows').select('key,data').eq('kind','tx').eq('deleted',false).in('key',keys.slice(i,i+100)); (t2||[]).forEach(r=>ajoute(r.data,true)); } } }
    A.le=todayS; apercuSet(p.id,A); show(A);
  }catch(e){ /* hors ligne ou table absente : on garde le dernier aperçu */ }
}

  ${msg&&msg!=='del'?msg:''}

function bravo(p){

  const cv=wrap.querySelector('canvas'); let ctx2=null; try{ctx2=cv.getContext('2d');}catch(e){}
  if(reduce||!ctx2){ wrap.classList.add('calm'); setTimeout(end,big?3000:1600); return; }
  const W=cv.width=innerWidth, H=cv.height=innerHeight, cols=[p.color,'#F5CF4E','#E0574F','#4A86D9','#5BAE5B','#F07F9E','#FFFFFF'];
  const parts=[]; let t=0;
  const burst=(x,y)=>{ for(let i=0;i<46;i++){ const a=Math.PI*2*i/46+Math.random()*.2, v=2+Math.random()*4.5; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[(Math.random()*cols.length)|0],l:60+Math.random()*30,s:3+((Math.random()*3)|0)}); } };
  let shots=[[.25,.3,0],[.75,.25,14],[.5,.18,26],[.2,.55,40],[.8,.5,50],[.5,.42,62]];
  if(big){ shots=[]; for(let i=0;i<26;i++) shots.push([.1+Math.random()*.8,.1+Math.random()*.55,i*13]); }
  (function frame(){ if(!wrap.parentNode) return; t++;
    shots.forEach(([fx,fy,at])=>{ if(t===at+1) burst(W*fx,H*fy); });
    ctx2.clearRect(0,0,W,H);
    for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.x+=q.vx; q.y+=q.vy; q.vy+=.06; q.vx*=.985; q.l--; if(q.l<=0){parts.splice(i,1); continue;} ctx2.globalAlpha=Math.min(1,q.l/30); ctx2.fillStyle=q.c; ctx2.fillRect(q.x,q.y,q.s,q.s); }
    ctx2.globalAlpha=1;

  })();
}

function moveSeg(p,a,b,delta){
  const wk0=p.weeks.slice(), d0=p.days.slice(), sh=(x,n)=>{ const d=parse(x); d.setDate(d.getDate()+n); return iso(d); };
  const wIn=p.weeks.filter(k=>{ const m=iso(wkMon(k)); return m>=a&&m<=b; }), dIn=p.days.filter(x=>x>=a&&x<=b), wd=Math.round(delta/7);
  if(wIn.length&&!dIn.length&&wd===0) return 'none';
  p.weeks=p.weeks.filter(k=>!wIn.includes(k)).concat(wIn.map(k=>wkAdd(k,wd)));
  p.days=p.days.filter(x=>!dIn.includes(x)).concat(dIn.map(x=>sh(x,delta)));
  p.weeks=[...new Set(p.weeks)].sort(); p.days=[...new Set(p.days)].filter(x=>!p.weeks.includes(wkKey(parse(x)))||true).sort();
  const bad=pWeeks(p).find(k=>{ const c=inWeek(k); return c.all.length>MAXT||c.n.length>MAXW; });
  if(bad){ p.weeks=wk0; p.days=d0; return 'full:'+bad; }
  return 'ok';
}
