<!doctype html>
<html lang="fr" data-lieu="etabli">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L’Établi</title>
<meta name="theme-color" content="#C2AC85">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icons/tete-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(../commun/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(../commun/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url(../commun/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-style:normal;font-display:swap;src:url(../commun/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout : appli mobile, la semaine comme unité (3 cases + 2 petits), création express en un écran ; angles droits, thème clair uniquement */
:root{
  /* charte du 15.11 (commun/CHARTE.md) : bois huilé, contreplaqué, graphite et jaune du mètre ; --ink et --line viennent du lieu */
  --paper:var(--page); --cell:var(--surface); --muted:var(--on-page-2); /* sur la page ; les cartes remettent --ink-3 */ --grid:color-mix(in srgb,var(--line) 70%,var(--surface)); --thead:var(--surface-2); --bd:var(--line-2);
  --band:var(--accent); --band-ink:var(--on-acc);
  --other:color-mix(in srgb,var(--ink) 12%,var(--surface)); --pos:var(--good); --neg:var(--bad); --urg:var(--crayon); --star:var(--warn);
  /* jours et états (25.11) : une teinte mêlée à la carte, lisible avec toutes les palettes */
  --jour-we:color-mix(in srgb,var(--ink) 9%,var(--surface)); --jour-off:color-mix(in srgb,#E7739F 28%,var(--surface)); --jour-off-2:color-mix(in srgb,#E7739F 45%,var(--surface)); --jour-tod:color-mix(in srgb,#F2C230 16%,var(--surface));
  --scrim:rgba(38,35,33,.5);
  --body:var(--f-body); --mono:var(--f-mono);
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}

button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
h1,h2,h3{margin:0;text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.top h1{font-size:1.05rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top .sub{font-family:var(--mono);font-size:.78rem;opacity:.75}
.top .btns{display:flex;gap:5px;flex:none}
@media (max-width:430px){.top .brand{gap:6px}.top .btns{gap:4px}.topbtn{padding:5px 6px}}
.top .orga{align-self:center;display:inline-flex;color:var(--band-ink);padding:4px 4px 4px 0;margin-right:2px;opacity:.9}
.topbtn{border:1px solid rgba(255,255,255,.55);background:transparent;color:var(--band-ink);padding:5px 8px;font-size:.8rem;font-weight:700;white-space:nowrap}
.topbtn.plus{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.note{margin:10px 0 0;font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:.8rem}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.empty{font-size:.86rem;color:var(--muted);padding:10px 12px}
.btn{border:1px solid var(--bd);padding:12px 16px;font-weight:700;background:var(--ink);color:var(--paper);width:100%}
.btn.ghost{background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.btn.warn{background:var(--cell);color:var(--neg);border-color:var(--neg);--muted:var(--ink-3)}
.sechead{background:var(--band);color:var(--band-ink);padding:8px 12px;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:20px;display:flex;justify-content:space-between;gap:10px}
.sechead span{font-family:var(--mono);font-weight:400;text-transform:none;letter-spacing:0}
.stars{color:var(--star);letter-spacing:-.05em;font-size:.9em;white-space:nowrap}
.stars .off{color:var(--line)}
.urg{background:var(--urg);color:#fff;font-family:var(--mono);font-size:.68rem;font-weight:600;padding:1px 5px;letter-spacing:.04em;white-space:nowrap}
.tg{display:inline-block;border:1px solid currentColor;font-size:.7rem;font-weight:700;padding:0 5px;letter-spacing:.02em;white-space:nowrap}

/* Navigation de semaine */
.wknav{display:flex;align-items:stretch;border:1px solid var(--bd);margin:14px 0 12px;background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.wknav button{border:0;background:var(--cell);width:48px;font-size:1.2rem;flex:none;color:var(--ink);--muted:var(--ink-3)}
.wknav button:first-child{border-right:1px solid var(--bd)}
.wknav button:last-child{border-left:1px solid var(--bd)}
.wknav .mid{flex:1;text-align:center;padding:8px 6px;min-width:0}
.wknav .mid b{display:block;font-size:1.05rem}
.wknav .mid span{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.wknav .mid{background:var(--other);color:var(--ink);--muted:var(--ink-3)}
.wknav.cur .mid{background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.rule{font-size:.86rem;color:var(--muted);margin:0}
.rulerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.orgbtn{border:1px solid var(--bd);background:var(--cell);padding:6px 12px;font-weight:700;font-size:.85rem;flex:none;color:var(--ink);--muted:var(--ink-3)}
.orgbtn.on{background:var(--ink);color:var(--paper)}
.orgbar{display:flex;border-top:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.orgbar button{border:0;border-right:1px solid var(--bd);background:var(--cell);padding:10px 16px;font-weight:700;font-size:1rem;color:var(--ink);--muted:var(--ink-3)}
.orgbar button[disabled]{color:var(--line)}
.orgbar .rm{margin-left:auto;border-right:0;border-left:1px solid var(--bd);color:var(--neg);font-size:.85rem}
.small .smx{align-self:flex-start;margin-top:4px;border:1px solid currentColor;background:transparent;color:inherit;font-size:.75rem;font-weight:700;padding:2px 7px}
.vrac{border:1px solid var(--line);border-top:0;background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.vrac .inline .input{border:0;border-top:1px solid var(--line)}
.vrac .inline .btn{border:0;border-top:1px solid var(--bd)}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{display:flex;align-items:center;gap:8px;padding:0 0 0 12px;border-top:1px solid var(--line);min-height:42px;font-size:.93rem}
.vlist li:first-child{border-top:0}
.vlist .t{flex:1;min-width:0;padding:8px 0}
.vlist .vb{border:1px solid var(--bd);background:var(--cell);padding:4px 8px;font-size:.8rem;font-weight:700;white-space:nowrap;color:var(--ink);--muted:var(--ink-3)}
.vlist .vx{border:0;border-left:1px solid var(--line);background:none;align-self:stretch;width:44px;font-size:1.05rem;color:var(--muted)}
.sheet .vrac{border-top:1px solid var(--bd);border-color:var(--ink)}
.kb{display:none}
body.kbd .kb{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 3px;font-family:var(--mono);font-size:.7rem;font-weight:600;font-style:normal;background:var(--ink);color:var(--paper);line-height:1;flex:none;vertical-align:middle;letter-spacing:0;text-transform:none}
body.kbd .topbtn .kb{background:var(--band-ink);color:var(--band);margin-right:5px}
body.kbd .topbtn.plus .kb{background:var(--band);color:var(--band-ink)}
.tab{position:relative}
body.kbd .tab .kb{position:absolute;top:4px;right:6px}
body.kbd .tab[aria-current="page"] .kb{background:var(--paper);color:var(--ink)}
body.kbd .band .kb{background:var(--pt);color:var(--pc)}
body.kbd .xbtn .kb{background:currentColor;color:var(--pc,var(--band));margin-left:5px}
.vrac .inline .kb{align-self:center;margin:0 2px 0 10px}
body.kbd :focus{outline:3px solid var(--ink);outline-offset:-3px;box-shadow:inset 0 0 0 6px var(--hl)}
body.kbd .input:focus,body.kbd input:focus{box-shadow:inset 0 0 0 3px var(--hl)}
/* Mode mini (DumberOS, très petit écran) */
body.minimode .wrap>.note{display:none}
body.minimode .top .in{padding-block:6px}
.mbig{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.mbig button{border:2px solid var(--bd);background:var(--cell);padding:9px 4px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);--muted:var(--ink-3)}
.mbig button.dark{background:var(--ink);color:var(--paper)}
body.kbd .mbig button.dark .kb{background:var(--paper);color:var(--ink)}
.mlbl{margin-top:10px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
body.minimode .mrows{margin-top:4px;gap:4px}
body.minimode .mrow{height:44px}
.mnote{margin:6px 0 0;font-size:.78rem;color:var(--muted)}
body.minimode::before{background:var(--paper)}
body.minimode .wrap{padding-block:8px 8px}
.mhead{display:flex;align-items:stretch;border:1px solid var(--bd);background:var(--other);height:38px;color:var(--ink);--muted:var(--ink-3)}
.mhead.cur{background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.mhead button{border:0;background:var(--cell);padding:0 8px;font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:5px;color:var(--ink);--muted:var(--ink-3)}
.mhead .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.8rem;border-left:1px solid var(--bd);border-right:1px solid var(--bd);font-family:var(--mono);min-width:0;white-space:nowrap;overflow:hidden}
.mhead .mid b{font-family:var(--body);font-size:1rem}
.mrows{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--pc);color:var(--pt);padding:0 8px;height:52px;text-align:left;min-width:0;width:100%}
.mrow .emo{font-size:1.3rem}
.mrow .kb{background:var(--pt)!important;color:var(--pc)!important}
.mrow .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.mrow .tx b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx small{font-size:.76rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.free{--pc:transparent;--pt:var(--muted);border-style:dashed;border-color:var(--muted)}
.mrow.free .kb{background:var(--muted)!important;color:var(--paper)!important}
.mchips{display:flex;gap:5px;margin-top:5px}
.mchip{flex:1;min-width:0;border:1px solid var(--bd);background:var(--pc);color:var(--pt);font-size:.8rem;font-weight:700;padding:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.minline{display:flex;align-items:center;margin-top:6px;border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.minline .kb{margin-left:8px}
.minline .input{border:0;padding:9px 8px;font-size:.92rem}
.minline .btn{width:auto;border:0;border-left:1px solid var(--bd);padding:9px 13px}
.mkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.mkeys button{border:1px solid var(--bd);background:var(--cell);font-size:.76rem;font-weight:700;padding:6px 2px;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;color:var(--ink);--muted:var(--ink-3)}
.mmode{display:block;margin:6px auto 0;background:none;border:0;font-size:.74rem;color:var(--muted);text-decoration:underline}
.mback{margin:2px 0 8px}
.mback button{border:1px solid var(--bd);background:var(--cell);padding:6px 10px;font-weight:700;font-size:.85rem;display:inline-flex;gap:6px;align-items:center;color:var(--ink);--muted:var(--ink-3)}
body.minimode .sheet{max-height:100%}
body.minimode .shead{padding-block:8px}
body.minimode .shead h2{font-size:1.02rem}
body.minimode .shead .emo{font-size:1.4rem}
body.minimode .sbody{gap:12px;padding-top:10px}
body.minimode .gnav{margin-top:0}
.st-proch{background:color-mix(in srgb,#F0A35E 40%,var(--surface))}
.st-later{background:color-mix(in srgb,#8E9BC4 22%,var(--surface))}
.wkline{display:flex;align-items:stretch;margin-top:14px;border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.wklab{border:0;border-right:1px solid var(--bd);background:var(--cell);padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-family:var(--mono);line-height:1.15;color:var(--ink);--muted:var(--ink-3)}
.wklab b{font-size:.85rem}
.wklab span{font-size:.7rem;color:var(--muted)}
.wkchips{display:flex;flex-direction:column;gap:4px;padding:5px;min-width:0;flex:1;justify-content:center}
.wkchips .mini{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:left;display:block;padding:5px 8px}
.wkchips .mini.sm{font-weight:400;font-size:.78rem}
.ctrl{display:flex;flex-direction:column;gap:8px;margin:14px 0 10px}
.ctrl .chips{margin:0}
.ptable th.pth{position:sticky;left:0;z-index:3;background:var(--thead);border-right:1px solid var(--bd);min-width:210px;color:var(--ink);--muted:var(--ink-3)}
tbody tr.qrow{cursor:default}
.qrow td{background:var(--thead);height:auto;padding:6px 0;white-space:nowrap;color:var(--ink);--muted:var(--ink-3)}
.qrow .quad{position:sticky;left:10px;display:inline-flex;margin:0;padding-right:10px}
.tagfilter{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.tab .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--urg);color:#fff;font-family:var(--mono);font-size:.64rem;font-weight:600;min-width:16px;height:16px;padding:0 3px;display:grid;place-items:center}
.vadd{margin-top:14px;border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.vadd .input{border:0}
.vadd .btn{border:0;border-left:1px solid var(--bd);width:auto;padding:0 18px}
.vlist .vt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 0;font-size:.95rem}
.vlist .vgo{color:var(--muted);padding:0 12px;font-size:1.1rem}
.vlist .vchk{width:22px;height:22px;margin:0;accent-color:var(--ink);flex:none}
.vlist li.done .vt{color:var(--muted);text-decoration:line-through}
.vlist li.empty{padding:10px 12px}
.opts{display:flex;flex-direction:column;gap:6px}
.optbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);background:var(--cell);padding:10px 12px;text-align:left;width:100%;color:var(--ink);--muted:var(--ink-3)}
.optbtn .oe{font-size:1.5rem;flex:none}
.optbtn .tx{display:flex;flex-direction:column;min-width:0}
.optbtn .tx span{font-size:.8rem;color:var(--muted)}
.wslots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wslots li{display:flex;align-items:stretch;gap:0}
.wslots .pickbtn{flex:1;min-width:0}
.wslots .wrm{border:1px solid var(--bd);border-left:0;background:var(--cell);color:var(--neg);font-weight:700;font-size:.8rem;padding:0 10px;--muted:var(--ink-3)}
.wslots .slot.free{padding:12px}
.wkpick .wsep{background:var(--band);color:var(--band-ink);padding:4px 12px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:600px){.ptable th.pth{min-width:132px;max-width:132px}}
.bravo{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(20,20,20,.55);cursor:pointer}
.bravo canvas{position:absolute;inset:0;width:100%;height:100%}
.bravobox{position:relative;background:var(--pc);color:var(--pt);border:3px solid var(--bd);box-shadow:8px 8px 0 var(--ink);padding:18px 28px;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:calc(100% - 48px);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.bravobox .emo{font-size:2.4rem}
.bravobox b{font-family:var(--mono);font-size:2.4rem;letter-spacing:.12em;line-height:1}
.bravobox small{font-size:.9rem;font-weight:700;text-align:center;overflow-wrap:anywhere}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.bravobox{animation:none}}
.notesprev{border:1px solid var(--bd);background:var(--cell);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;color:var(--ink);--muted:var(--ink-3)}
.notesprev span{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.notesprev b{font-size:.85rem;margin-top:4px}
#notesbib{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);--muted:var(--ink-3)}
#notesbib .nb-bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--head);color:var(--on-head)}
#notesbib .nb-bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#notesbib .nb-bar span{font:400 .7rem/1 var(--mono,monospace);text-transform:uppercase;letter-spacing:.12em;opacity:.8}
#notesbib .xbtn{color:inherit;border-color:currentColor;background:transparent}
#notesbib iframe{flex:1;width:100%;border:0;display:block}
.nbframe{display:block;width:100%;height:120px;border:0;background:transparent;color-scheme:light}
.nblbl{display:flex;align-items:baseline;gap:10px}.nblbl .linkbtn{margin-left:auto;font-size:.8rem}
body.nb-open{overflow:hidden}
.nlist{list-style:none;margin:0;padding:0;border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.nl{display:flex;align-items:center;padding-left:calc(var(--lv) * 22px);border-top:1px solid var(--grid)}
.nl:first-child{border-top:0}
.nb{width:30px;height:38px;flex:none;border:0;background:none;font-size:1rem;color:var(--muted);padding:0}
.nb.has{color:var(--ink);font-weight:700}
.ni{flex:1;min-width:0;border:0;background:transparent;padding:9px 8px 9px 0;font-size:1rem}
.ni:focus{outline:none;background:var(--hl);color:var(--ink);--muted:var(--ink-3)}
.nl.done .ni{text-decoration:line-through;color:var(--muted)}
.ntools{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin-top:14px;display:grid;grid-template-columns:repeat(6,1fr);border-top:2px solid var(--bd);background:var(--cell);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));color:var(--ink);--muted:var(--ink-3)}
.ntools button{border:0;border-left:1px solid var(--line);background:var(--cell);padding:12px 0;font-size:1.15rem;font-weight:700;color:var(--ink);--muted:var(--ink-3)}
.ntools button:first-child{border-left:0}
.sync{border:0;background:transparent;font-family:var(--mono);font-size:.74rem;font-weight:600;padding:2px 6px;color:var(--band-ink);opacity:.9}
.sync.ok{color:color-mix(in srgb,#3FA66A 50%,var(--on-head))}.sync.pend{color:color-mix(in srgb,#E8B020 50%,var(--on-head))}.sync.err{color:color-mix(in srgb,#E5484D 50%,var(--on-head))}.sync.off{color:color-mix(in srgb,var(--on-head) 70%,transparent)}
.login{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Planning : jours en colonnes, projets en lignes */
.gnav{display:flex;align-items:stretch;border:1px solid var(--bd);margin:14px 0 10px;background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.gnav button{border:0;border-left:1px solid var(--bd);background:var(--cell);padding:9px 10px;font-weight:700;font-size:.84rem;white-space:nowrap;color:var(--ink);--muted:var(--ink-3)}
@media (max-width:460px){.gnav button{padding:9px 6px;font-size:.78rem}}
.gnav button:first-child{border-left:0}
.gnav .mid{flex:1}
.gantt{overflow-x:auto;border:1px solid var(--bd);background:var(--cell);--cw:28px;--lw:0px;color:var(--ink);--muted:var(--ink-3)}
.gantt .gl{display:none}
.glab{grid-row:1;z-index:1;align-self:center;font-size:.78rem;font-weight:700;line-height:1.15;overflow:hidden;padding-left:4px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.gin{width:calc(var(--lw) + var(--cw) * var(--n))}
.grow{display:flex;border-top:1px solid var(--grid)}
.grow:first-child{border-top:0}
.gl{position:sticky;left:0;z-index:3;width:var(--lw);flex:none;border:0;border-right:1px solid var(--bd);background:var(--thead);display:grid;place-items:center;font-size:1.2rem;padding:0;color:var(--ink);--muted:var(--ink-3)}
.grow.proj .gl{background:var(--pc)}
.gg{display:grid;grid-template-columns:repeat(var(--n),var(--cw));grid-template-rows:34px;flex:none}
.gg>*{grid-row:1;min-width:0}
.bgc{border-left:1px solid var(--grid)}
.bgc.mon{border-left:1px solid var(--line)}
.bgc.we{background:var(--jour-we);color:var(--ink);--muted:var(--ink-3)}
.bgc.off{background:var(--jour-off)}
.bgc.tod{background:var(--jour-tod);color:var(--ink);--muted:var(--ink-3)}
.hm .gg{grid-template-rows:26px;background:var(--band);color:var(--band-ink)}
.hm .gl{background:var(--band)}
.hm .mo{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:5px 6px;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line-2)}
.hw .gg{grid-template-rows:38px}
.hw .wk{border:0;border-left:1px solid var(--bd);background:var(--other);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 6px;text-align:left;gap:1px;color:var(--ink);--muted:var(--ink-3)}
.hw .wk.cur{background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.hw .wk b{font-family:var(--mono);font-size:.82rem}
.hw .wk span{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.hw .wk span.full{color:var(--ink);font-weight:600}
.hd .gg{grid-template-rows:24px}
.hd .dn{display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;border-left:1px solid var(--grid);border-top:1px solid var(--line)}
.hd .dn.we{background:var(--jour-we);color:var(--ink);--muted:var(--ink-3)}
.hd .dn.off{background:var(--jour-off-2)}
.hd .dn.tod{background:var(--ink);color:var(--on-ink);font-weight:600}
.gbar{grid-row:1;margin:4px 0;border:0;background:var(--pc);color:var(--pt);font-size:.8rem;font-weight:700;padding:0 5px;display:flex;align-items:center;gap:4px;overflow:hidden;text-align:left;z-index:1;line-height:1.15}
.gbar .ge{flex:none}
.gbar:not(.s){overflow:hidden;overflow:clip}
.glbl{position:sticky;left:6px;display:flex;align-items:center;gap:4px;min-width:0;max-width:min(240px,100%)}
.gbar .gt{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.grow.proj .gg{grid-template-rows:64px}
.gbar.s{font-size:1.1rem}
.gbar.s{justify-content:center;padding:0}
.gdue{grid-row:1;z-index:2;align-self:center;justify-self:center;width:20px;height:20px;background:var(--ink);color:var(--on-ink);font-size:.68rem;display:grid;place-items:center;border:0;padding:0}
.planlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:10px;align-items:center}
.planlegend b{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px}
/* Filtres */
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--bd);background:var(--cell);padding:7px 11px;font-size:.85rem;white-space:nowrap;color:var(--ink);--muted:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}

/* Tableau */
.tablebox{overflow-x:auto;border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
table{border-collapse:collapse;min-width:820px;width:100%;font-size:.9rem}
th{background:var(--thead);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);border-left:1px solid var(--line);white-space:nowrap;vertical-align:bottom;color:var(--ink);--muted:var(--ink-3)}
th:first-child,td:first-child{border-left:0}
td{padding:0 10px;height:42px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.pcell{padding:0;position:sticky;left:0;z-index:1;background:var(--cell);min-width:210px;max-width:230px;color:var(--ink);--muted:var(--ink-3)}
.pcell .in{display:flex;align-items:stretch;height:42px}
.pcell .sw{width:38px;background:var(--pc);display:grid;place-items:center;font-size:1.1rem;flex:none}
.pcell .nm{padding:0 10px;display:flex;align-items:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;border-right:1px solid var(--bd)}
td.st{font-weight:700;font-size:.86rem}
.pcell .nm>span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){
  td.pcell{min-width:132px;max-width:132px}
  .pcell .sw{width:30px;font-size:1rem}
  .pcell .nm{white-space:normal;font-size:.8rem;line-height:1.15;padding:0 7px}
  .pcell .nm>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
.st-cours{background:color-mix(in srgb,#E0574F 35%,var(--surface))}.st-plan{background:var(--hl);color:var(--ink);--muted:var(--ink-3)}.st-attente{background:color-mix(in srgb,var(--ink) 14%,var(--surface))}.st-perm{background:color-mix(in srgb,#9A6BD1 18%,var(--surface))}.st-fini{background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
td .tg{margin-right:4px;color:var(--muted)}

/* Formulaires */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--bd)}
.seg button{border:0;border-left:1px solid var(--bd);background:var(--cell);padding:10px 6px;font-weight:700;font-size:.9rem;color:var(--ink);--muted:var(--ink-3)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.input{width:100%;border:1px solid var(--bd);background:var(--cell);padding:10px 12px;font-size:1rem;min-width:0;color:var(--ink);--muted:var(--ink-3)}
textarea.input{min-height:70px;resize:vertical}
.amount{display:flex;align-items:stretch}
.amount .input{font-family:var(--mono);font-size:1.5rem;text-align:center;border-left:0;border-right:0}
.amount .step{flex:none;width:52px;border:1px solid var(--bd);background:var(--cell);font-size:1.3rem;color:var(--ink);--muted:var(--ink-3)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.qb{border:1px solid var(--bd);background:var(--cell);padding:6px 11px;font-size:.84rem;font-family:var(--mono);color:var(--ink);--muted:var(--ink-3)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:2px solid transparent;background:var(--pc);color:var(--pt);padding:6px 10px;font-size:.88rem;font-weight:700;display:inline-flex;gap:6px;align-items:center;text-align:left}
.pchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--cell)}
.pchips.dim .pchip[aria-pressed="false"]{opacity:.5}
.tchip{border:1px solid var(--bd);background:var(--cell);padding:6px 10px;font-size:.86rem;font-weight:700;color:var(--ink);--muted:var(--ink-3)}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tchip.add{border-style:dashed;color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hbars{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-top:0;background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.hbars li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:.9rem}
.hbars li:first-child{border-top:0}
.hbars .b{grid-column:1/-1;height:8px;background:var(--grid)}
.hbars .b i{display:block;height:100%;background:var(--pc,var(--ink))}
.hbars .v{font-family:var(--mono)}
.log{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-top:0;background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.log li{display:flex;align-items:center;gap:10px;padding:7px 0 7px 12px;border-top:1px solid var(--line);font-size:.86rem}
.log li:first-child{border-top:0}
.log .d{font-family:var(--mono);font-size:.74rem;color:var(--muted);width:50px;flex:none}
.log .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .v{font-family:var(--mono);white-space:nowrap}
.log .x{background:none;border:0;color:var(--muted);padding:4px 12px;font-size:1.05rem}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* Création express */
.namerow{display:flex;align-items:stretch}
.emobtn{width:64px;flex:none;border:1px solid var(--bd);border-right:0;background:var(--pc);font-size:2rem;display:grid;place-items:center;padding:0}
.namerow .input{font-size:1.15rem;font-weight:700}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sizes button{border:2px solid var(--bd);background:var(--cell);padding:10px 10px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);--muted:var(--ink-3)}
.sizes b{font-family:var(--mono);font-size:1.2rem}
.sizes span{font-size:.76rem;color:var(--muted)}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sizes button[aria-pressed="true"] span{color:var(--paper);opacity:.8}
.starpick{display:flex;align-items:center;gap:4px}
.starpick button{border:1px solid var(--bd);background:var(--cell);width:52px;height:46px;font-size:1.5rem;color:var(--line);padding:0;--muted:var(--ink-3)}
.starpick button.on{color:var(--star)}
.starpick .cap{margin-left:8px;font-size:.86rem;color:var(--muted)}
.duerow{display:flex;align-items:stretch;gap:0}
.duerow .input{flex:1}
.duerow button{border:1px solid var(--bd);border-left:0;background:var(--cell);padding:0 12px;font-size:.85rem;color:var(--ink);--muted:var(--ink-3)}
.duehint{font-size:.82rem;color:var(--muted);margin:0}
details.more>summary{cursor:pointer;list-style:none;font-size:.86rem;font-weight:700;padding:8px 0;border-top:1px dashed var(--line)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
details.more .field{margin-top:10px}

/* Choix d'émoji */
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.ecats{display:flex;flex-direction:column;gap:4px}
.ecat{border:2px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.ecat summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;font-size:.95rem}
.ecat summary::-webkit-details-marker{display:none}
.ecat summary::before{content:'▸';font-weight:700}
.ecat[open] summary::before{content:'▾'}
.ecat .eprev{font-size:1.1rem;letter-spacing:2px;flex:1;text-align:right;white-space:nowrap;overflow:hidden}
.ecat .en{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.ecat[open] .eprev{visibility:hidden}
.ecat .emogrid{padding:0 6px 8px}
.ecat .emogrid button{background:var(--paper)}
#f-emosearch{position:sticky;top:0;z-index:2}
.emogrid button{aspect-ratio:1;border:0;background:var(--cell);font-size:1.45rem;padding:0;max-width:100%;color:var(--ink);--muted:var(--ink-3)}
.emogrid button:active{background:var(--hl);color:var(--ink);--muted:var(--ink-3)}
.emocat{margin-top:12px}

/* Placement jours */
.daypick{display:flex;flex-direction:column;gap:10px}
.dweek{border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.dweek .h{display:flex;justify-content:space-between;padding:6px 10px;background:var(--thead);font-size:.8rem;border-bottom:1px solid var(--line);color:var(--ink);--muted:var(--ink-3)}
.dweek .h b{font-family:var(--mono)}
.dweek .h .full{color:var(--neg);font-weight:700}
.dweek .d7{display:grid;grid-template-columns:repeat(7,1fr)}
.dweek .d7 button{border:0;border-left:1px solid var(--line);background:var(--cell);padding:7px 0;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted)}
.dweek .d7 button:first-child{border-left:0}
.dweek .d7 button b{font-family:var(--mono);font-size:.95rem;color:var(--ink)}
.dweek .d7 button.we{background:var(--jour-we);color:var(--ink);--muted:var(--ink-3)}
.dweek .d7 button.off{background:var(--jour-off)}
.dweek .d7 button.on{background:var(--pc);color:var(--pt)}
.dweek .d7 button.on b{color:var(--pt)}
.dweek .d7 button[disabled]{opacity:.35}


/* Panneau */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-top:2px solid var(--bd);padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.shead{background:var(--pc,var(--band));color:var(--pt,var(--band-ink));padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
.shead .emo{font-size:2rem;background:none;border:0;padding:0;color:inherit}
.shead h2{font-size:1.3rem;font-weight:700;flex:1;min-width:0;line-height:1.15}
.shead h2 small{display:block;font-size:.78rem;font-weight:400;font-family:var(--mono);opacity:.85;margin-top:3px}
.xbtn{border:1.5px solid currentColor;background:transparent;color:inherit;padding:6px 10px;font-weight:700;font-size:.85rem;flex:none}
.sbody{padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.state{display:inline-block;padding:3px 8px;font-weight:700;font-size:.85rem;border:1px solid var(--bd);margin-right:4px}
.folder{display:flex;align-items:stretch;border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.folder code{font-family:var(--mono);font-size:.82rem;flex:1;min-width:0;overflow-wrap:anywhere;padding:10px 12px}
.folder button{border:0;border-left:1px solid var(--bd);background:var(--cell);padding:0 12px;font-weight:700;font-size:.82rem;color:var(--ink);--muted:var(--ink-3)}
.list{list-style:none;padding:0;margin:0;border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0 9px 12px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{flex:1;min-width:0}
.list .d{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.list .x{background:none;border:0;color:var(--muted);padding:4px 12px;font-size:1.05rem}
.list input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--ink);flex:none}
.list .done label{color:var(--muted);text-decoration:line-through}
.inline{display:flex}
.inline .input{border-right:0}
.inline .btn{width:auto;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.stat{padding:10px 12px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.stat:nth-child(-n+2){border-top:0}
.stat:nth-child(odd){border-left:0}
.stat b{display:block;font-family:var(--mono);font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted)}
.alert{border:2px solid var(--bd);background:var(--hl);padding:12px;font-size:.92rem;display:flex;flex-direction:column;gap:10px;color:var(--ink);--muted:var(--ink-3)}
.bilan{border:1px solid var(--bd);background:var(--cell);padding:12px;font-size:.94rem;color:var(--ink);--muted:var(--ink-3)}
.bilan p{margin:6px 0 0}
.wkpick{list-style:none;padding:0;margin:0;border:1px solid var(--bd);background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.wkpick li{border-top:1px solid var(--line)}
.wkpick li:first-child{border-top:0}
.wkpick button{width:100%;border:0;background:transparent;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;text-align:left}
.wkpick b{font-family:var(--mono);font-size:.85rem}
.wkpick .ems{display:flex;gap:3px;min-width:0;overflow:hidden}
.wkpick .ems i{font-style:normal;background:var(--pc);width:24px;height:24px;display:grid;place-items:center;font-size:.85rem;flex:none}
.wkpick .cap{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap}
.wkpick .in .cap{color:var(--ink);font-weight:600}
.picklist{display:flex;flex-direction:column;gap:6px}
.pickbtn{border:1px solid var(--bd);background:var(--cell);padding:0;display:flex;align-items:stretch;text-align:left;width:100%;color:var(--ink);--muted:var(--ink-3)}
.pickbtn .sw{width:46px;background:var(--pc);display:grid;place-items:center;font-size:1.3rem;flex:none}
.pickbtn .tx{padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pickbtn .tx b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quad{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.quad i{width:12px;height:12px;display:inline-block;border:1px solid var(--bd)}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cbase{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:340px}
.cbase button{aspect-ratio:1;padding:0;border:2px solid transparent!important;border-radius:10px!important;background:var(--sw)!important}
.cbase button[aria-pressed="true"]{border-color:var(--ink)!important;box-shadow:inset 0 0 0 3px var(--cell)}
.freecol{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;background:var(--cell);color:var(--ink);--muted:var(--ink-3)}
.freecol span{border-radius:999px}
.cgrid{display:grid;grid-template-columns:repeat(11,22px);gap:2px;justify-content:start}
.cgrid button{width:22px;height:22px;padding:0;border:0!important;border-radius:0!important;background:var(--sw)!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.cgrid button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
@media (pointer:fine){.cgrid{grid-template-columns:repeat(11,18px)}.cgrid button{width:18px;height:18px}.cgrid button:hover{outline:1px solid var(--ink)}}
.freecol{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-weight:700;font-size:.9rem;cursor:pointer;align-self:flex-start}
.freecol input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.freecol span{width:34px;height:24px;background:var(--sw);border:2px solid var(--line)}

function wkKey(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3); const y=t.getUTCFullYear(); const f=new Date(Date.UTC(y,0,4)); const w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7); return y+'-W'+pad(w);}
function wkMon(k){const [y,w]=k.split('-W').map(Number); const m=monday(new Date(y,0,4)); m.setDate(m.getDate()+(w-1)*7); return m;}

function hexHsl(hex){ const h=hex.replace('#',''); let r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2; let H=0,S=0; if(mx!==mn){ const d=mx-mn; S=l>.5?d/(2-mx-mn):d/(mx+mn); H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; H*=60; } return [H,S*100,l*100]; }
function hslHex(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase(); }
function shade(base,dur,perm,key){ const [h,s,l]=hexHsl(base); let n=0; for(const c of String(key||'')) n=(n*31+c.charCodeAt(0))%997; const H=(h+((n%9)-4)*1.6+360)%360;

/* Vue planning : une colonne par jour, une ligne par projet */
/* Planning (25.11) : une semaine à la fois, en demi-journées (matin, après-midi), avec les rendez-vous des calendriers Proton.
   Un projet placé sur un jour prend la journée ; sur une demi-journée, il a un créneau dans h:<semaine> (biblio_rows), le même que la routine du lundi
   (matin 08:00, après-midi 13:30, 4 h). Les rendez-vous sont lus par la fonction « calendriers » (comme l'accueil) ; on peut placer un projet par-dessus. */
const DEMI=750, CR_M={h:'08:00',min:240}, CR_A={h:'13:30',min:240};
const enMinE=x=>{ const m=/^(\d\d):(\d\d)/.exec(x||''); return m?+m[1]*60+ +m[2]:null; };
let HS={}, HS_LE={};
async function hCharger(k){ if(!sb||!UID||!navigator.onLine) return; if(HS_LE[k]&&Date.now()-HS_LE[k]<60000) return; HS_LE[k]=Date.now();
  try{ const {data,error}=await sb.from('biblio_rows').select('data,deleted').eq('key','h:'+k); if(error) throw error; const r=(data||[])[0], v=r&&!r.deleted&&r.data?r.data:{};
    const old=JSON.stringify(HS[k]||{}); HS[k]=v; if(old!==JSON.stringify(v)&&ui.view==='planning'&&$scrim.hidden) render(); }catch(e){} }
const hFile={}; function hEdit(k,fn){ hFile[k]=(hFile[k]||Promise.resolve()).then(()=>hEdit1(k,fn)).catch(()=>{}); return hFile[k]; }
async function hEdit1(k,fn){ let cur=HS[k]||{};
  try{ if(navigator.onLine){ const {data}=await sb.from('biblio_rows').select('data,deleted').eq('key','h:'+k); const r=(data||[])[0]; cur=r&&!r.deleted&&r.data?r.data:{}; } }catch(e){}
  const nv=JSON.parse(JSON.stringify(cur||{})); nv.p=nv.p||{}; fn(nv.p); HS[k]=nv;
  try{ const {error}=await sb.from('biblio_rows').upsert({user_id:UID,key:'h:'+k,data:nv,deleted:false},{onConflict:'user_id,key'}); if(error) throw error; }catch(e){ toast('Demi-journée pas encore enregistrée (réseau)'); } }
function creneauxP(p,d){ const k=wkKey(parse(d)), c=((HS[k]||{}).p||{})[p.id+'|'+d]; return Array.isArray(c)?c.filter(x=>x&&x.h):typeof c==='string'?[{h:c,min:240}]:null; }
function demisP(p,d){ const L=creneauxP(p,d); if(!L||!L.length) return [1,1]; let m=0,a=0; L.forEach(x=>{ const s0=enMinE(x.h), e=s0+(x.min||240); if(s0<DEMI) m=1; if(e>DEMI) a=1; }); return [m,a]; }
/* calendriers Proton */
const COUL_CAL=['#8EC9EE','#E8826F','#9BD08F','#F2C230','#C3B6DF','#E7A6C8','#D6B15E'];
let EVS=null, CALS=[], EV_LE={}, EVW=[];
const evK=()=>'etabli-proton-'+UID;
function evLocal(){ if(EVS) return; EVS={}; try{ const o=JSON.parse(localStorage.getItem(evK())||'null'); if(o){ EVS=o.w||{}; CALS=o.cals||[]; } }catch(e){} }
const coulCal=id=>{ const i=CALS.findIndex(c=>c.id===id), c=i>=0?CALS[i]:null; return (c&&c.couleur)||COUL_CAL[Math.max(0,i)%COUL_CAL.length]; };
async function evChargerPlage(ks,force){ evLocal(); if(!sb||!UID||!navigator.onLine) return; const cle=ks.join(','); if(!force&&EV_LE[cle]&&Date.now()-EV_LE[cle]<10*60000) return; EV_LE[cle]=Date.now();
  try{ const {data,error}=await sb.from('locus_calendriers').select('id,nom,couleur').order('cree'); if(error) throw error; CALS=data||[];
    let ev=[]; if(CALS.length){ const ses=(await sb.auth.getSession()).data.session; if(!ses) return; const de=iso(wkMon(ks[0])), f=new Date(wkMon(ks[ks.length-1])); f.setDate(f.getDate()+6);
      const r=await fetch(SB_URL+'/functions/v1/calendriers?de='+de+'&a='+iso(f),{headers:{Authorization:'Bearer '+ses.access_token,apikey:SB_KEY}}); const j=await r.json().catch(()=>({}));
      if(!r.ok||j.erreur) throw new Error(j.erreur||'calendriers'); ev=j.ev||[]; }
    let ch=false; ks.forEach(k=>{ const [a,b]=wkDates(k), L=ev.filter(e=>{ const d0=String(e.debut).slice(0,10), d1=String(e.fin||e.debut).slice(0,10); return d0<=b&&(e.journee?d1>a:d1>=a); }); if(JSON.stringify(EVS[k]||null)!==JSON.stringify(L)){ EVS[k]=L; ch=true; } EV_LE[k]=Date.now(); });
    const kk=Object.keys(EVS).sort().slice(-16), w={}; kk.forEach(x=>w[x]=EVS[x]); try{ localStorage.setItem(evK(),JSON.stringify({w,cals:CALS})); }catch(e){}

function evDemis(e,d){ if(e.journee) return (e.debut<=d&&d<e.fin)?[1,1]:[0,0];
  const s0=String(e.debut).slice(0,10), f=String(e.fin||e.debut).slice(0,10); if(d<s0||d>f) return [0,0];
  const sm=s0===d?enMinE(String(e.debut).slice(11,16))||0:0, fm=f===d?enMinE(String(e.fin).slice(11,16)):1440; if(f===d&&s0!==d&&fm===0) return [0,0];
  return [sm<DEMI?1:0,(fm==null?1440:fm)>DEMI||(sm>=DEMI)?1:0]; }
function evQuand(e){ const dl=x=>dayLbl(x)+' '+MOIS[parse(x).getMonth()];
  if(e.journee){ const f=new Date(parse(e.fin)); f.setDate(f.getDate()-1); const fi=iso(f); return fi>e.debut?'du '+dl(e.debut)+' au '+dl(fi)+' · journées entières':dl(e.debut)+' · journée entière'; }
  const s0=String(e.debut).slice(0,10), f=String(e.fin||'').slice(0,10), hs=String(e.debut).slice(11,16), hf=String(e.fin||'').slice(11,16);
  return s0===f||!f?dl(s0)+' · '+hs+(hf?' – '+hf:''):dl(s0)+' '+hs+' → '+dl(f)+' '+hf; }

/* Reprise : les tags deviennent des projets parents (validée par Nicolas avant d'enregistrer) */

function repriseInit(){
  const used=S.tags.filter(t=>S.projects.some(p=>(p.tags||[]).includes(t.id)));

  used.forEach(t=>{ const same=S.projects.find(p=>!p.closed&&!isMini(p)&&!p.parent&&plain(p.name)===plain(t.name));
    R.tags[t.id]={mode:/^perso$/i.test(t.name.trim())?'none':same?same.id:'new', nature:/talus|gdt|ouate|isol|expo|fertik|travaux|pro\b|mandat/i.test(t.name)?'pro':'perso'}; });
  S.projects.filter(p=>!p.closed&&!isMini(p)).forEach(p=>{ const t=(p.tags||[]).find(id=>R.tags[id]&&R.tags[id].mode!=='none');

function majTaches(p){ const old=document.querySelector('.field[data-taches="'+p.id+'"]'); if(!old){ refresh(p.id); return; }
  const tmp=document.createElement('div'); tmp.innerHTML=tasksBlock(p,!!p.closed,old.dataset.mot||'tâche'); const nf=tmp.firstElementChild; if(!nf){ refresh(p.id); return; }

  let oUl=old.querySelector(':scope > ul.tasks'); const nUl=nf.querySelector(':scope > ul.tasks');

function sizePick(cur,act){return `<div class="sizes">${Object.entries(SIZES).map(([k,s])=>`<button data-act="${act}" data-s="${k}" aria-pressed="${cur===k}"><b>${s.l}</b><span>${s.sub}</span></button>`).join('')}</div>`;}
function tagPick(sel,act){return `<div class="pchips">${S.tags.map(t=>`<button class="tchip${t.color?' col':''}"${tcs(t)} data-act="${act}" data-t="${t.id}" aria-pressed="${sel.includes(t.id)}">${esc(t.name)}</button>`).join('')}</div>

function dueHint(due,dur){ if(!due) return 'Pas d\'échéance, pas d\'urgence.'; dur=dur||0; const n=days(due); if(n<0) return 'Échéance dépassée : urgent.'; const L=urgLimit(dur); if(L==null) return 'À '+n+' jour'+(n>1?'s':'')+(n<=7?' : urgent (dernière semaine).':' : urgent dans la dernière semaine.'); const w=workdaysUntil(due); return 'À '+w+' jour'+(w>1?'s':'')+' ouvrable'+(w>1?'s':'')+(w<=L?' : urgent':' : pas encore urgent')+' (urgent dès '+L+' j ouvrables, 3 × la durée).'; }

/* Argent et heures d'un projet, lus dans la Banque (opérations reliées au projet) et la Mine (son mandat) — étape 2 */
let apercuMem=null;
const apercuK=()=>'etabli-apercu-'+UID;
function apercuGet(id){ if(!apercuMem){ try{ apercuMem=JSON.parse(localStorage.getItem(apercuK())||'{}')||{}; }catch(e){ apercuMem={}; } } return apercuMem[id]||null; }
function apercuSet(id,a){ apercuGet(id); apercuMem[id]=a; try{ localStorage.setItem(apercuK(),JSON.stringify(apercuMem)); }catch(e){} }
const chf=v=>Number(v||0).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const estProCat=c=>c==='pro'||String(c||'').startsWith('pro.');
function apercuHtml(a){ if(!a) return ''; const L=[];
  if(a.mandat) L.push(`<p style="margin:0">⛏️ <b>${esc(a.mandat)}</b> · ${nf((a.min||0)/60)} h · facturé ${chf(a.fact)} · encaissé ${chf(a.enc)}</p>`);
  if(a.n) L.push(`<p style="margin:0">🏦 ${a.n} opération${a.n>1?'s':''} · dépenses <b>${chf(-a.dep)}</b>${a.rec?` · recettes <b>${chf(a.rec)}</b>`:''} · net ${chf(a.dep+a.rec)} CHF</p>`);
  return L.length?`<div class="field"><span class="lbl">Argent et heures <small style="font-weight:400;text-transform:none;letter-spacing:0">· lus dans ${a.mandat?'la Mine et ':''}la Banque</small></span>${L.join('')}</div>`:''; }
async function chargerApercu(p){
  const show=a=>{ const b=document.getElementById('apercu'); if(b&&sheetId===p.id) b.innerHTML=apercuHtml(a); };
  show(apercuGet(p.id));
  if(!sb||!UID||!navigator.onLine) return;
  try{
    const A={n:0,dep:0,rec:0}, vus=new Set();
    const ajoute=(t,proSeul)=>{ if(!t||vus.has(t.id)) return; vus.add(t.id); const L=t.parts&&t.parts.length?t.parts:[{montant:t.montant,cat:t.cat}]; let v=0; L.forEach(l=>{ if(!proSeul||estProCat(l.cat)) v+=+l.montant||0; }); if(!v) return; A.n++; if(v<0) A.dep+=v; else A.rec+=v; };
    const {data:tx,error}=await sb.from('cash_rows').select('key,data').eq('kind','tx').eq('deleted',false).eq('data->>projet',p.id); if(error) throw error;
    (tx||[]).forEach(r=>ajoute(r.data,false));
    if(natureOf(p)==='pro'){
      const {data:ms}=await sb.from('mine_rows').select('key,data').like('key','m:%').eq('deleted',false).eq('data->>projet',p.id);
      const m=(ms||[]).map(r=>r.data).find(Boolean);
      if(m){ A.mandat=m.nom; A.fact=0; A.enc=0;
        const {data:hs}=await sb.from('mine_rows').select('data').like('key','h:%').eq('deleted',false).eq('data->>mandat',m.id);
        A.min=(hs||[]).reduce((x,r)=>x+((r.data&&+r.data.min)||0),0);
        const {data:ds}=await sb.from('mine_rows').select('data').like('key','d:%').eq('deleted',false).eq('data->>mandat',m.id);
        (ds||[]).forEach(r=>{ const d=r.data; if(!d||d.type!=='facture') return; const tot=Math.round((d.lignes||[]).reduce((x,l)=>x+(+l.qte||0)*(+l.prix||0),0)*20)/20; if(d.etat==='envoyee'||d.etat==='payee') A.fact+=tot; if(d.etat==='payee') A.enc+=tot; });
        const {data:ls}=await sb.from('mine_rows').select('key').like('key','l:%').eq('deleted',false).eq('data->>mandat',m.id);
        const keys=(ls||[]).map(r=>'t:'+r.key.slice(2));
        for(let i=0;i<keys.length;i+=100){ const {data:t2}=await sb.from('cash_rows').select('key,data').eq('kind','tx').eq('deleted',false).in('key',keys.slice(i,i+100)); (t2||[]).forEach(r=>ajoute(r.data,true)); } } }
    A.le=todayS; apercuSet(p.id,A); show(A);
  }catch(e){ /* hors ligne ou table absente : on garde le dernier aperçu */ }
}

async function syncFichiers(){
  if(!FB) return; fsEtat=await Dossier.etat(); if(fsEtat!=='granted') return;
  let ch=false;
  for(const p of S.projects){ if(!p.dossier) continue;
    if(p.closed&&!p.dossier.startsWith('Archives/')){ const vers=Dossier.cheminArchive(p.dossier,String(p.closed).slice(0,4));
      try{ if(await Dossier.existe(p.dossier)) await Dossier.deplacerDossier(p.dossier,vers);
        Dossier.dans(FB,p.dossier).forEach(x=>{ const g=Object.assign({},x,{chemin:vers+x.chemin.slice(p.dossier.length),id:Dossier.idDe(vers+x.chemin.slice(p.dossier.length),x.nom)}); FB.oublier(x.id); FB.ecrire(g); });
        p.dossier=vers; ch=true; }catch(e){} }
    else if(!p.closed){ try{ await Dossier.dossier(p.dossier,true); }catch(e){} } }
  if(ch){ quiet=true; save(); quiet=false; }
  const B=await Dossier.synchro(sb,UID,FB,[...S.projects.filter(p=>p.dossier).map(p=>p.dossier),Dossier.A_TRIER]);
  if(B&&(B.ranges||B.deplaces)) toast(''+(B.ranges?B.ranges+' fichier'+(B.ranges>1?'s':'')+' arrivé'+(B.ranges>1?'s':''):'')+(B.ranges&&B.deplaces?' · ':'')+(B.deplaces?B.deplaces+' rangé'+(B.deplaces>1?'s':''):''));
  if(B&&B.erreurs.length) toast('⚠ '+B.erreurs[0]);
  const nj=await copierJustificatifs(); if(nj) toast(''+nj+' justificatif'+(nj>1?'s':'')+' copié'+(nj>1?'s':'')+' dans les dossiers'); }
/* Justificatifs de la Banque (photos de tickets, PDF) : une copie dans <dossier du projet>/Justificatifs, pour les opérations
   reliées au projet dans la Banque, ou rattachées à son mandat dans la Mine. Ils restent aussi dans Supabase. */
async function copierJustificatifs(){
  if(fsEtat!=='granted'||!sb||!UID||!navigator.onLine) return 0;
  const K='etabli-justifs-'+UID; let fait={}; try{ fait=JSON.parse(localStorage.getItem(K)||'{}')||{}; }catch(e){}
  const PS=S.projects.filter(p=>p.dossier&&!p.closed&&!p.dossier.startsWith('Archives/')); if(!PS.length) return 0;
  const parId={}; PS.forEach(p=>{ parId[p.id]=p; }); let n=0;
  try{
    const ops=[]; const {data:tx,error}=await sb.from('cash_rows').select('key,data').eq('kind','tx').eq('deleted',false).in('data->>projet',PS.map(p=>p.id)); if(error) throw error;
    (tx||[]).forEach(r=>{ if(r.data) ops.push({t:r.data,p:parId[r.data.projet]}); });
    const pros=PS.filter(p=>natureOf(p)==='pro');
    if(pros.length){ const {data:ms}=await sb.from('mine_rows').select('data').like('key','m:%').eq('deleted',false).in('data->>projet',pros.map(p=>p.id));
      const mp={}; (ms||[]).forEach(r=>{ if(r.data) mp[r.data.id]=parId[r.data.projet]; });
      if(Object.keys(mp).length){ const {data:ls}=await sb.from('mine_rows').select('key,data').like('key','l:%').eq('deleted',false).in('data->>mandat',Object.keys(mp));
        const keys=(ls||[]).filter(r=>r.data&&mp[r.data.mandat]).map(r=>({k:'t:'+r.key.slice(2),p:mp[r.data.mandat]}));
        for(let i=0;i<keys.length;i+=100){ const part=keys.slice(i,i+100); const {data:t2}=await sb.from('cash_rows').select('key,data').eq('kind','tx').eq('deleted',false).in('key',part.map(x=>x.k));
          (t2||[]).forEach(r=>{ const x=part.find(y=>y.k===r.key); if(r.data&&x&&!ops.some(o=>o.t.id===r.data.id)) ops.push({t:r.data,p:x.p}); }); } } }
    const veut=[]; ops.forEach(o=>(o.t.docs||[]).forEach(id=>{ if(!fait[id]) veut.push({id,t:o.t,p:o.p}); })); if(!veut.length) return 0;
    for(let i=0;i<veut.length;i+=100){ const part=veut.slice(i,i+100); const {data:ds}=await sb.from('cash_rows').select('key,data').eq('kind','document').eq('deleted',false).in('key',part.map(x=>'f:'+x.id));
      for(const r of ds||[]){ const doc=r.data, x=doc&&part.find(y=>y.id===doc.id); if(!x||!doc.path) continue;
        try{ const {data:blob,error:e2}=await sb.storage.from('cash-documents').download(doc.path); if(e2) throw e2;
          const ext=(String(doc.nom||'').match(/\.[a-z0-9]{2,5}$/i)||[''])[0]||(doc.type==='application/pdf'?'.pdf':doc.type&&doc.type.startsWith('image/')?'.'+doc.type.split('/')[1]:'');
          const base=String(doc.nom||'justificatif').replace(/\.[a-z0-9]{2,5}$/i,''), nom=(x.t.date||'')+' '+(x.t.tiers?x.t.tiers+' ':'')+base+ext;
          const ch=x.p.dossier+'/Justificatifs', w=await Dossier.ecrire(ch,nom,blob);
          FB.ecrire({id:Dossier.idDe(ch,w.nom),chemin:ch,nom:w.nom,taille:w.taille,modif:w.modif,type:w.type,projet:x.p.id,etat:'ici',le:new Date().toISOString()});
          fait[doc.id]=todayS; n++; }catch(e){} } }
  }catch(e){ return n; }
  try{ localStorage.setItem(K,JSON.stringify(fait)); }catch(e){}
  return n; }

function versVide(t){ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7), K='etabli-vide-'+UID; let L=[]; try{ L=JSON.parse(localStorage.getItem(K)||'[]'); }catch(e){}

    let M=[]; try{ M=JSON.parse(localStorage.getItem(K)||'[]'); }catch(e){} localStorage.setItem(K,JSON.stringify(M.filter(x=>!L.some(y=>y.key===x.key)))); }catch(e){} }

/* Fiche projet */
let lastDetail=null;
function placedOf(p){ return [...p.weeks.map(w=>({k:w,l:'S'+wkNum(w)+' · lun–ven '+wkRange(w).split(' – ')[0],c:'S'+wkNum(w),w,o:iso(wkMon(w))})),...p.days.map(x=>({k:x,l:dayLbl(x)+' '+MOIS[parse(x).getMonth()],c:dayLbl(x)+' '+MOIS[parse(x).getMonth()],w:wkKey(parse(x)),o:x}))].sort((u,v)=>u.o.localeCompare(v.o)); }

/* Notes d'un projet (15.11) : elles vivent dans la Bibliothèque (biblio_rows, racine p:<id>) mais ne s'affichent qu'ici :

/* Notes d'un projet, modifiables dans la fiche (15.11, demande de Nicolas). Elles vivent dans la Bibliothèque (biblio_rows, racine p:<id>) :
   la fiche contient la Bibliothèque en mode « seul » (bibliotheque/?seul=p:<id>), qui envoie sa hauteur (message biblioH).
   La fiche est redessinée souvent (openSheet) : on met le cadre de côté avant et on le replace après, avec moveBefore quand le navigateur
   le permet (le cadre ne se recharge pas, le curseur reste) ; sinon il se recharge, sans rien perdre. « Plein écran » ouvre la même chose en grand. */
let histNotes=false, nbFrame=null, nbHolder=null; const nbH={};
function notesGarder(){ if(!nbFrame||!$sheet.contains(nbFrame)) return;
  if(!nbHolder){ nbHolder=document.createElement('div'); nbHolder.hidden=true; document.body.appendChild(nbHolder); }
  if(nbHolder.moveBefore) try{ nbHolder.moveBefore(nbFrame,null); return; }catch(e){}
  nbFrame=null; }
function notesPlacer(){ const slot=$sheet.querySelector('.nbslot'); if(!slot) return; const id=slot.dataset.nb;
  if(nbFrame&&nbFrame.dataset.id===id&&nbFrame.isConnected){ if(slot.moveBefore) try{ slot.moveBefore(nbFrame,null); return; }catch(e){} }
  if(nbFrame) nbFrame.remove();
  nbFrame=document.createElement('iframe'); nbFrame.className='nbframe'; nbFrame.title='Notes du projet'; nbFrame.dataset.id=id;
  nbFrame.src='../bibliotheque/?seul=p:'+encodeURIComponent(id)+'&dans=fiche'; nbFrame.style.opacity='0'; nbFrame.style.height=(nbH[id]||60)+'px'; const fr=nbFrame, voir=()=>{ fr.style.opacity=''; }; fr.addEventListener('load',()=>{ nbStyle(fr); requestAnimationFrame(()=>requestAnimationFrame(voir)); }); setTimeout(voir,2500); slot.appendChild(nbFrame); }
addEventListener('message',e=>{ const d=e.data; if(!d||typeof d.biblioH!=='number'||e.origin!==location.origin) return;
  [nbFrame,document.querySelector('#notesbib iframe')].forEach(f=>{ if(f&&f.classList.contains('nbframe')&&f.contentWindow===e.source) { const h=Math.max(60,Math.ceil(d.biblioH)); f.style.height=h+'px'; if(f.dataset.id) nbH[f.dataset.id]=h; } }); });
function notesBib(id){ const p=P(id); let o=document.getElementById('notesbib');
  if(!o){ o=document.createElement('div'); o.id='notesbib'; o.dataset.lieu='bibliotheque'; document.body.appendChild(o); }
  o.innerHTML=`<div class="nb-bar"><button class="xbtn" data-act="notesBibOk">‹ Fiche</button><b>${esc(p?(p.emoji?p.emoji+' ':'')+p.name:'Projet')}</b><span>Notes</span></div><iframe src="../bibliotheque/?seul=p:${id}" title="Notes du projet"></iframe>`; const fr=o.querySelector('iframe'); if(fr) fr.addEventListener('load',()=>nbStyle(fr));

/* L'éditeur vient de la Bibliothèque (même adresse) : l'Établi lui donne ses couleurs (graphite, jaune du mètre) et une barre d'outils qui tient sur une ligne */
const NB_CSS=()=>{ const v=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return `.outils{background:${v('--surface')}!important;border:1px solid ${v('--line')};border-radius:12px;gap:3px!important;padding:5px!important;flex-wrap:nowrap!important;justify-content:stretch!important}

function nbStyle(fr){ try{ const d=fr.contentDocument; if(!d||d.getElementById('etabli-nb')) return; const st=d.createElement('style'); st.id='etabli-nb'; st.textContent=NB_CSS(); d.head.appendChild(st); }catch(e){} }
/* clavier fermé (flèche ↓ d'Android) : on quitte l'écriture des notes */
(()=>{ const vv=window.visualViewport; if(!vv) return; let maxH=vv.height;
  let kb=false; vv.addEventListener('resize',()=>{ if(vv.height>maxH) maxH=vv.height; if(vv.height<maxH-120){ kb=true; return; } if(!kb) return; kb=false;

   ${fsSupported()?`<div class="field"><span class="lbl">Sur cet appareil</span><button class="btn ghost" data-act="fsToggle">${fsAuto()?'✓ Plein écran automatique : activé':'Plein écran automatique : désactivé'}</button><p class="note" style="margin:0">Cache la barre du navigateur dès que tu touches l'écran. Utile si le navigateur n'ouvre pas l'app en plein écran tout seul.</p></div>`:''}
   ${confirmOut?`<div class="danger"><div>${dirty.size?'<b>'+dirty.size+' changement'+(dirty.size>1?'s':'')+' pas encore envoyé'+(dirty.size>1?'s':'')+'</b> seraient perdus. ':''}Se déconnecter de cet appareil ?</div><div class="actions"><button class="btn ghost" data-act="account">Annuler</button><button class="btn warn" data-act="logoutOk">Se déconnecter</button></div></div>`:`<button class="linkbtn" style="align-self:center;color:var(--neg)" data-act="logout">Se déconnecter de cet appareil</button>`}
  </div>`,'acct');
}
document.addEventListener('click',async e=>{
  const el=e.target.closest&&e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act;
  if(a==='account') accountSheet();
  else if(a==='logout') accountSheet(true);
  else if(a==='miniToggle'&&!$scrim.hidden) accountSheet();
  else if(a==='fsToggle'){ const on=!fsAuto(); try{ localStorage.setItem('etabli-fs',on?'1':'0'); }catch(err){} if(on) goFull(); else if(document.fullscreenElement){ try{ document.exitFullscreen(); }catch(err){} } accountSheet(); }
  else if(a==='syncNow'){ el.disabled=true; el.textContent='Synchro…'; await push(); await pull(true); await push(); accountSheet(); toast(syncErr?'Problème de synchro':'Synchronisé'); }
  else if(a==='exportData'){ const blob=new Blob([JSON.stringify({app:'etabli',version:1,exported:new Date().toISOString(),data:S},null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='etabli-'+todayS+'.json'; document.body.appendChild(l); l.click(); setTimeout(()=>{URL.revokeObjectURL(u); l.remove();},1000); }
  else if(a==='logoutOk'){ try{ localStorage.removeItem(CK()); }catch(err){} UID=null; try{ await sb.auth.signOut(); }catch(err){} location.reload(); }
});

applyMode();
startApp();
})();
