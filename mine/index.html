<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Mine</title>
<meta name="theme-color" content="#C68A2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(../commun/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(../commun/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url(../commun/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-style:normal;font-display:swap;src:url(../commun/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Stencil Display";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-stencil-display-latin-800-normal.woff2) format("woff2")}
/* La Mine : une galerie de mine claire — pierre grise, caisses estampillées au pochoir, filons de couleur (un minerai par activité), or */
:root{
  color-scheme:light;
  --pierre:#ECE7DF; --pierre2:#E2DBD0; --carte:#FFFFFF; --roche:#2B2420; --gris:#6E655C; --trait:#D8D0C4; --trait2:#B7AB9B;
  --or:#C68A2E; --orpale:#F6E7CC; --orfonce:#7A5410; --vert:#2E7D5B; --vertpale:#DCEFE4; --rouge:#B23A48; --rougepale:#F8E0E3;
  --ombre:3px 3px 0 rgba(43,36,32,.9); --ombre2:2px 2px 0 rgba(43,36,32,.85);
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --pochoir:"Big Shoulders Stencil Display","Atkinson Hyperlegible",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%}
body{margin:0;background:var(--pierre) radial-gradient(rgba(70,52,34,.075) 1px,transparent 1.3px) 0 0/9px 9px;color:var(--roche);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.35}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.neg{color:var(--rouge)}
.pos{color:var(--vert)}

main{max-width:760px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) calc(116px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.titre{margin:6px 0 -6px;font:800 2.05rem/1 var(--pochoir);text-transform:uppercase;letter-spacing:.03em}
.cap{font-size:.74rem;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.08em}
.meta{font-size:.84rem;color:var(--gris)}
.aide{margin:0;font-size:.86rem;color:var(--gris)}
.lien-p{border:2px solid var(--roche);background:var(--carte);box-shadow:var(--ombre);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.lien-p p{margin:0}
.rel{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1.5px solid var(--trait2);background:var(--carte);padding:8px 10px;border-left:6px solid var(--c,var(--trait2))}
.rel .nm{flex:1 1 170px;font-weight:700;min-width:0}
.rel .nm small{display:block;font-weight:400;color:var(--gris);font-size:.8rem}
.rel select{max-width:100%;height:40px;border:1.5px solid var(--trait2);background:var(--carte);padding:0 6px}
.projet-l{font-size:.85rem;color:var(--gris)}
.alerte{background:var(--rougepale);color:#6E1A25;border:1.5px solid var(--rouge);padding:12px 14px;font-size:.92rem}
.alerte b{display:block}
.info{background:var(--orpale);border:1.5px solid var(--or);padding:10px 12px;font-size:.92rem}
.vide{text-align:center;padding:26px 16px 10px;color:var(--gris)}
.vide .gros{display:block;font:800 1.9rem/1.05 var(--pochoir);text-transform:uppercase;color:var(--roche);margin-bottom:8px}
.vide .btn{margin-top:16px}

/* boutons */
.btn{min-height:48px;border:2px solid var(--roche);background:var(--roche);color:#fff;font-weight:700;font-size:1rem;padding:8px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.or{background:var(--or);color:var(--roche);box-shadow:var(--ombre2)}
.btn.sq{width:48px;padding:0;flex:none;font-size:1.4rem}
.btn2{min-height:44px;padding:8px 14px;border:1.5px solid var(--roche);background:var(--carte);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
a.btn,a.btn2{text-decoration:none;color:inherit}
.btn2:active,.btn:active{transform:translate(1px,1px)}
.btn-sup{min-height:44px;border:1.5px solid transparent;background:transparent;color:var(--rouge);font-weight:700;padding:8px 14px}
.btn-sup.conf{background:var(--rougepale);border-color:var(--rouge)}
.lien{border:0;background:none;padding:0;color:var(--orfonce);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.lien-b{border:0;background:none;padding:0;font-weight:700;color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.retour{align-self:flex-start;border:0;background:transparent;padding:6px 0;font-weight:700;color:var(--gris)}

/* chips et segments */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;border:1.5px solid var(--trait2);background:var(--carte);padding:6px 11px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;text-align:left}
.chip.on{background:var(--roche);border-color:var(--roche);color:#fff}
.chip.coul{--c:#888;border-left:6px solid var(--c)}
.chip.sw{width:44px;height:38px;padding:0;background:var(--c);border:2px solid transparent}
.chip.sw.on{outline:3px solid var(--roche);outline-offset:2px}
.seg{display:flex;border:2px solid var(--roche);background:var(--carte)}
.seg button{flex:1 1 0;min-height:42px;border:0;background:transparent;font-weight:700;font-size:.92rem;padding:4px 6px}
.seg button+button{border-left:2px solid var(--roche)}
.seg button[aria-pressed="true"]{background:var(--roche);color:#fff}
.filtres{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px}
.filtres::-webkit-scrollbar{display:none}
.filtres button{--c:var(--roche);flex:none;height:40px;padding:0 8px 0 12px;border:1.5px solid var(--trait2);border-left:6px solid var(--c);background:var(--carte);font-weight:700;font-size:.93rem;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.filtres button .n{min-width:22px;height:22px;padding:0 6px;background:var(--pierre2);display:inline-grid;place-items:center;font:600 .78rem/1 var(--mono)}
.filtres button[aria-pressed="true"]{background:var(--roche);color:#fff;border-color:var(--roche);border-left-color:var(--c)}
.filtres button[aria-pressed="true"] .n{background:rgba(255,255,255,.2)}

/* à faire */
.afaire{background:var(--carte);border:2px solid var(--roche);box-shadow:var(--ombre);padding:10px 12px 4px;display:flex;flex-direction:column}
.afaire .cap{margin-bottom:2px}
.af{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--trait)}
.af:first-of-type{border-top:0}
.af .ic{flex:none;width:26px;text-align:center;font-size:1.1rem}
.af .tx{flex:1;min-width:0;font-size:.93rem}
.af button{flex:none}

/* filons (activités) et cartes de mandats */
.filon{--c:#55606B;display:flex;flex-direction:column;gap:10px}
.fh{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff;background:var(--c) repeating-linear-gradient(118deg,rgba(255,255,255,.09) 0 7px,transparent 7px 19px,rgba(0,0,0,.06) 19px 23px,transparent 23px 34px)}
.fh .em{font-size:1.35rem;line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.fh h2{margin:0;font:800 1.55rem/1 var(--pochoir);text-transform:uppercase;letter-spacing:.04em;flex:none}
.fh .fs{margin-left:auto;font-size:.8rem;opacity:.92;text-align:right}
.cartes{display:flex;flex-direction:column;gap:10px}
.carte{--c:#55606B;display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--carte);border:1.5px solid var(--roche);border-left:7px solid var(--c);box-shadow:var(--ombre2);padding:10px 12px}
.carte.fini{background:#F7F4EF;box-shadow:none;border-color:var(--trait2);border-left-color:var(--c)}
.c1{display:flex;align-items:baseline;gap:8px}
.cn{font-size:1.06rem;flex:1;min-width:0;overflow-wrap:anywhere}
.c2{font-size:.86rem;color:var(--gris)}
.c2 i{font-style:normal;opacity:.8}
.c3{display:flex;flex-wrap:wrap;gap:4px 12px;font:600 .8rem/1.3 var(--mono);color:var(--roche)}
.c4{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.flag{font-size:.78rem;font-weight:700;padding:2px 7px;background:var(--pierre2)}
.flag.or{background:var(--orpale);color:var(--orfonce)}
.flag.rouge{background:var(--rougepale);color:var(--rouge)}
.rec{color:var(--rouge)}
.etat{flex:none;font-size:.74rem;font-weight:700;padding:2px 7px;text-transform:uppercase;letter-spacing:.05em;border:1.5px solid currentColor;white-space:nowrap}
.e-piste{color:#6A5ACD}.e-cours{color:var(--vert)}.e-fini{color:var(--gris)}
.e-br{color:var(--gris)}.e-env{color:#2F5D9E}.e-rt{color:var(--rouge);background:var(--rougepale)}.e-ok{color:var(--vert);background:var(--vertpale)}.e-an{color:var(--gris);text-decoration:line-through}
.plus-fini{align-self:flex-start;border:0;background:transparent;font-weight:700;color:var(--gris);padding:4px 2px}
.ajout-m{align-self:flex-start;border:1.5px dashed var(--trait2);background:transparent;padding:8px 12px;font-weight:700;color:var(--gris);margin-top:-2px}

/* chrono */
.chrono{background:var(--carte);border:2px solid var(--roche);box-shadow:var(--ombre);padding:12px;display:flex;flex-direction:column;gap:10px}
.chrono.on{background:var(--roche);color:#fff}
.ch-t{font:600 2.6rem/1 var(--mono);color:var(--or);letter-spacing:.02em}
.ch-m{font-weight:700}
.chrono .in{background:#3A322D;border-color:#5A4E46;color:#fff}
.chrono .row2{display:flex;gap:8px}
.chrono .row2 .btn{flex:1}
.chrono.on .btn2{background:transparent;color:#fff;border-color:#8A7D72}
.bann{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--roche);color:#fff;padding:9px 12px;text-align:left;font-weight:700}
.bann .t{font-family:var(--mono);color:var(--or)}
.bann .s{margin-left:auto;font-size:.82rem;opacity:.8}
.pt{display:inline-block;width:9px;height:9px;background:var(--rouge);border-radius:50%;animation:clign 1.2s steps(2) infinite}
@keyframes clign{50%{opacity:.25}}

/* heures */
.semnav{display:flex;align-items:center;gap:8px;background:var(--carte);border:1.5px solid var(--roche)}
.semnav button{width:52px;height:52px;border:0;background:transparent;font-size:1.5rem;font-weight:700}
.semnav div{flex:1;text-align:center;display:flex;flex-direction:column}
.semnav div span{font-size:.84rem;color:var(--gris)}
.semtot{display:flex;align-items:baseline;gap:10px}
.semtot b{font-size:1.5rem}
.jour{display:flex;flex-direction:column}
.jh{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px;border-bottom:2px solid var(--roche);font-weight:700}
.hrow{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px dashed var(--trait);background:transparent;padding:10px 2px;text-align:left}
.dot{--c:#888;flex:none;width:12px;height:12px;background:var(--c)}
.hb{flex:1;min-width:0;display:flex;flex-direction:column}
.hb b{overflow-wrap:anywhere}
.ok{color:var(--vert);font-weight:700}
.liste{background:var(--carte);border:1.5px solid var(--roche);padding:0 12px}

/* factures */
.tuiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tuiles3>div{background:var(--carte);border:1.5px solid var(--roche);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tuiles3 b{font-size:1.08rem;overflow:hidden;text-overflow:ellipsis}
.tuiles3 span:last-child{font-size:.78rem;color:var(--gris)}
.tuiles3 .r{border-color:var(--rouge);background:var(--rougepale)}
.grp{display:flex;flex-direction:column}
.grp>.cap{margin:4px 0 6px}
.drow{--c:#888;display:flex;align-items:center;gap:10px;width:100%;background:var(--carte);border:1.5px solid var(--roche);border-left:6px solid var(--c);padding:9px 12px;text-align:left;margin-bottom:8px}
.db{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.d1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d2{font-size:.88rem;overflow-wrap:anywhere}
.d3{font-size:.8rem;color:var(--gris)}
.dm{flex:none;font-size:1rem}

/* contacts */
.cherche{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--roche);background:var(--carte)}
.crow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px dashed var(--trait);background:transparent;padding:11px 2px;text-align:left}
.crow .ini{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--pierre2);font:800 1.15rem/1 var(--pochoir)}
.crow .hb span{font-size:.84rem;color:var(--gris)}

/* bilan */
.annee{display:flex;align-items:center;justify-content:center;gap:14px}
.annee b{font:800 2rem/1 var(--pochoir)}
.annee button{width:46px;height:46px;border:1.5px solid var(--roche);background:var(--carte);font-size:1.3rem;font-weight:700}
.hero{background:var(--roche);color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--ombre)}
.hero .cap{color:#CFC4B6}
.hero .gros{font:600 2.3rem/1.05 var(--mono);color:var(--or)}
.hero .sous{font-size:.88rem;color:#E6DDD2}
.bact{--c:#888;background:var(--carte);border:1.5px solid var(--roche);border-left:7px solid var(--c);padding:10px 12px}
.bact h3{margin:0 0 6px;font:800 1.3rem/1 var(--pochoir);text-transform:uppercase;letter-spacing:.03em}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.g3>div{display:flex;flex-direction:column;min-width:0}
.g3 b{font:600 .98rem/1.25 var(--mono);overflow:hidden;text-overflow:ellipsis}
.g3 .cap{font-size:.66rem}

/* pages mandat et document */
.mtete{--c:#55606B;background:var(--carte);border:2px solid var(--roche);border-top:10px solid var(--c);box-shadow:var(--ombre);padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px;position:relative}
.mt-a{font-size:.86rem;font-weight:700;color:var(--gris)}
.mt-n{margin:0;font:800 2.1rem/1 var(--pochoir);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere;padding-right:70px}
.mt-n.mono{font:600 1.7rem/1.1 var(--mono);text-transform:none}
.mt-c{font-size:.92rem}
.mt-edit{position:absolute;top:10px;right:10px;border:1.5px solid var(--roche);background:var(--carte);font-weight:700;padding:5px 10px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--roche);background:var(--carte)}
.kpis>div{padding:8px 10px;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--trait);border-bottom:1px solid var(--trait)}
.kpis>div:nth-child(3n){border-right:0}
.kpis>div:nth-last-child(-n+3){border-bottom:0}
.kpis b{font:600 1.02rem/1.25 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis .cap{font-size:.66rem}
.reste{display:flex;align-items:center;gap:10px;background:var(--orpale);border:1.5px solid var(--or);padding:8px 10px}
.reste span{flex:1;font-size:.92rem}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bloc{background:var(--carte);border:1.5px solid var(--roche);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.bh{display:flex;align-items:baseline;gap:8px}
.bh h3{margin:0;font:800 1.35rem/1 var(--pochoir);text-transform:uppercase;letter-spacing:.03em}
.bh .meta{margin-left:auto}
.qa{display:flex;gap:8px}
.qa .in{flex:1;min-width:0}
.tache{display:flex;align-items:center;gap:6px;border-top:1px dashed var(--trait);min-height:46px}
.ck{flex:none;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.ck::before{content:"";grid-area:1/1;width:22px;height:22px;border:2px solid var(--roche);background:#fff}
.ck svg{grid-area:1/1;width:15px;height:15px;stroke:var(--roche);stroke-width:3.4;opacity:0;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fait .ck::before{background:var(--or)}
.fait .ck svg{opacity:1}
.tt{flex:1;min-width:0;overflow-wrap:anywhere}
.fait .tt{text-decoration:line-through;color:var(--gris)}
.tx-x{flex:none;width:40px;height:40px;border:0;background:transparent;color:var(--gris)}
.txrow{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--trait);padding:8px 0}
.txrow .hb span{font-size:.82rem;color:var(--gris)}
.trouve{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--vertpale);border:1.5px solid var(--vert);padding:10px 12px;font-size:.93rem}
.trouve span{flex:1;min-width:200px}
.ta{min-height:84px;padding:10px 12px;height:auto;resize:vertical;line-height:1.4}
.form label,.lab{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:700;color:var(--gris)}
.form label .in{color:var(--roche);font-weight:400}
.lab .opt{font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc{align-self:end;font-size:.88rem;color:var(--gris);padding-bottom:12px}
.ligne{border:1.5px solid var(--trait2);background:#FBF9F6;padding:8px;display:flex;flex-direction:column;gap:6px}
.ligne .ta1{min-height:44px;height:auto;padding:9px 10px;resize:vertical}
.lg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.3fr);gap:6px;align-items:end}
.lg label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;font-weight:700;color:var(--gris);min-width:0}
.lg .in{height:42px;padding:0 8px}
.lt{margin-left:auto;padding:0 6px;font-size:1.02rem}
.lact{display:flex;align-items:center;gap:4px}
.lact button{width:36px;height:32px;border:1px solid var(--trait2);background:#fff;color:var(--gris)}
.lact .src{font-size:.76rem;color:var(--gris);min-width:0}
.dtot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--roche);padding-top:8px;font-weight:700}
.dtot b{font-size:1.4rem}

/* fenêtre (feuille) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(43,36,32,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet>*{flex-shrink:0}
.sheet{background:var(--pierre);width:100%;max-width:540px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--or);display:flex;flex-direction:column;gap:8px;animation:up .16s ease-out}
.sheet.large{max-width:880px}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@media (min-width:600px){.scrim{align-items:center}.sheet{border:2px solid var(--roche);border-top:6px solid var(--or);box-shadow:6px 6px 0 rgba(43,36,32,.55)}}
.sh{position:sticky;top:0;z-index:2;background:var(--pierre);display:flex;align-items:center;gap:8px;padding:14px 0 6px}
.sh h2{flex:1;margin:0;font:800 1.8rem/1 var(--pochoir);text-transform:uppercase;letter-spacing:.02em}
.x{width:44px;height:44px;border:0;background:transparent;font-size:1.15rem;color:var(--gris)}
.x:hover{background:var(--pierre2)}

/* « 2:30 », « 2h30 », « 2,5 » (heures), « 45 min » */
function parseDuree(s){
  s=String(s||'').trim().toLowerCase().replace(',','.'); if(!s) return null; let m;
  if((m=s.match(/^(\d+)\s*[:h]\s*(\d{1,2})?\s*(min)?$/))) return (+m[1])*60+(+(m[2]||0));
  if((m=s.match(/^(\d+)\s*(m|min|mn|minutes?)$/))) return +m[1];
  if((m=s.match(/^(\d*\.?\d+)\s*(h|heures?)?$/))) return Math.round(parseFloat(m[1])*60);

}

function actDeCat(cat){ const L=actsTri(true), a=L.find(x=>x.cat&&x.cat===cat); if(a) return a;

/* chiffres d'un mandat */
function chiffres(m){
  const hs=heuresDe(m.id), fh=reprises('heures'), min=hs.reduce((s,h)=>s+(h.min||0),0);

/* écran « Relier aux projets » : proposition, puis validation */
const MOTS_VIDES=new Set(['pour','avec','dans','chez','des','les','une','sur','projet','mandat']);
const mots=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!MOTS_VIDES.has(w));
function liensInit(){ const L=PB?PB.liste():[], tops=L.filter(p=>!p.parent&&!p.closed&&p.size!=='mini'), R={acts:{},mands:{}}, pris=new Set();
  for(const a of actsTri(true)){ const same=tops.find(p=>norm(p.name)===norm(a.nom)&&Projets.nature(p,proj)==='pro'); R.acts[a.id]=a.projet&&proj(a.projet)?a.projet:a.archive?'':same?same.id:'new'; if(R.acts[a.id]&&R.acts[a.id]!=='new') pris.add(R.acts[a.id]); }
  for(const m of Object.values(S.mands).sort(triMandat)){ if(m.projet&&proj(m.projet)){ R.mands[m.id]=m.projet; pris.add(m.projet); continue; }
    const same=L.find(p=>!pris.has(p.id)&&norm(p.name)===norm(m.nom)); if(same){ R.mands[m.id]=same.id; pris.add(same.id); continue; }
    const w=new Set([...mots(m.nom),...mots(act(m.activite).nom)]); let best=null, sc=0;
    for(const p of L){ if(pris.has(p.id)||(p.closed&&m.etat!=='fini')) continue; const s2=mots(p.name).filter(x=>w.has(x)).length+(p.size==='mini'?0:.1); if(s2>=1&&s2>sc){ sc=s2; best=p; } }

  return R; }

function sauverLiens(){ if(!ed||ed.k!=='liens'||!PB) return; const R=ed.R; exporter(); const all=()=>PB.liste(), get=id=>all().find(x=>x.id===id);

/* =============================== Synchro (même principe que les autres apps) =============================== */
function canon(v){ if(Array.isArray(v)) return '['+v.map(x=>canon(x===undefined?null:x)).join(',')+']'; if(v&&typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'; return JSON.stringify(v===undefined?null:v); }
const COLL={a:'acts',m:'mands',c:'conts',h:'heures',d:'docs',l:'liens'};
function rowsOf(st){ const r={}; for(const p in COLL) for(const x of Object.values(st[COLL[p]])) r[p+':'+x.id]=x;
  if(Object.keys(st.regl).length) r['s:reglages']=st.regl; if(st.chrono) r['s:chrono']=st.chrono; return r; }
function fromRows(map){ const st=vide();
  for(const k in map){ let d; try{ d=JSON.parse(map[k]); }catch(e){ continue; } if(!d) continue;
    if(k==='s:reglages') st.regl=d; else if(k==='s:chrono') st.chrono=d; else { const c=COLL[k[0]]; if(c&&d.id) st[c][d.id]=d; } }
  return st; }
function persist(){ if(!UID) return; try{ localStorage.setItem(CK(),JSON.stringify({prev,dirty:[...dirty],lastPull})); }catch(e){} }
function save(){ clearTimeout(saveTimer); if(!UID) return; const cur=rowsOf(S); let ch=false;
  for(const k in cur){ const v=canon(cur[k]); if(prev[k]!==v){ prev[k]=v; dirty.add(k); ch=true; } }
  for(const k in prev){ if(!(k in cur)){ delete prev[k]; dirty.add(k); ch=true; } }
  if(ch){ persist(); schedulePush(); setSync(); } }
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,500); }
function schedulePush(d){ clearTimeout(pushTimer); pushTimer=setTimeout(push,d==null?900:d); }
async function push(){
  if(!sb||!UID||pushing||!dirty.size){ setSync(); return; }
  if(!navigator.onLine){ setSync(); return; }
  pushing=true; setSync();
  const keys=[...dirty].slice(0,250), sent={};
  const rows=keys.map(k=>{ sent[k]=prev[k]; const kind=KIND[k[0]]||'reglage'; return (k in prev)?{user_id:UID,key:k,kind,data:JSON.parse(prev[k]),deleted:false}:{user_id:UID,key:k,kind,data:null,deleted:true}; });
  try{
    const {error}=await sb.from(TABLE).upsert(rows,{onConflict:'user_id,key'}); if(error) throw error;
    keys.forEach(k=>{ if(prev[k]===sent[k]) dirty.delete(k); });
    persist(); const avait=syncErr; syncErr=''; pushing=false; setSync(); if(avait) render();
    if(dirty.size) schedulePush(200);
  }catch(e){ pushing=false; const avait=syncErr; syncErr=(e&&e.message)||String(e); setSync(); if(!avait) render(); schedulePush(15000); }
}
async function pull(full){
  if(!sb||!UID) return false;
  if(!navigator.onLine){ setSync(); return false; }
  try{
    const since=full?null:lastPull; let changed=false, maxTs=lastPull, from=0;
    for(;;){
      let q=sb.from(TABLE).select('key,data,deleted,updated_at').order('updated_at',{ascending:true}).range(from,from+999);
      if(since) q=q.gte('updated_at',since);
      const {data,error}=await q; if(error) throw error;
      data.forEach(r=>{ if(!maxTs||r.updated_at>maxTs) maxTs=r.updated_at; if(dirty.has(r.key)) return;
        if(r.deleted||r.data==null){ if(r.key in prev){ delete prev[r.key]; changed=true; } }
        else { const v=canon(r.data); if(prev[r.key]!==v){ prev[r.key]=v; changed=true; } } });
      if(data.length<1000) break; from+=1000;
    }
    lastPull=maxTs; persist();
    const avait=syncErr; syncErr='';
    if(changed){ S=fromRows(prev); render(); } else if(avait) render();
    if(booted&&!Object.keys(S.acts).length){ semer(); save(); render(); }
    if(booted&&S.acts.gdt&&S.acts.gdt.ignorer===undefined){ S.acts.gdt.ignorer=true; save(); render(); }
    if(booted&&(reparerCats()|autoLier())) render();
    setSync(); return true;
  }catch(e){ const avait=syncErr; syncErr=(e&&e.message)||String(e); setSync(); if(!avait) render(); return false; }
}
/* Banque : on lit seulement (opérations Pro, catégories), on n'écrit jamais dans sa table */

  try{
    const since=full?null:bLast; let maxTs=bLast, from=0, ch=false; const lot=[];
    for(;;){
      let q=sb.from(BTABLE).select('key,kind,data,deleted,updated_at').in('kind',['tx','categorie','document']).order('updated_at',{ascending:true}).range(from,from+999);
      if(since) q=q.gte('updated_at',since);
      const {data,error}=await q; if(error) throw error;
      lot.push(...data); if(data.length<1000) break; from+=1000;
    }

    lot.sort((a,b)=>(a.kind==='categorie'?0:1)-(b.kind==='categorie'?0:1));
    for(const r of lot){
      if(!maxTs||r.updated_at>maxTs) maxTs=r.updated_at;
      const id=r.key.slice(2), coll=r.kind==='tx'?'tx':r.kind==='document'?'docs':'cats';
      let d=null;
      if(!r.deleted&&r.data){ if(r.kind==='tx'){ if(txPro(r.data)){ const t=r.data; d={id:t.id||id,date:t.date,compte:t.compte,montant:t.montant,tiers:t.tiers||'',note:t.note||'',cat:t.cat,parts:t.parts&&t.parts.length?t.parts.map(p=>({montant:p.montant,cat:p.cat})):null,docs:t.docs&&t.docs.length?t.docs.slice():undefined,mine:t.mine&&t.mine.mandat?{mandat:t.mine.mandat}:undefined}; } } else if(r.kind==='document'){ const f=r.data; d={id:f.id||id,tx:f.tx,nom:f.nom||'',type:f.type||'',path:f.path||null}; } else d=r.data; }
      if(d){ if(canon(B[coll][id])!==canon(d)){ B[coll][id]=d; ch=true; } }
      else if(B[coll][id]){ delete B[coll][id]; ch=true; }
    }

}

/* ---------- Bilan ---------- */
function vBilan(){
  const Y=String(ui.an), dansY=d=>(d||'').startsWith(Y);
  let h=alerteTable()+chronoBanniere()+`<div class="annee"><button data-act="an" data-n="-1" aria-label="Année précédente">‹</button><b>${Y}</b><button data-act="an" data-n="1" aria-label="Année suivante" ${ui.an>=new Date().getFullYear()?'disabled':''}>›</button></div>`;
  let lignes=[...actsTri(true), SANS].map(a=>{
    const ms=a.id?mandsDe(a.id):Object.values(S.mands).filter(m=>!S.acts[m.activite]), ids=new Set(ms.map(m=>m.id));
    const min=Object.values(S.heures).filter(x=>ids.has(x.mandat)&&dansY(x.date)).reduce((s,x)=>s+x.min,0);
    const F=Object.values(S.docs).filter(d=>d.type==='facture'&&ids.has(d.mandat));
    const fac=sum(F.filter(d=>emise(d)&&dansY(d.date)),docTotal), enc=sum(F.filter(d=>d.etat==='payee'&&dansY(d.paye_le)),docTotal);
    let rec=0, dep=0; const cats=new Set(); for(const t of Object.values(B.tx)){ if(!dansY(t.date)) continue; for(const l of bLignes(t)){ if(!estPro(l.cat)) continue; const aa=actDeCat(l.cat); if((aa?aa.id:'')!==a.id) continue; const v=+l.montant||0; if(v>0) rec+=v; else dep+=v; cats.add(catNom(l.cat)); } }
    return {a,min,fac,enc,rec:r2(rec),dep:r2(dep),net:r2(rec+dep),cats:[...cats]};
  });
  const apercus=lignes.filter(x=>x.a.ignorer&&(x.rec||x.dep)); lignes=lignes.filter(x=>!x.a.ignorer);
  const calmes=lignes.filter(x=>!(x.min||x.fac||x.enc||x.rec||x.dep)&&x.a.id&&!x.a.archive).map(x=>x.a);
  lignes=lignes.filter(x=>x.min||x.fac||x.enc||x.rec||x.dep);
  const T=k=>r2(lignes.reduce((s,x)=>s+x[k],0)), tmin=lignes.reduce((s,x)=>s+x.min,0);
  h+=`<section class="hero"><span class="cap">Extrait en ${Y} · encaissé</span><span class="gros">${fCHF(T('enc'))}</span><span class="sous">Facturé ${fCHF(T('fac'))} · ${fH(tmin)} de travail${bPret?` · Banque net ${fCHF(T('net'),true)}`:''}</span></section>`;
  if(!bPret) h+=`<p class="info">${bErr?'La Banque n’est pas accessible pour l’instant ('+esc(bErr)+').':'La Banque se charge…'} Les dépenses et recettes Pro viennent de la Banque.</p>`;
  h+=lignes.map(x=>{ const parH=x.min?(bPret&&(x.rec||x.dep)?x.net:x.enc)/(x.min/60):null;
    return `<section class="bact" style="--c:${x.a.couleur}"><h3>${esc(x.a.emoji)} ${esc(x.a.id?x.a.nom:'Autres opérations Pro')}</h3>${x.a.id?'':`<p class="aide" style="margin:-2px 0 6px">Catégories de la Banque reliées à aucune activité : ${x.cats.map(esc).join(', ')||'—'}. Relie-les dans « Gérer les activités ».</p>`}<div class="g3"><div><span class="cap">Heures</span><b>${fH(x.min)}</b></div><div><span class="cap">Facturé</span><b>${fCHF(x.fac)}</b></div><div><span class="cap">Encaissé</span><b>${fCHF(x.enc)}</b></div><div><span class="cap">Banque +</span><b class="${x.rec?'pos':''}">${fCHF(x.rec)}</b></div><div><span class="cap">Banque −</span><b class="${x.dep?'neg':''}">${fCHF(x.dep)}</b></div><div><span class="cap">Par heure</span><b>${parH!=null?fCHF(r2(parH)):'—'}</b></div></div></section>`; }).join('');
  h+=apercus.map(x=>`<section class="bact" style="--c:${x.a.couleur};background:#F7F4EF"><h3>${esc(x.a.emoji)} ${esc(x.a.nom)} <span class="meta" style="font:400 .8rem var(--body);text-transform:none;letter-spacing:0">· aperçu, suivi à part</span></h3><div class="g3"><div><span class="cap">Banque +</span><b class="${x.rec?'pos':''}">${fCHF(x.rec)}</b></div><div><span class="cap">Banque −</span><b class="${x.dep?'neg':''}">${fCHF(x.dep)}</b></div><div><span class="cap">Net</span><b>${fCHF(x.net,true)}</b></div></div></section>`).join('');
  if(calmes.length) h+=`<p class="aide">Rien en ${Y} : ${calmes.map(a=>esc(a.emoji+' '+a.nom)).join(', ')}.</p>`;
  h+=`<p class="aide">« Banque + / − » : toutes les opérations Pro de l’activité dans la Banque. « Par heure » : le net de la Banque (ou l’encaissé) divisé par les heures notées.${apercus.length?' Les activités en aperçu ne comptent pas dans les totaux du haut.':''}</p>`;
  const att=docsType('facture').filter(d=>d.etat==='envoyee').sort((a,b)=>echeance(a).localeCompare(echeance(b)));
  if(att.length) h+=`<div class="grp"><div class="cap">À encaisser · ${fCHF(sum(att,docTotal))}</div>${att.map(rowDoc).join('')}</div>`;
  const nf=Object.values(S.mands).map(m=>({m,c:chiffres(m)})).filter(x=>x.c.minNF).sort((a,b)=>b.c.valNF-a.c.valNF);
  if(nf.length) h+=`<section class="bloc"><div class="bh"><h3>Pas encore facturé</h3><span class="meta">${fCHF(sum(nf,x=>x.c.valNF))}</span></div>${nf.map(x=>`<div class="ligne-r"><button class="lien-b" data-act="mandat" data-id="${x.m.id}">${esc(x.m.nom)}</button><span class="mono">${fH(x.c.minNF)} · ${fCHF(x.c.valNF)}</span></div>`).join('')}</section>`;
  const n=aTrier(0,false).length;

  return h;
}

/* =============================== Document A4 et QR-facture =============================== */
function emetteur(d){ const r=R(), m=S.mands[d.mandat], a=m&&S.acts[m.activite]||{};
  return {nom:a.nomDoc||r.nom, sous:a.sousTitre||'', rue:r.rue, npa:r.npa, lieu:r.lieu, pays:(r.pays||'CH').toUpperCase(), email:r.email, tel:r.tel, site:r.site, iban:ibanNet(a.iban||r.iban)}; }
function ibanNet(s){ return String(s||'').replace(/\s+/g,'').toUpperCase(); }
function ibanOk(s){ const i=ibanNet(s); if(!/^(CH|LI)\d{2}[0-9A-Z]{17}$/.test(i)) return false; const x=(i.slice(4)+i.slice(0,4)).replace(/[A-Z]/g,c=>String(c.charCodeAt(0)-55)); let m=0; for(const ch of x) m=(m*10+(+ch))%97; return m===1; }
function ibanJoli(s){ return ibanNet(s).replace(/(.{4})/g,'$1 ').trim(); }
function estQrIban(i){ const n=+i.slice(4,9); return n>=30000&&n<=31999; }
function mod10(s){ const T=[0,9,4,6,8,2,7,1,3,5]; let c=0; for(const ch of s) c=T[(c+(+ch))%10]; return String((10-c)%10); }
function rfCle(ref){ const x=(ref+'RF00').replace(/[A-Z]/g,c=>String(c.charCodeAt(0)-55)); let m=0; for(const ch of x) m=(m*10+(+ch))%97; return String(98-m).padStart(2,'0'); }
/* référence de paiement : QRR avec une QR-IBAN, sinon référence créancier ISO 11649 (RF…) tirée du numéro de facture */
function reference(d,iban){ const base=String(d.num||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(estQrIban(iban)){ const dg=(base.replace(/\D/g,'')||'0').slice(-26).padStart(26,'0'); return {type:'QRR',val:dg+mod10(dg)}; }
  if(!base) return {type:'NON',val:''};
  const r=base.slice(0,21); return {type:'SCOR',val:'RF'+rfCle(r)+r}; }
function refJolie(ref){ if(ref.type==='QRR') return ref.val.slice(0,2)+' '+ref.val.slice(2).replace(/(.{5})/g,'$1 ').trim(); return ref.val.replace(/(.{4})/g,'$1 ').trim(); }
/* jeu de caractères permis dans la QR-facture */
function qt(s,max){ s=String(s||'').replace(/[’‘`´]/g,"'").replace(/[“”„]/g,'"').replace(/[–—]/g,'-').replace(/\s+/g,' ').trim();
  s=[...s].filter(ch=>{ const c=ch.codePointAt(0); return (c>=0x20&&c<=0x7E)||(c>=0xA0&&c<=0x17F)||(c>=0x218&&c<=0x21B)||c===0x20AC; }).join('');
  return s.slice(0,max).trim(); }
function montantQR(n){ return n>0?n.toFixed(2):''; }
function montantJoli(n){ const [e,c]=n.toFixed(2).split('.'); return e.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+'.'+c; }
function debiteur(d){ const c=S.conts[d.client]; if(!c||!c.npa||!c.lieu||!cNom(c)) return null; return {nom:cNom(c),rue:c.rue||'',npa:c.npa,lieu:c.lieu,pays:(c.pays||'CH').toUpperCase().slice(0,2)}; }
function manqueQR(d){ const e=emetteur(d), m=[]; if(!e.nom) m.push('ton nom'); if(!e.npa||!e.lieu) m.push('ton NPA et ton lieu'); if(!ibanOk(e.iban)) m.push(e.iban?'un IBAN valable':'ton IBAN'); if(!(docTotal(d)>0)) m.push('un montant'); return m; }
function spc(d){
  const e=emetteur(d), deb=debiteur(d), ref=reference(d,e.iban), msg=qt('Facture '+(d.num||'')+(d.objet?' - '+d.objet:''),140);
  const cr=['S',qt(e.nom,70),qt(e.rue,70),'',qt(e.npa,16),qt(e.lieu,35),e.pays];
  const db=deb?['S',qt(deb.nom,70),qt(deb.rue,70),'',qt(deb.npa,16),qt(deb.lieu,35),deb.pays]:['','','','','','',''];
  return ['SPC','0200','1',e.iban,...cr,'','','','','','','',montantQR(docTotal(d)),'CHF',...db,ref.type,ref.val,msg,'EPD'].join('\r\n');
}
function qrSvg(txt){
  const q=qrcode(0,'M'); q.addData(txt); q.make(); const n=q.getModuleCount(); let p='';
  for(let r=0;r<n;r++){ let c=0; while(c<n){ if(q.isDark(r,c)){ let k=c; while(k<n&&q.isDark(r,k)) k++; p+=`M${c} ${r}h${k-c}v1h-${k-c}z`; c=k; } else c++; } }
  const s=n*7/46, o=(n-s)/2; /* croix suisse de 7 mm au centre d'un code de 46 mm */
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-label="Code QR de paiement"><path d="${p}" fill="#000"/><svg x="${o}" y="${o}" width="${s}" height="${s}" viewBox="0 0 19.8 19.8" shape-rendering="geometricPrecision"><rect width="19.8" height="19.8" fill="#fff"/><rect x="0.7" y="0.7" width="18.4" height="18.4" fill="#000"/><rect x="8.3" y="4" width="3.3" height="11" fill="#fff"/><rect x="4.4" y="7.9" width="11" height="3.3" fill="#fff"/></svg></svg>`;
}
function adresseL(o){ return [o.nom,o.rue,[o.npa,o.lieu].filter(Boolean).join(' ')].filter(Boolean).map(esc).join('<br>'); }
function slipHtml(d){
  const e=emetteur(d), deb=debiteur(d), ref=reference(d,e.iban), T=docTotal(d), info=qt('Facture '+(d.num||'')+(d.objet?' - '+d.objet:''),140);
  const cis=(cl)=>`<svg class="cis ${cl}" viewBox="0 0 8 5" aria-hidden="true"><path d="${CISEAUX}" fill="#000"/></svg>`;
  const boite=(w,hh)=>`<div class="boite" style="width:${w}mm;height:${hh}mm"><i></i></div>`;
  const cr={nom:e.nom,rue:e.rue,npa:e.npa,lieu:e.lieu};
  return `<div class="slip">${cis('h')}${cis('v')}
<div class="rcp"><div class="t">Récépissé</div><div class="h">Compte / Payable à</div><div class="v">${ibanJoli(e.iban)}<br>${adresseL(cr)}</div>${ref.type!=='NON'?`<div class="h">Référence</div><div class="v">${refJolie(ref)}</div>`:''}<div class="h">${deb?'Payable par':'Payable par (nom/adresse)'}</div>${deb?`<div class="v">${adresseL(deb)}</div>`:boite(52,20)}
<div class="mt"><div><div class="h">Monnaie</div><div class="v">CHF</div></div><div><div class="h">Montant</div><div class="v">${montantJoli(T)}</div></div></div><div class="pd">Point de dépôt</div></div>
<div class="pay"><div class="t">Section paiement</div><div class="qr">${qrSvg(spc(d))}</div><div class="mt"><div><div class="h">Monnaie</div><div class="v">CHF</div></div><div><div class="h">Montant</div><div class="v">${montantJoli(T)}</div></div></div>
<div class="col2"><div class="h">Compte / Payable à</div><div class="v">${ibanJoli(e.iban)}<br>${adresseL(cr)}</div>${ref.type!=='NON'?`<div class="h">Référence</div><div class="v">${refJolie(ref)}</div>`:''}${info?`<div class="h">Informations supplémentaires</div><div class="v">${esc(info)}</div>`:''}<div class="h">${deb?'Payable par':'Payable par (nom/adresse)'}</div>${deb?`<div class="v">${adresseL(deb)}</div>`:boite(65,25)}</div></div></div>`;
}
function docHtml(d){
  const fac=d.type==='facture', e=emetteur(d), c=S.conts[d.client], r=R(), L=d.lignes||[], T=docTotal(d), brut=docBrut(d);
  const contact=[e.email,e.tel,e.site].filter(Boolean).map(esc).join('<br>');
  const dest=c?[c.org,c.nom,c.rue,[c.npa,c.lieu].filter(Boolean).join(' '),c.pays&&c.pays.toUpperCase()!=='CH'?c.pays:''].filter(Boolean).map(esc).join('<br>'):'';
  const qte=l=>{ const q=num(l.qte); return q==null?'':(Number.isInteger(q)?q:String(q).replace('.',','))+(l.unite?' '+esc(l.unite):''); };
  let h=`<div class="a4-corps"><div class="dh"><div class="emet"><b>${esc(e.nom||'(ton nom : ⚙ Réglages)')}</b>${e.sous?`<span class="st">${esc(e.sous)}</span>`:''}${adresseL({rue:e.rue,npa:e.npa,lieu:e.lieu})}${contact?'<br><br>'+contact:''}</div>${dest?`<div class="dest">${dest}</div>`:''}</div>
<p class="dlieu">${esc(e.lieu||'')}${e.lieu?', le ':''}${fLong(d.date||today())}</p>
<h1 class="dtitre">${fac?'Facture':'Devis'} ${esc(d.num||'')}</h1>${d.objet?`<p class="dobj">${esc(d.objet)}</p>`:''}${d.intro?`<p class="dintro dnote">${esc(d.intro)}</p>`:''}
<table class="dl"><thead><tr><th>Description</th><th class="n">Quantité</th><th class="n">Prix</th><th class="n">Montant CHF</th></tr></thead><tbody>${L.map(l=>`<tr><td class="desc">${esc(l.desc||'')}</td><td class="n">${qte(l)}</td><td class="n">${num(l.prix)!=null?fmt(num(l.prix)):''}</td><td class="n">${fmt(ligneTotal(l))}</td></tr>`).join('')}</tbody>
<tfoot>${r.arrondi&&brut!==T?`<tr><td colspan="3">Arrondi</td><td class="n">${fmt(r2(T-brut),true)}</td></tr>`:''}<tr class="tot"><td colspan="3">Total CHF</td><td class="n">${fmt(T)}</td></tr></tfoot></table>
<p class="dcond">${fac?esc(conditions(d)):'Ce devis est valable jusqu’au '+fDate(echeance(d))+'.'}${r.tva?' '+esc(r.tva):''}${fac&&ibanOk(e.iban)?'<br>IBAN '+ibanJoli(e.iban)+(e.nom?' · '+esc(e.nom):''):''}</p>${d.note?`<p class="dnote">${esc(d.note)}</p>`:''}${r.pied?`<p class="dpied">${esc(r.pied)}</p>`:''}
${fac?'':`<div class="dsign"><div>Lieu et date</div><div>Bon pour accord : signature</div></div>`}</div>`;
  const slip=fac&&!manqueQR(d).length;
  return `<div class="a4"${slip?' data-slip="1"':''}>${h}${slip?slipHtml(d):''}</div>`;
}
/* le bulletin va en bas de la première page si tout y tient, sinon sur une page à lui */
function placerSlip(box){
  const mm=96/25.4;
  box.querySelectorAll('.a4[data-slip]').forEach(p=>{ const corps=p.querySelector('.a4-corps'), slip=p.querySelector('.slip'); if(!corps||!slip) return;
    if(corps.offsetHeight<=(297-105-2)*mm) p.classList.add('avec-slip');
    else { const n=document.createElement('div'); n.className='a4 page-slip'; n.appendChild(slip); p.after(n); }
    p.removeAttribute('data-slip'); });
}
function titreDoc(d){ const c=S.conts[d.client]; return (d.type==='facture'?'Facture ':'Devis ')+(d.num||'')+(c?' – '+cNom(c):''); }
let titreAvant=null;
function imprimer(id){ const d=S.docs[id]; if(!d) return;
  $print.innerHTML=docHtml(d); placerSlip($print); if(titreAvant==null) titreAvant=document.title; document.title=titreDoc(d);
  setTimeout(()=>window.print(),60); }
addEventListener('afterprint',()=>{ if(titreAvant!=null){ document.title=titreAvant; titreAvant=null; } $print.innerHTML=''; });

function sh(t){ return `<div class="sh"><h2 id="sh-titre">${t}</h2><button class="x" data-act="fermer" aria-label="Fermer">✕</button></div>`; }
function montrer(html,large){ $sheet.className='sheet'+(large?' large':''); $sheet.innerHTML=html; if($scrim.hidden){ $scrim.hidden=false; history.pushState({mine:'sheet'},''); } }
function cacherSheet(){ $scrim.hidden=true; $sheet.innerHTML=''; ed=null; }
function fermer(){ if(history.state&&history.state.mine==='sheet') history.back(); else cacherSheet(); }
function focus1(id){ setTimeout(()=>{ const el=document.getElementById(id); if(el) el.focus(); },60); }
function optMandats(sel,tout){ const ms=Object.values(S.mands).filter(m=>tout||m.etat!=='fini'||m.id===sel);
  return actsTri(true).concat(ms.some(m=>!S.acts[m.activite])?[SANS]:[]).map(a=>{ const l=ms.filter(m=>a.id?m.activite===a.id:!S.acts[m.activite]).sort(triMandat); if(!l.length) return '';
    return `<optgroup label="${esc(a.emoji+' '+a.nom)}">${l.map(m=>`<option value="${m.id}"${m.id===sel?' selected':''}>${esc(m.nom)}${m.etat==='fini'?' (terminé)':''}</option>`).join('')}</optgroup>`; }).join(''); }
function optContacts(sel){ return `<option value="">— Aucun —</option>${Object.values(S.conts).sort((a,b)=>cNom(a).localeCompare(cNom(b),'fr')).map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${esc(cNom(c))}</option>`).join('')}<option value="__new">+ Nouveau contact…</option>`; }

  let client=d.client; if(client==='__new'){ const n=d.nclient.trim(); if(n){ const cid=uid(); S.conts[cid]={id:cid,org:'',nom:n,rue:'',npa:'',lieu:'',pays:'CH',email:'',tel:'',note:'',cree:nowIso()}; client=cid; } else client=''; }
  const base=ed.id?S.mands[ed.id]:{id:uid(),taches:[],note:'',cree:nowIso()};
  const m=Object.assign(base,{activite:d.activite,nom:d.nom.trim(),client,etat:d.etat,debut:d.debut,fin:d.fin,tarif:d.tarif.trim()});
  S.mands[m.id]=m;
  if(relie()&&PB){ let p=projDe(m); const a=S.acts[m.activite];
    if(!p){ const par=a&&a.projet&&proj(a.projet); p=Projets.nouveau({emoji:a?a.emoji:'',color:a?a.couleur:'#C68A2E',name:m.nom}); if(par){ p.parent=par.id; if(Projets.nature(par,proj)!=='pro') p.nature='pro'; } else p.nature='pro'; m.projet=p.id; }
    p.name=m.nom; etatVersProjet(p,m.etat); ecrireProjet(p); }
  save(); const neuf=!ed.id;

}

<label class="lbl" for="e-emoji">Émoji</label><div style="display:flex;gap:8px"><input class="in" id="e-emoji" value="${esc(d.emoji)}" style="width:80px;text-align:center;font-size:1.3rem" autocomplete="off"><div class="chips" style="flex:1">${EMOJIS.map(e=>`<button class="chip" data-act="e-emoji" data-e="${e}" style="padding:4px 8px">${e}</button>`).join('')}</div></div>
<div class="lbl">Minerai (couleur du filon)</div><div class="chips">${MINERAIS.map(([n,c])=>`<button class="chip sw${c===d.couleur?' on':''}" style="--c:${c}" data-act="e-coul" data-c="${c}" aria-label="${n}" title="${n}" aria-pressed="${c===d.couleur}"></button>`).join('')}</div>

<label class="lbl" for="e-tarif">Tarif horaire CHF <span class="opt">(par défaut pour ses mandats)</span></label><input class="in mono" id="e-tarif" inputmode="decimal" value="${esc(d.tarif)}" placeholder="${esc(String(R().tarif||''))}" autocomplete="off">

<label class="lbl" for="e-nomdoc">Nom</label><input class="in" id="e-nomdoc" value="${esc(d.nomDoc)}" placeholder="${esc(R().nom||'Ton nom')}" autocomplete="off">

function sauverRegl(){ const g=k=>val('r-'+k).trim(); const iban=ibanNet(g('iban'));

  save(); fermer(); render(); toast('Réglages enregistrés'); }

/* --- nouveau document --- */
function ouvrirNouveauDoc(type,mid){ if(!Object.keys(S.mands).length){ montrer(sh(type==='devis'?'Nouveau devis':'Nouvelle facture')+`<p class="aide">Un devis ou une facture se rattache à un mandat. Ouvre d’abord un mandat.</p><button class="btn" data-act="mandat-new">Nouveau mandat</button>`); return; }
  ed={k:'ndoc',d:{type:type||'facture',mandat:mid||(ouverts()[0]||{}).id||''}}; vNouveauDoc(); }
function vNouveauDoc(){ const d=ed.d; montrer(sh(d.type==='devis'?'Nouveau devis':'Nouvelle facture')+`<div class="seg" role="group"><button data-act="nd-type" data-t="facture" aria-pressed="${d.type==='facture'}">Facture</button><button data-act="nd-type" data-t="devis" aria-pressed="${d.type==='devis'}">Devis</button></div><label class="lbl" for="e-mandat">Pour quel mandat ?</label><select class="in" id="e-mandat">${optMandats(d.mandat,true)}</select><button class="btn" data-act="nd-creer" style="margin-top:14px">Créer</button>`); }
function creerDoc(type,mid,heures){ const m=S.mands[mid], r=R(), id=uid(), date=today();
  const d={id,type,num:prochainNum(type,date),mandat:mid,client:m&&m.client||'',date,delai:type==='devis'?r.validite:r.delai,objet:m?m.nom:'',intro:'',lignes:[],note:'',etat:'brouillon',cree:nowIso()};
  S.docs[id]=d; if(heures) ajouterHeures(d); save(); return d; }
function ajouterHeures(d){ const m=S.mands[d.mandat]; if(!m) return 0; const c=chiffres(m); if(!c.nf.length) return 0;
  const dates=c.nf.map(h=>h.date).sort(), p=dates[0], q=dates[dates.length-1];
  d.lignes.push({id:uid(),desc:'Travail'+(p===q?' du '+fDate(p):' du '+fDate(p)+' au '+fDate(q)),qte:String(hDec(c.minNF)),unite:'h',prix:String(tarifDe(m)),src:{heures:c.nf.map(h=>h.id)}}); return c.nf.length; }

/* --- payer, rattacher, trier --- */
function vPayer(id){ const d=S.docs[id], T=docTotal(d), pris=paiements(), m=S.mands[d.mandat], a=m&&S.acts[m.activite];
  const meme=ed&&ed.k==='payer'&&ed.id===id; ed={k:'payer',id,date:meme?ed.date:today(),tx:meme?ed.tx:undefined};
  const cand=Object.values(B.tx).filter(t=>proMontant(t)>0&&!pris.has(t.id)&&t.date>=plusJours(d.date,-10)).sort((x,y)=>(Math.abs(proMontant(x)-T)<0.005?0:1)-(Math.abs(proMontant(y)-T)<0.005?0:1)||((a&&actDeTx(y)===a)?1:0)-((a&&actDeTx(x)===a)?1:0)||y.date.localeCompare(x.date)).slice(0,10);
  if(ed.tx===undefined){ ed.tx=''; if(cand[0]&&Math.abs(proMontant(cand[0])-T)<0.005){ ed.tx=cand[0].id; ed.date=cand[0].date; } }
  montrer(sh('Payée ?')+`<p class="aide">${esc(d.num)} · <b class="mono">${fmt(T)}</b></p><div class="lbl">Le paiement dans la Banque</div>`
  +(bPret?cand.map(t=>`<button class="opt-l${ed.tx===t.id?' on':''}" data-act="p-tx" data-tx="${t.id}"><span class="hb"><b>${esc(t.tiers||t.note||'Opération')}</b><span>${fJour(t.date)} · ${esc(catNom(bLignes(t).find(l=>estPro(l.cat)).cat))}${Math.abs(proMontant(t)-T)<0.005?' · <span class="ok">même montant</span>':''}</span></span><b class="mono pos">+${fmt(proMontant(t))}</b></button>`).join(''):'<p class="aide">La Banque n’est pas accessible pour l’instant.</p>')
  +`<button class="opt-l${!ed.tx?' on':''}" data-act="p-tx" data-tx=""><span class="hb"><b>Sans opération de la Banque</b><span>Ex. payé en liquide, ou pas encore saisi</span></span></button>`
  +`<label class="lbl" for="p-date">Payée le</label><input class="in" type="date" id="p-date" value="${esc(ed.date)}"><button class="btn or" data-act="p-ok" style="margin-top:14px">Marquer payée</button>`);
}
function marquerPayee(d,txId,date){ d.etat='payee'; d.paye_le=date||today(); d.paiement=txId||null; if(txId&&!S.liens[txId]) S.liens[txId]={id:txId,mandat:d.mandat}; save(); }
function vRattacher(mid){ const m=S.mands[mid], a=S.acts[m.activite]; if(!ed||ed.k!=='ratt'||ed.id!==mid) ed={k:'ratt',id:mid,tout:false,vieux:false};
  const lim=ed.vieux?'':plusJours(today(),-365);
  let L=Object.values(B.tx).filter(t=>(!S.liens[t.id]||S.liens[t.id].mandat===mid)&&t.date>=lim&&(S.liens[t.id]||!ignoree(t)));
  if(!ed.tout&&a&&a.cat) L=L.filter(t=>S.liens[t.id]||bLignes(t).some(l=>l.cat===a.cat));
  L.sort((x,y)=>y.date.localeCompare(x.date));
  montrer(sh('Rattacher')+`<p class="aide">Les opérations Pro de la Banque${!ed.tout&&a&&a.cat?' en '+esc(catNom(a.cat)):''} qui ne sont encore rattachées à aucun mandat. Touche pour rattacher à <b>${esc(m.nom)}</b> ou détacher.</p>`
  +`<div class="chips">${a&&a.cat?`<button class="chip${ed.tout?'':' on'}" data-act="r-tout" data-v="0">${esc(a.nom)}</button><button class="chip${ed.tout?' on':''}" data-act="r-tout" data-v="1">Toutes les activités</button>`:''}<button class="chip${ed.vieux?' on':''}" data-act="r-vieux">Plus d’un an</button></div>`
  +(bPret?(L.length?L.slice(0,150).map(t=>{ const on=S.liens[t.id]&&S.liens[t.id].mandat===mid, v=proMontant(t); return `<button class="opt-l${on?' on':''}" data-act="r-tx" data-tx="${t.id}" aria-pressed="${!!on}"><span class="ck" style="width:28px;height:28px" aria-hidden="true"></span><span class="hb"><b>${esc(t.tiers||t.note||'Opération')}</b><span>${fJour(t.date)} ${t.date.slice(0,4)} · ${esc(catNom(bLignes(t).find(l=>estPro(l.cat)).cat))}</span></span><b class="mono ${v<0?'neg':'pos'}">${fmt(v,true)}</b></button>`; }).join(''):'<p class="aide">Aucune opération à rattacher.</p>'):`<p class="aide">${bErr?'La Banque n’est pas accessible pour l’instant.':'La Banque se charge…'}</p>`)
  +`<button class="btn" data-act="fermer" style="margin-top:12px">Terminé</button>`);
  $sheet.querySelectorAll('.opt-l.on .ck').forEach(c=>c.parentElement.classList.add('fait'));
}
function vTrier(){ if(!ed||ed.k!=='trier') ed={k:'trier',vieux:false,conf:false}; const tous=aTrier(0,ed.vieux), L=tous.slice(0,80), n=tous.length, ign=actsTri(true).filter(a=>a.ignorer);
  montrer(sh('Trier')+`<p class="aide">Les opérations Pro de la Banque ${ed.vieux?'':'de cette année '}pas encore rattachées (${n}). Choisis le mandat, ou « Ignorer » : elle ne sera plus proposée.${ign.length?' Jamais proposées : '+ign.map(a=>esc(a.emoji+' '+a.nom)).join(', ')+' (aperçu seulement).':''}</p><div class="row-btns"><button class="chip${ed.vieux?' on':''}" data-act="t-vieux">Aussi les années d’avant</button>${n?`<button class="btn-sup${ed.conf?' conf':''}" data-act="t-tout">${ed.conf?'Toucher encore : ignorer les '+n:'Ignorer tout le reste ('+n+')'}</button>`:''}</div>`
  +(L.length?L.map(t=>{ const a=actDeTx(t), v=proMontant(t), ms=(a?mandsDe(a.id):Object.values(S.mands)).sort(triMandat).filter(m=>m.etat!=='fini'||ecart(m.fin||derniereAct(m).slice(0,10)||today(),t.date)<60).slice(0,6);
    return `<div class="tri"><div class="l1"><b>${esc(t.tiers||t.note||'Opération')}</b><span class="mono ${v<0?'neg':'pos'}">${fmt(v,true)}</span></div><span class="meta">${fJour(t.date)} ${t.date.slice(0,4)} · ${esc(catNom(bLignes(t).find(l=>estPro(l.cat)).cat))}</span><div class="chips">${ms.map(m=>`<button class="chip coul" style="--c:${act(m.activite).couleur}" data-act="t-lier" data-tx="${t.id}" data-id="${m.id}">${esc(m.nom)}</button>`).join('')}<button class="chip" data-act="t-lier" data-tx="${t.id}" data-id="">Ignorer</button></div></div>`; }).join(''):'<div class="vide"><span class="gros">Tout est rangé</span></div>')
  +(n>L.length?`<p class="aide">${n-L.length} de plus après celles-ci.</p>`:''));
}
function vActionsMandat(mid){ const m=S.mands[mid]; ed={k:'actm',id:mid};
  montrer(sh(esc(m.nom))+`<div class="menu-a"><button class="btn2" data-act="heure-new" data-id="${mid}">⏱ Noter des heures</button>${S.chrono&&S.chrono.mandat===mid?'':`<button class="btn2" data-act="chrono-go" data-id="${mid}">▶ Lancer le chrono</button>`}<button class="btn2" data-act="m-tache">☑ Ajouter une tâche</button><button class="btn2" data-act="doc-new" data-type="devis" data-id="${mid}">📄 Nouveau devis</button><button class="btn2" data-act="doc-new" data-type="facture" data-id="${mid}">🧾 Nouvelle facture</button><button class="btn2" data-act="rattacher" data-id="${mid}">🏦 Rattacher des opérations</button></div>`); }

/* --- justificatifs (gardés par la Banque dans « cash-documents ») --- */
async function vJustif(txId){ const t=B.tx[txId]; if(!t) return; ed={k:'justif',id:txId}; const L=(t.docs||[]).map(id=>B.docs[id]).filter(Boolean);
  montrer(sh('Justificatif')+`<p class="aide">${esc(t.tiers||t.note||'Opération')} · ${fJour(t.date)} ${t.date.slice(0,4)} · <b class="mono">${fmt(proMontant(t),true)}</b></p><div id="jf">${L.length?L.map(f=>`<div class="bloc" data-f="${f.id}"><b>${esc(f.nom||'Justificatif')}</b><p class="aide">${f.path?'Chargement…':'Pas encore envoyé depuis la Banque (l’appareil qui l’a ajouté doit être en ligne).'}</p></div>`).join(''):'<p class="aide">Pas encore synchronisé : ouvre la Banque, puis reviens ici.</p>'}</div>`);
  for(const f of L){ if(!f.path) continue; const box=$sheet.querySelector(`[data-f="${f.id}"]`); try{
    const {data,error}=await sb.storage.from('cash-documents').createSignedUrl(f.path,600); if(error) throw error; if(!box||!box.isConnected) continue; const u=data.signedUrl;
    box.innerHTML=`<b>${esc(f.nom||'Justificatif')}</b>${/pdf/.test(f.type)?'':`<img src="${esc(u)}" alt="" style="width:100%;height:auto;border:1px solid var(--trait)">`}<a class="btn2" href="${esc(u)}" target="_blank" rel="noopener">Ouvrir en grand</a>`;
  }catch(e){ if(box) box.querySelector('.aide').textContent=navigator.onLine?'Impossible de l’ouvrir ('+((e&&e.message)||e)+').':'Hors ligne : à ouvrir avec du réseau.'; } } }

/* --- aperçu --- */
function vApercu(id){ const d=S.docs[id], fac=d.type==='facture', manque=fac?manqueQR(d):[], c=S.conts[d.client]; ed={k:'apercu',id};
  const mail=c&&c.email?`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(titreDoc(d).split(' – ')[0]+(d.objet?' – '+d.objet:''))}&body=${encodeURIComponent('Bonjour,\n\nVous trouverez ci-joint '+(fac?'la facture '+d.num+' de CHF '+fmt(docTotal(d))+', payable d’ici le '+fDate(echeance(d)):'le devis '+d.num+' de CHF '+fmt(docTotal(d))+', valable jusqu’au '+fDate(echeance(d)))+'.\n\nMeilleures salutations\n'+(emetteur(d).nom||''))}`:'';
  montrer(sh(fac?'Facture':'Devis')+(manque.length?`<div class="info"><b>Pas de QR-facture pour l’instant :</b> il manque ${manque.join(', ')}. <button class="lien" data-act="reglages">Ouvrir les réglages</button></div>`:'')
  +`<div class="apercu" id="apercu"></div><div class="row-btns"><button class="btn or" data-act="imprimer" data-id="${id}">Imprimer / PDF</button>${mail?`<a class="btn2" href="${mail}">✉ Préparer l’e-mail</a>`:''}</div><p class="aide">Dans la fenêtre d’impression, choisis « Enregistrer en PDF », format A4, sans marges ni en-têtes. Le PDF prend le nom « ${esc(titreDoc(d))} ».</p>`,true);
  const box=document.getElementById('apercu'); box.innerHTML=`<div class="ap-zoom">${docHtml(d)}</div>`; placerSlip(box);
  const z=box.firstChild, ajuster=()=>{ const s=box.clientWidth/z.offsetWidth; z.style.transform='scale('+s+')'; box.style.height=Math.ceil(z.offsetHeight*s)+'px'; };
  requestAnimationFrame(ajuster); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(ajuster);
}

/* =============================== Actions =============================== */
function toast(msg,label,fn){ $toast.innerHTML=`<span>${esc(msg)}</span>${label?`<button>${esc(label)}</button>`:''}`; $toast.hidden=false; clearTimeout(toast.t);
  if(label) $toast.querySelector('button').onclick=()=>{ $toast.hidden=true; fn(); }; toast.t=setTimeout(()=>{ $toast.hidden=true; },label?6500:2600); }
function snap(){ return JSON.parse(JSON.stringify(S)); }
function restaurer(s){ S=s; save(); render(); }
function mandatCourant(){ const p=page(); return p&&p.k==='mandat'?S.mands[p.id]:null; }
function docCourant(){ const p=page(); return p&&p.k==='doc'?S.docs[p.id]:null; }
function chronoStart(mid){ if(!S.mands[mid]) return; if(S.chrono) chronoStop(true); S.chrono={id:'chrono',mandat:mid,debut:nowIso(),note:''}; save(); render(); toast('Chrono lancé : '+S.mands[mid].nom); }
function chronoStop(silencieux){ const c=S.chrono; if(!c) return; const min=Math.round((Date.now()-new Date(c.debut))/60000); S.chrono=null;
  if(min>=1&&S.mands[c.mandat]){ const id=uid(); S.heures[id]={id,mandat:c.mandat,date:jourDe(c.debut),min,note:(c.note||'').trim(),fact:true,src:'chrono',cree:nowIso()}; save(); toucherProjet(c.mandat); render(); if(!silencieux) toast(fH(min)+' notées sur '+S.mands[c.mandat].nom,'Modifier',()=>ouvrirHeure(id)); }
  else { save(); render(); if(!silencieux) toast('Moins d’une minute : rien de noté'); } }
function bougerLigne(d,lid,k){ const L=d.lignes, i=L.findIndex(l=>l.id===lid), j=i+k; if(i<0||j<0||j>=L.length) return; [L[i],L[j]]=[L[j],L[i]]; save(); render(); }
function majTotaux(d){ const t=document.getElementById('dt'); if(t) t.textContent=fmt(docTotal(d)); const ar=document.getElementById('d-arr'); if(ar){ ar.hidden=!(R().arrondi&&docBrut(d)!==docTotal(d)); const b=document.getElementById('d-brut'); if(b) b.textContent=fmt(docBrut(d)); }
  const e=document.getElementById('df-ech'); if(e) e.textContent=(d.type==='facture'?'Échéance ':'Jusqu’au ')+fDate(echeance(d)); }
function exporter(){ const blob=new Blob([JSON.stringify({app:'mine',le:nowIso(),donnees:rowsOf(S)},null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='la-mine-'+today()+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }

document.addEventListener('click',e=>{

  if(act!=='m-sup'&&act!=='d-sup'&&act!=='d-annuler'&&ed&&(ed.supM||ed.supD)){ ed.supM=null; ed.supD=null; }

    case 'retour': retour(); break;

    case 'reglages': vReglages(); break;
    case 'filtre': ui.filtre=id||''; lsSet('mine-filtre',ui.filtre); render(); break;
    case 'finis': ui.finis[id]=!ui.finis[id]; render(); break;
    case 'acts': vActs(); break;
    case 'liens': ed=null; vLiens(); break;
    case 'liens-ok': sauverLiens(); break;
    case 'act': ouvrirAct(id); break;
    case 'act-new': ouvrirAct(null); break;
    case 'act-haut': { const L=actsTri(true), i=L.findIndex(a=>a.id===id); if(i>0){ [L[i-1],L[i]]=[L[i],L[i-1]]; L.forEach((a,k)=>a.ordre=k); save(); vActs(); render(); } break; }
    case 'e-emoji': lireAct(); ed.d.emoji=b.dataset.e; vAct(); break;
    case 'e-coul': lireAct(); ed.d.couleur=b.dataset.c; vAct(); break;
    case 'sauver-act': sauverAct(); break;
    case 'sup-act': { if(!ed.conf){ lireAct(); ed.conf=true; vAct(); break; } delete S.acts[ed.id]; save(); vActs(); render(); toast('Activité supprimée'); break; }
    case 'mandat': if(S.mands[id]) allerPage('mandat',id); break;
    case 'mandat-new': ouvrirMandat(null,id); break;
    case 'mandat-edit': ouvrirMandat(id); break;
    case 'e-act': lireMandat(); ed.d.activite=id; vMandatEd(); break;
    case 'e-etat': lireMandat(); ed.d.etat=b.dataset.e; vMandatEd(); break;
    case 'sauver-mandat': sauverMandat(); break;
    case 'm-etat': { const m=mandatCourant(); if(m){ m.etat=b.dataset.e; if(m.etat==='fini'&&!m.fin) m.fin=today(); const p=projDe(m); if(p){ etatVersProjet(p,m.etat); ecrireProjet(p); } save(); render(); } break; }
    case 'm-sup': { const m=S.mands[id]; if(!m) break; const fe=docsDe(id).filter(emise);
      if(fe.length){ toast('Ce mandat a des factures émises : passe-le plutôt en « Terminé »'); break; }
      if(!ed||ed.supM!==id){ ed=ed||{}; ed.supM=id; render(); break; }
      const s=snap(); delete S.mands[id]; Object.values(S.heures).forEach(h=>{ if(h.mandat===id) delete S.heures[h.id]; }); Object.values(S.docs).forEach(d=>{ if(d.mandat===id) delete S.docs[d.id]; }); Object.values(S.liens).forEach(l=>{ if(l.mandat===id) delete S.liens[l.id]; });
      if(S.chrono&&S.chrono.mandat===id) S.chrono=null; ed=null; save(); retour(); toast('« '+m.nom+' » supprimé','Annuler',()=>restaurer(s)); break; }
    case 't-faites': ui.tf=!ui.tf; render(); break;
    case 'tache': { const m=mandatCourant(); if(!m) break; const tid=b.dataset.tid; if(projDe(m)){ const i=+tid.slice(1); majTaches(m,L=>{ if(L[i]) L[i].d=!L[i].d; }); render(); break; } const t=(m.taches||[]).find(x=>x.id===tid); if(t){ t.fait=!t.fait; t.le=t.fait?today():null; save(); render(); } break; }
    case 't-sup': { const m=mandatCourant(); if(!m) break; if(projDe(m)){ const i=+b.dataset.tid.slice(1); let t=null; majTaches(m,L=>{ t=L.splice(i,1)[0]; }); render(); if(t) toast('Tâche supprimée','Annuler',()=>{ majTaches(m,L=>{ L.splice(i,0,t); }); render(); }); break; } const i=(m.taches||[]).findIndex(x=>x.id===b.dataset.tid); if(i<0) break; const [t]=m.taches.splice(i,1); save(); render(); toast('Tâche supprimée','Annuler',()=>{ m.taches.splice(i,0,t); save(); render(); }); break; }
    case 'm-tache': fermer(); setTimeout(()=>{ const i=document.getElementById('t-new'); if(i){ i.scrollIntoView({block:'center'}); i.focus(); } },120); break;
    case 'tout-h': ui.toutH=!ui.toutH; render(); break;
    case 'contact': ouvrirContact(id); break;
    case 'contact-new': ouvrirContact(null); break;
    case 'sauver-contact': sauverContact(); break;
    case 'sup-contact': { if(!ed.conf){ lireContact(); ed.conf=true; vContact(); break; } const cid=ed.id; delete S.conts[cid]; Object.values(S.mands).forEach(m=>{ if(m.client===cid) m.client=''; }); save(); fermer(); render(); toast('Contact supprimé'); break; }
    case 'heure': ouvrirHeure(id); break;
    case 'heure-new': ouvrirHeure(null,id); break;
    case 'e-dur': { const n=+b.dataset.n, i=document.getElementById('e-duree'); i.value=n%60?Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):String(n/60); document.getElementById('e-dur-l').textContent='= '+fH(n); break; }
    case 'sauver-heure': sauverHeure(); break;
    case 'sup-heure': { if(!ed.conf){ lireHeure(); ed.conf=true; vHeure(); break; } const s=snap(); delete S.heures[ed.id]; save(); fermer(); render(); toast('Heures supprimées','Annuler',()=>restaurer(s)); break; }
    case 'sem': ui.sem=Math.min(0,ui.sem+(+b.dataset.n)); render(); break;
    case 'sem0': ui.sem=0; render(); break;
    case 'chrono-m': ui.chronoM=id; render(); break;
    case 'chrono-go': if(!$scrim.hidden) fermer(); chronoStart(id); break;
    case 'chrono-stop': chronoStop(false); break;
    case 'chrono-annuler': { const c=S.chrono; S.chrono=null; save(); render(); toast('Chrono annulé','Reprendre',()=>{ S.chrono=c; save(); render(); }); break; }
    case 'seg': ui.seg=b.dataset.s; render(); break;
    case 'voir': ui[b.dataset.cle]=true; render(); break;
    case 'an': ui.an=Math.min(new Date().getFullYear(),ui.an+(+b.dataset.n)); render(); break;
    case 'doc': if(S.docs[id]) allerPage('doc',id); break;
    case 'doc-new': { const d=creerDoc(b.dataset.type,id,false); allerPage('doc',d.id); break; }
    case 'nd-type': ed.d.mandat=val('e-mandat'); ed.d.type=b.dataset.t; vNouveauDoc(); break;
    case 'nd-creer': { const mid=val('e-mandat'); if(!S.mands[mid]){ toast('Choisis un mandat'); break; } const d=creerDoc(ed.d.type,mid,ed.d.type==='facture'); allerPage('doc',d.id); break; }
    case 'facturer': { const d=creerDoc('facture',id,true); allerPage('doc',d.id); toast('Facture préparée avec les heures non facturées'); break; }
    case 'apercu': vApercu(id); break;
    case 'imprimer': imprimer(id); break;
    case 'd-envoyee': case 'd-envoye': { const d=S.docs[id]; d.etat=act==='d-envoyee'?'envoyee':'envoye'; d.envoye_le=today(); save(); render(); break; }
    case 'd-etat-brouillon': case 'd-rouvrir': { const d=S.docs[id]; d.etat=d.type==='facture'?'brouillon':'envoye'; save(); render(); break; }
    case 'd-accepte': { const d=S.docs[id]; d.etat='accepte'; save(); render(); break; }
    case 'd-refuse': { const d=S.docs[id]; d.etat='refuse'; save(); render(); break; }
    case 'd-impaye': { const d=S.docs[id]; d.etat='envoyee'; d.paye_le=null; d.paiement=null; save(); render(); break; }
    case 'd-retablir': { const d=S.docs[id]; d.etat=d.envoye_le?'envoyee':'brouillon'; save(); render(); break; }
    case 'd-facture': { const dv=S.docs[id], f=creerDoc('facture',dv.mandat,false); f.client=dv.client; f.objet=dv.objet; f.intro=''; f.lignes=(dv.lignes||[]).map(l=>({id:uid(),desc:l.desc,qte:l.qte,unite:l.unite,prix:l.prix})); f.devis=dv.id; dv.facture=f.id; if(dv.etat!=='accepte') dv.etat='accepte'; save(); allerPage('doc',f.id); toast('Facture créée depuis le devis '+dv.num); break; }
    case 'd-dup': { const s=S.docs[id], d=creerDoc(s.type,s.mandat,false); Object.assign(d,{client:s.client,objet:s.objet,intro:s.intro,note:s.note,lignes:(s.lignes||[]).map(l=>({id:uid(),desc:l.desc,qte:l.qte,unite:l.unite,prix:l.prix}))}); save(); allerPage('doc',d.id); toast('Copie créée : '+d.num); break; }
    case 'd-sup': case 'd-annuler': { const d=S.docs[id]; if(!ed||ed.supD!==id){ ed=ed||{}; ed.supD=id; render(); break; } ed=null;
      if(act==='d-annuler'){ d.etat='annulee'; save(); render(); toast('Facture annulée'); break; }
      const s=snap(); delete S.docs[id]; Object.values(S.docs).forEach(x=>{ if(x.facture===id) x.facture=null; }); save(); retour(); toast(d.num+' supprimé','Annuler',()=>restaurer(s)); break; }
    case 'l-add': { const d=docCourant(); if(!d) break; const m=S.mands[d.mandat], l={id:uid(),desc:'',qte:'1',unite:'',prix:''}; d.lignes=d.lignes||[]; d.lignes.push(l); save(); render(); focus1('lf-'+l.id+'-desc'); break; }
    case 'l-heures': { const d=docCourant(); if(d&&ajouterHeures(d)){ save(); render(); } break; }
    case 'l-forfait': { const d=docCourant(); const m=d&&S.mands[d.mandat]; if(!m) break; const l={id:uid(),desc:'Travail (estimation)',qte:'',unite:'h',prix:String(tarifDe(m))}; d.lignes.push(l); save(); render(); focus1('lf-'+l.id+'-qte'); break; }
    case 'l-materiel': { const d=docCourant(); const m=d&&S.mands[d.mandat]; if(!m) break; const rt=reprises('tx');
      txDe(m.id).filter(t=>proMontant(t)<0&&!rt.has(t.id)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>d.lignes.push({id:uid(),desc:'Matériel'+(t.tiers?' – '+t.tiers:'')+' ('+fDate(t.date)+')',qte:'1',unite:'forfait',prix:String(Math.abs(proMontant(t))),src:{tx:[t.id]}}));
      save(); render(); break; }
    case 'l-sup': { const d=docCourant(); if(!d) break; const i=d.lignes.findIndex(l=>l.id===b.dataset.lid); if(i<0) break; const [l]=d.lignes.splice(i,1); save(); render(); toast('Ligne supprimée','Annuler',()=>{ d.lignes.splice(i,0,l); save(); render(); }); break; }
    case 'l-haut': { const d=docCourant(); if(d) bougerLigne(d,b.dataset.lid,-1); break; }
    case 'l-bas': { const d=docCourant(); if(d) bougerLigne(d,b.dataset.lid,1); break; }
    case 'payer': vPayer(id); break;
    case 'p-tx': { ed.tx=b.dataset.tx; const t=B.tx[ed.tx]; ed.date=t?t.date:val('p-date')||today(); vPayer(ed.id); break; }
    case 'p-ok': { const d=S.docs[ed.id]; marquerPayee(d,ed.tx,val('p-date')||today()); fermer(); render(); toast(d.num+' payée 👏'); break; }
    case 'payer-auto': { const d=S.docs[id], t=B.tx[b.dataset.tx]; if(!d||!t) break; const s=snap(); marquerPayee(d,t.id,t.date); render(); toast(d.num+' payée 👏','Annuler',()=>restaurer(s)); break; }
    case 'rattacher': if(!$scrim.hidden&&ed&&ed.k==='actm') ed=null; vRattacher(id); break;
    case 'r-tout': ed.tout=b.dataset.v==='1'; vRattacher(ed.id); break;
    case 'r-vieux': ed.vieux=!ed.vieux; vRattacher(ed.id); break;
    case 'r-tx': { const tx=b.dataset.tx; if(S.liens[tx]&&S.liens[tx].mandat===ed.id) delete S.liens[tx]; else S.liens[tx]={id:tx,mandat:ed.id}; save(); vRattacher(ed.id); render(); break; }
    case 'justif': vJustif(b.dataset.tx); break;
    case 'delier': { const tx=b.dataset.tx, l=S.liens[tx]; if(!l) break; delete S.liens[tx]; save(); render(); toast('Opération détachée','Annuler',()=>{ S.liens[tx]=l; save(); render(); }); break; }
    case 'trier': ed=null; vTrier(); break;
    case 't-vieux': ed.vieux=!ed.vieux; ed.conf=false; vTrier(); break;
    case 't-lier': { const tx=b.dataset.tx; S.liens[tx]={id:tx,mandat:id||null}; ed.conf=false; save(); vTrier(); render(); break; }
    case 't-tout': { if(!ed.conf){ ed.conf=true; vTrier(); break; } const s=snap(), L=aTrier(0,ed.vieux); L.forEach(t=>{ S.liens[t.id]={id:t.id,mandat:null}; }); ed.conf=false; save(); vTrier(); render(); toast(pl(L.length,'opération ignorée','opérations ignorées'),'Annuler',()=>{ restaurer(s); if(ed&&ed.k==='trier') vTrier(); }); break; }
    case 'sauver-regl': sauverRegl(); break;
    case 'synchro': syncErr=''; setSync(); Promise.all([pull().then(()=>push()),bPull()]).then(()=>{ if(ed&&ed.k==='regl') vReglages(); }); break;
    case 'export': exporter(); break;
    case 'logout': if(!confirm('Te déconnecter ?'+(dirty.size?' '+pl(dirty.size,'changement')+' ne sont pas encore envoyés.':''))) return;
      try{ localStorage.removeItem(CK()); localStorage.removeItem(BK()); }catch(err){} UID=null; sb.auth.signOut().finally(()=>location.reload()); break;
  }
});

  const d=docCourant(); if(!d) return;

});

function semer(){ const pros=Object.values(B.cats).filter(c=>c.parent==='pro'&&!c.archive).sort((a,b)=>(a.ordre||0)-(b.ordre||0)); let i=0;
  if(pros.length){ for(const c of pros){ const id=slug(c.nom)||c.id, d=ACTS0.find(x=>x[0]===id); S.acts[id]={id,nom:c.nom,emoji:d?d[2]:'⛏️',couleur:d?d[3]:MINERAIS[i%MINERAIS.length][1],cat:c.id,tarif:'',ordre:i,ignorer:id==='gdt'}; i++; } }
  else ACTS0.forEach(([id,nom,emoji,couleur])=>{ S.acts[id]={id,nom,emoji,couleur,cat:'pro.'+id,tarif:'',ordre:i++,ignorer:id==='gdt'}; }); }

async function enter(user){
  UID=user.id; EMAIL=user.email||''; document.getElementById('login').hidden=true;
  let c=null; try{ c=JSON.parse(localStorage.getItem(CK())||'null'); }catch(e){}
  if(c){ prev=c.prev||{}; dirty=new Set(c.dirty||[]); lastPull=c.lastPull||null; }
  bCharger(); S=fromRows(prev);
  PB=Projets.base(sb,UID); PB.surChangement(()=>{ if(!booted) return; if(relierDepuisProjets()) save(); render(); });
  booted=true; render(); setSync();
  await Promise.all([bPull(!bLast),pull(!c),PB.tirer()]);
  if(relierDepuisProjets()) save(); render();
  push(); PB.pousser();
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); const mail=document.getElementById('l-mail').value.trim(), pass=document.getElementById('l-pass').value;
  try{ const {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass}); if(error) throw error; await enter(data.user); }
  catch(err){ showLogin('Connexion impossible : '+((err&&err.message)||err)); }
});
async function start(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('../sw.js',{scope:'../'}); }catch(e){} }
  if(!window.supabase||!window.supabase.createClient){ $view.innerHTML='<div class="vide">Impossible de charger l’app. Recharge la page.</div>'; return; }
  try{ if(!localStorage.getItem('orga-auth')&&localStorage.getItem('etabli-auth')) localStorage.setItem('orga-auth',localStorage.getItem('etabli-auth')); }catch(e){}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'orga-auth'}});
  let session=null; try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(session&&session.user) await enter(session.user); else showLogin();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'&&UID){ UID=null; showLogin(); } });
  addEventListener('online',()=>{ setSync(); pull().then(()=>push()); bPull(); if(PB){ PB.tirer(); PB.pousser(); } });
  addEventListener('offline',()=>setSync());
  document.addEventListener('visibilitychange',()=>{ if(!UID) return; if(document.visibilityState==='visible'){ pull().then(()=>push()); bPull(); if(PB) PB.tirer(); } else { save(); push(); if(PB) PB.pousser(); } });
  setInterval(()=>{ if(UID&&document.visibilityState==='visible'){ pull(); bPull(); if(PB) PB.tirer(); } },60000);
}
render(); start();
</script>
