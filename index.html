<style>
/* Accueil du jour de Locus (étape 9, maquette validée le 18.11).
   Les cartes changent avec la journée : une app qui a quelque chose pour aujourd'hui prend une grande carte,
   sinon elle reste un petit carré. Le nom de l'app est toujours écrit. Le lundi (et le dimanche, le mardi tant que
   ce n'est pas fait), une tuile ouvre la routine du lundi en plein écran. */
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,textarea{font:inherit;color:inherit}
main{max-width:760px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.ligne{display:flex;gap:8px}
.ligne input{flex:1;min-width:0;height:48px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--pill);padding:0 16px;font-size:15px}
.ligne input::placeholder{color:var(--ink-3);opacity:.8}
.sem-n{flex:none;width:48px;height:48px;border-radius:14px;background:#17141C;color:#F3F1E7;display:grid;place-items:center;font:700 24px/1 var(--f-display);letter-spacing:-.04em;border:0;padding:0;cursor:pointer}
.rondb{flex:none;border:0;width:48px;height:48px;border-radius:var(--pill);background:var(--accent);color:var(--on-acc);display:grid;place-items:center;cursor:pointer}
.rondb .ic{width:20px;height:20px}
.obj{background:var(--accent);color:var(--on-acc);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.obj .eyebrow{color:color-mix(in srgb,var(--on-acc) 75%,transparent)}
.obj b{font-weight:600}
.obj span{font-size:13.5px}
.obj .conseil{font-style:italic}
.bienvenue{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bienvenue>span{font-size:14px;color:var(--ink-2,var(--ink))}
.bienvenue .choix2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bienvenue button{border:0;border-radius:14px;background:var(--surface-2);color:var(--ink);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;font:600 15px var(--f-body);cursor:pointer}
.bienvenue button small{font:400 12.5px/1.3 var(--f-body);color:var(--ink-3)}
.obj-vide{border:1.5px dashed color-mix(in srgb,var(--accent) 70%,transparent);background:none;color:var(--ink-2,var(--ink));border-radius:16px;padding:12px 16px;font:600 14px var(--f-body);text-align:left;cursor:pointer}
/* une app au premier plan sur l'accueil (cadre transparent, commun/cadre.js) */
.dans-fond{position:fixed;inset:0;z-index:69;background:rgba(20,16,28,.45);display:grid;place-items:center}
.dans-fond.vu{background:transparent;pointer-events:none}
.dans-fond .att{width:34px;height:34px;border-radius:99px;border:3px solid var(--accent);border-right-color:transparent;animation:tour 0.8s linear infinite}
.dans-fond.vu .att{display:none}
@keyframes tour{to{transform:rotate(360deg)}}
iframe.dans{position:fixed;inset:0;z-index:70;width:100%;height:100%;border:0;background:transparent;opacity:0;pointer-events:none;transition:opacity .12s}
iframe.dans.actif.vu{opacity:1;pointer-events:auto}
.dans-x{position:fixed;z-index:72;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:40px;height:40px;border:0;border-radius:99px;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;cursor:pointer}
.dans-x .ic{width:16px;height:16px}
.tuile-sem{display:flex;align-items:center;gap:14px;background:var(--on-page);color:var(--on-acc);border:0;border-radius:20px;padding:16px;text-align:left;cursor:pointer;width:100%}
.tuile-sem .pl{width:50px;height:50px;border-radius:15px;background:var(--page);color:var(--on-page);display:grid;place-items:center;flex:none}
.tuile-sem .pl .ic{width:22px;height:22px}
.tuile-sem .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.tuile-sem b{font:700 17px/1.15 var(--f-display);letter-spacing:-.02em}
.tuile-sem small{font-size:13px;color:var(--page)}
.apps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.carre{grid-column:span 2}
.carte{grid-column:1/-1;background:var(--page);color:var(--on-page);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on-page) 10%,transparent)}
.c-tete{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}

.proj .em{font-size:20px;line-height:1}
.proj .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.proj b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .pt{width:10px;height:10px;border-radius:3px;flex:none}
.seance{display:flex;align-items:center;gap:12px}
.seance .tx{flex:1;min-width:0;display:flex;flex-direction:column}

.btn-acc{border:0;height:40px;padding:0 16px;border-radius:var(--pill);background:var(--accent);color:var(--on-acc);font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;flex:none}

.note{color:var(--on-page-2);font-size:13px;margin:0}
.lien-r{align-self:center;border:0;background:none;color:var(--on-page-2);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
/* connexion */
.login{max-width:380px;margin:30px auto;display:flex;flex-direction:column;gap:10px}
.login h2{margin:0;font:700 24px/1.1 var(--f-display);letter-spacing:-.02em}
.login input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px}
.login button{height:46px;border:0;border-radius:var(--pill);background:var(--accent);color:var(--on-acc);font-weight:600;cursor:pointer}
.login .err{color:#F2B8B5}

.plein{position:fixed;inset:0;z-index:60;background:var(--page);color:var(--on-page);display:flex;flex-direction:column;overflow:hidden}

.plein .corps{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;max-width:760px;width:100%;margin:0 auto}
.plein nav.pied{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto}

.pied .sec{background:none;border:1px solid var(--line);color:var(--on-page)}
.pied .pri{flex:1;border:0;background:var(--accent);color:var(--on-acc)}
.points{display:flex;gap:6px}
.points span{width:8px;height:8px;border-radius:99px;background:var(--line)}
.points span.on{background:var(--accent)}
.points span.ici{width:22px}
.titre{display:flex;flex-direction:column;gap:4px}

.echelle{display:flex;flex-direction:column;gap:6px}

.choix{display:flex;gap:4px}
.choix button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.choix button[aria-pressed="true"]{background:var(--accent);color:var(--on-acc);border-color:var(--accent)}

.idee{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.idee .t{font-size:15px}

.idee select{background:var(--surface-2);max-width:100%}
.idee .act button.disc{border:0;padding:6px 3px;color:var(--ink-3);font-size:12px}
.idee .act button.ranger{background:#C3B6DF;color:#2A2440;border-color:transparent;font-weight:700;padding:7px 13px}
.idee .act button.app{background:var(--page);color:var(--on-page);border-color:transparent;font-weight:600;padding:6px 11px}
.idee .act .ressort{flex:1}
.idee .act button.disc.ico{display:inline-flex;align-items:center;padding:6px 5px}
.idee .act .droite{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--ink);max-width:100%}
.chip[aria-pressed="true"]{outline:2px solid var(--on-page);outline-offset:2px}
.chip.forge{background:#2A2420;color:#EFE3CC}
.jour{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer}
.jour .j{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;width:58px;white-space:nowrap;padding-top:6px;color:var(--ink-3);flex:none;text-transform:uppercase}
.jour .chips{flex:1;min-height:30px}
.jour .libre{color:var(--ink-3);font-size:13px;padding-top:5px}
.jour.cible{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.jour.tl{align-items:stretch;padding:5px 0;gap:6px}
.jour.tl .j{width:44px;font-size:11px;padding-top:3px}
.piste{position:relative;flex:1;min-width:0;border-radius:6px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / 7.5) 100%;background-position:calc(100% / 15) 0}

'use strict';
/* =====================================================================================================
   Accueil du jour (étape 9, 18.11.2026). Ce qu'il lit, en lecture seule sauf mention :
     rows        projets de l'Établi (Projets.base) : projets du jour = Projets.places(p) contient aujourd'hui.
                 La routine du lundi écrit p.days / p.weeks (placer la semaine).
     biblio_rows vide-tête (racine 'vide'), journal 'j:<semaine>' (objectifs), bilan 'w:<semaine>', 's:routine'.
                 L'accueil écrit : nouvelles idées du vide-tête, rangement, bilan, évaluation des objectifs (w:.obj),
                 une ligne au journal, 's:routine' { fait: [semaines] }.
     carnet      'locus/semaines' : les séances de la Forge de cette semaine et de la suivante, publiées par la Forge.
                 La routine écrit le jour d'une séance dans 'logs/<semaine>' (sessions[id].day = 0…6).
     mine_rows   's:chrono' : le chrono en cours.
   Passage vers une app (« locus-vers » dans sessionStorage, lu une fois par l'app) : Marché (ajout), Banque (saisie),
   Forge (démarrer une séance), Bibliothèque (aller à une ligne).
   ===================================================================================================== */
const SB_URL='https://rzcpjsffpvuvbdtqymms.supabase.co', SB_KEY='sb_publishable_mJNXDji0NMOmLFqo3GusGg_JBkFhJmC';
const P=k=>window.Pictos?Pictos.svg(k):'', PL=k=>window.Pictos?Pictos.plaque(k):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{ const a=String(s).split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); };
const plusJ=(s,n)=>{ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const plain=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function wkKey(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-dn+3); const y=t.getUTCFullYear(); const f=new Date(Date.UTC(y,0,4)); const w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7); return y+'-W'+pad(w); }
const wkNum=k=>Number(String(k).split('-W')[1]);
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS=['lun','mar','mer','jeu','ven','sam','dim'];
function wkLabel(k){ const m=parse(Projets.lundi(k)), e=parse(plusJ(Projets.lundi(k),6)); return 'S'+wkNum(k)+' ('+m.getDate()+(m.getMonth()!==e.getMonth()?' '+MOIS[m.getMonth()]:'')+' – '+e.getDate()+' '+MOIS[e.getMonth()]+')'; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>{ t.hidden=true; },2600); }
function vers(app,o,href){ try{ sessionStorage.setItem('locus-vers',JSON.stringify(Object.assign({app},o||{}))); }catch(e){} location.href=href||app+'/'; }

/* --------- les jours --------- */
const AUJ=()=>iso(new Date());
const CUR=()=>wkKey(new Date());
/* la semaine que la routine prépare : dimanche → la suivante ; lundi et mardi → celle qui commence */
/* la semaine qu'on modifie : celle de la routine, ou la semaine en cours dans la vue « Semaine » (24.11) */
const semActive=()=>VUE_SEM?CUR():semaineRoutine();
const revoir=()=>VUE_SEM?vSemaineVue():vRoutine();
function semaineRoutine(){ const d=new Date(), j=d.getDay(); if(j===0){ const x=new Date(d); x.setDate(x.getDate()+1); return wkKey(x); } return wkKey(d); }
const semainePrec=k=>wkKey(parse(plusJ(Projets.lundi(k),-7)));
/* la tuile « Démarrer la semaine » : dès le lundi 6 h, jusqu'à ce que la routine soit faite (ampoule de Nicolas, 23.11) */
const jourRoutine=()=>{ const d=new Date(), j=d.getDay(); return j!==0&&!(j===1&&d.getHours()<6); };

let sb=null, UID=null, PB=null, AB=null;
let B={}; /* biblio_rows utiles : clé → données */
let FORGE=null, CHRONO=null, sync='';
const LS=()=>'locus-accueil-'+UID;
function garder(){ try{ localStorage.setItem(LS(),JSON.stringify({B,FORGE,CHRONO})); }catch(e){} }
function reprendre(){ try{ const c=JSON.parse(localStorage.getItem(LS())||'null'); if(c){ B=c.B||{}; FORGE=c.FORGE||null; CHRONO=c.CHRONO||null; } }catch(e){} }
const lignes=p=>Object.entries(B).filter(([k,v])=>k.startsWith('n:')&&v&&v.p===p&&!v.a).map(([,v])=>v).sort((a,b)=>(a.o||0)-(b.o||0));

/* écritures : tout de suite en local, puis vers Supabase ; ce qui n'est pas parti réessaie (file « locus-attente ») */
function attente(){ try{ return JSON.parse(localStorage.getItem('locus-attente-'+UID)||'[]'); }catch(e){ return []; } }
function setAttente(L){ try{ localStorage.setItem('locus-attente-'+UID,JSON.stringify(L)); }catch(e){} }
async function envoyer(table,key,data){
  const L=attente().filter(x=>!(x.table===table&&x.key===key)); L.push({table,key,data}); setAttente(L); await vider(); }
let envoi=false;
async function vider(){
  if(envoi||!sb||!UID||!navigator.onLine) return; const L=attente(); if(!L.length) return; envoi=true;
  try{ for(const x of L){ const {error}=await sb.from(x.table).upsert({user_id:UID,key:x.key,data:x.data,deleted:x.data==null},{onConflict:'user_id,key'}); if(error) throw error;
      setAttente(attente().filter(y=>!(y.table===x.table&&y.key===x.key&&JSON.stringify(y.data)===JSON.stringify(x.data)))); } sync=''; }
  catch(e){ sync=(e&&e.message)||String(e); setTimeout(vider,15000); }
  envoi=false; }
function ecrireB(key,data){ if(data==null) delete B[key]; else B[key]=data; garder(); envoyer('biblio_rows',key,data); }

/* --------- lecture --------- */
async function tirer(){
  if(!sb||!UID||!navigator.onLine) return;
  const N=semaineRoutine(), Pr=semainePrec(N), C=CUR();
  const racines=['vide','taches','j:'+C,'j:'+Pr,'j:'+N];
  try{
    const [a,b,f,m]=await Promise.all([
      sb.from('biblio_rows').select('key,data').like('key','n:%').eq('deleted',false).in('data->>p',racines),
      sb.from('biblio_rows').select('key,data,deleted').in('key',['w:'+Pr,'w:'+C,'s:routine','h:'+N,'h:'+C]),
      sb.from('carnet').select('data,deleted').eq('key','locus/semaines').maybeSingle(),
      sb.from('mine_rows').select('data,deleted').eq('key','s:chrono').maybeSingle(),
      sb.from('marche_rows').select('data').like('key','c:%').eq('deleted',false)]).then(r=>{ const c=r[4]; if(c&&!c.error){ MARCHE_C=(c.data||[]).map(x=>x.data).filter(Boolean); MARCHE_MOTS=null; } return r; });
    if(a.error) throw a.error;
    const nB={}; (a.data||[]).forEach(r=>{ if(r.data) nB[r.key]=r.data; }); (b.data||[]).forEach(r=>{ if(r.data&&!r.deleted) nB[r.key]=r.data; });
    attente().filter(x=>x.table==='biblio_rows').forEach(x=>{ if(x.data==null) delete nB[x.key]; else nB[x.key]=x.data; });
    B=nB;
    if(!f.error) FORGE=f.data&&!f.data.deleted?f.data.data:FORGE;
    if(!m.error) CHRONO=m.data&&!m.data.deleted?m.data.data:null;
    sync=''; garder();
  }catch(e){ sync=(e&&e.message)||String(e); }
}
function forge(){ let loc=null; try{ loc=JSON.parse(localStorage.getItem('locus-forge')||'null'); }catch(e){} if(loc&&(!FORGE||String(loc.le)>String(FORGE.le))) return loc; return FORGE; }

/* =============================== L'accueil =============================== */
const $main=document.getElementById('main');
function objectifs(k){ const L=lignes('j:'+k).map(n=>String(n.t||'')); const g=re=>{ const l=L.find(x=>re.test(x)); return l?l.replace(re,'').trim():''; };
  return { principal:g(/^objectif principal\s*:\s*/i), secondaire:g(/^objectif secondaire\s*:\s*/i), conseil:g(/^conseil(?: perso)?\s*:\s*/i) }; }
function projetsDuJour(){ if(!PB) return []; const a=AUJ(); return PB.liste().filter(p=>!p.closed&&!p.later&&Projets.places(p).includes(a)).sort((x,y)=>(y.imp||0)-(x.imp||0)); }
function prochaine(p){ const u=Projets.etapeUne(p); return u?u.t:''; } /* « étape n°1 » : première tâche pas faite de l'arbre (25.11) */
/* tâches placées sur aujourd'hui (ou avant, pas faites), et celles cochées aujourd'hui */
function tachesDuJour(){ const a=AUJ(); return lignes('taches').filter(n=>n.jour&&(n.x?n.xLe===a&&n.jour<=a:n.jour<=a)).sort((x,y)=>(x.jour<y.jour?-1:x.jour>y.jour?1:0)); }
/* l'entraînement reste sur l'accueil tant qu'il n'est pas terminé (ampoule du 24.11) : commencé (quel que soit son jour),
   prévu aujourd'hui, ou prévu un jour passé de la semaine et pas fait ; le commencé d'abord, puis aujourd'hui, puis le retard */
function seancesDuJour(){ const f=forge(); if(!f||!f.semaines) return []; const L=f.semaines[CUR()]||[], j=(new Date().getDay()+6)%7;
  const rang=s=>s.run?0:s.day===j?1:2;
  return L.filter(s=>!s.done&&(s.run||(typeof s.day==='number'&&s.day<=j))).map(s=>Object.assign({},s,{retard:!s.run&&s.day<j})).sort((a,b)=>rang(a)-rang(b)||(a.day??9)-(b.day??9)); }
/* protéines du jour, calculées par la Forge d'après les séances placées et faites (25.11) */
function protJour(){ const f=forge(); return (f&&f.prot&&f.prot[AUJ()])||null; }
const fmtMin=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):''):m+' min';
function chronoTxt(){ if(!CHRONO||!CHRONO.debut) return ''; const m=Math.max(0,Math.floor((Date.now()-new Date(CHRONO.debut))/60000)); return Math.floor(m/60)+':'+pad(m%60); }

function carre(app,nom,href,bouton){ return `<article class="carre" data-lieu="${app}"><a href="${href}">${PL(app)}<span class="nom">${nom}</span></a>${bouton||''}</article>`; }
function vAccueil(){
  const N=semaineRoutine(), fait=((B['s:routine']||{}).fait||[]).includes(N);
  const o=objectifs(CUR()), P_=projetsDuJour(), S_=seancesDuJour(), pj=protJour();
  /* « Mon Locus » (25.11) : modules affichés, noms, menu épuré ou détaillé, palette (commun/profil.js) */
  const PRF=prof(), epure=PRF&&PRF.menu==='epure', act=id=>!window.LocusProfil||LocusProfil.actif(PRF,id), nm=id=>window.LocusProfil?LocusProfil.nom(PRF,id):id;
  appliquerPalette(PRF);
  let h='';
  if(!profilChoisi()) h+=`<section class="bienvenue"><b>Bienvenue dans Locus</b><span>Comment veux-tu ton accueil ? Tu pourras tout changer dans les Réglages, « Mon Locus ».</span><div class="choix2"><button type="button" data-style-init="village"><b>Village</b><small>Chaque app est un lieu, l’accueil montre ta journée</small></button><button type="button" data-style-init="neutre"><b>Neutre</b><small>Des noms simples, un accueil épuré</small></button></div></section>`;
  if(act('semaine')&&(epure||jourRoutine()&&!fait)) h+=`<button class="tuile-sem" type="button" id="b-routine"><span class="pl">${P('lecture')}</span><span class="tx"><b>${esc(nm('semaine'))}</b><small>${epure?(fait?'Faite cette semaine':'À faire cette semaine'):PRF&&PRF.style==='neutre'?'Vide-tête, tâches, semaine':'Humeur, journal, boîtes, Banque, vide-tête, tâches, semaine, puis Claude'}</small></span>${P('suivant')}</button>`;
  h+=`<form class="ligne" id="f-vide" autocomplete="off"><button type="button" class="sem-n" id="b-semaine" title="Voir la semaine ${wkNum(CUR())}" aria-label="Voir le planning de la semaine ${wkNum(CUR())}">${wkNum(CUR())}</button><input id="i-vide" placeholder="Vide-tête : une idée, un truc à ne pas oublier…" aria-label="Noter dans le vide-tête" enterkeyhint="send"><button class="rondb" type="submit" aria-label="Noter">${P('plus')}</button></form>`;
  /* les objectifs se notent / se corrigent ici (25.11 : avant, il fallait les écrire dans le journal de la Bibliothèque) */
  if(!epure&&(o.principal||o.secondaire||o.conseil)) h+=`<section class="obj" id="b-obj" role="button" tabindex="0" style="cursor:pointer" aria-label="Objectifs de la semaine, toucher pour modifier"><span class="eyebrow">Objectif de la semaine</span>${o.principal?`<b>${esc(o.principal)}</b>`:''}${o.secondaire?`<span>${esc(o.secondaire)}</span>`:''}${o.conseil?`<span class="conseil">${esc(o.conseil)}</span>`:''}</section>`;
  else if(!epure&&(!PRF||PRF.style!=='neutre')) h+=`<button type="button" class="obj-vide" id="b-obj">+ Noter les objectifs de la semaine ${wkNum(CUR())}</button>`;
  const grandes=[], carres=[];
  if(act('etabli')&&!epure&&P_.length) grandes.push(`<article class="carte" data-lieu="etabli"><a class="c-tete" href="etabli/">${PL('etabli')}<h2>${esc(nm('etabli'))}</h2><span class="eyebrow">Aujourd’hui</span></a>${P_.map(p=>{ const t=prochaine(p); return `<a class="proj" href="etabli/#p:${esc(p.id)}" data-dans="etabli" data-hash="p:${esc(p.id)}"><span class="em">${esc(p.emoji||'')}</span><span class="tx"><b>${esc(p.name)}</b><small>${Projets.nature(p)==='pro'?'Pro':'Perso'}${t?' · '+esc(t):''}</small></span><span class="pt" style="background:${esc(p.color||'#888')}"></span></a>`; }).join('')}</article>`);
  else if(act('etabli')) carres.push(carre('etabli',nm('etabli'),'etabli/'));
  if(act('forge')&&!epure&&S_.length) grandes.push(`<article class="carte" data-lieu="forge"><a class="c-tete" href="forge/">${PL('forge')}<h2>${esc(nm('forge'))}</h2><span class="eyebrow">${S_.some(s=>s.run)?'En cours':S_.length>1?'Entraînements':'Entraînement'}</span></a>${S_.map(s=>`<div class="seance"><span class="tx"><b>${esc(s.t)}</b><small>${[s.min?'≈ '+fmtMin(s.min):'',s.run?'commencée':s.retard?'prévue '+JOURS[s.day]+', pas encore faite':''].filter(Boolean).join(' · ')}</small></span><button class="btn-acc" type="button" data-forge="${esc(s.id)}">${P('lecture')}${s.run?'Reprendre':'Démarrer'}</button></div>`).join('')}${pj?`<a class="prot-j" href="forge/#nutrition"><span class="eyebrow">Protéines du jour</span><b>${pj.g} g</b><small>${esc(pj.l)}</small></a>`:''}</article>`);
  else if(act('forge')) carres.push(carre('forge',nm('forge'),'forge/',epure?'':pj?`<a class="prot-c" href="forge/#nutrition" title="Protéines du jour : ${esc(pj.l)}"><b>${pj.g} g</b><small>protéines</small></a>`:''));
  const marche=(`<article class="carte" data-lieu="marche" style="grid-column:span MARCHE"><a class="c-tete" href="marche/">${PL('marche')}<h2>${esc(nm('marche'))}</h2></a><form class="ligne" id="f-marche" autocomplete="off"><input id="i-marche" placeholder="Un achat à faire…" aria-label="Ajouter un achat au Marché" enterkeyhint="send" autocapitalize="sentences"><button class="rondb" type="submit" aria-label="Ajouter">${P('plus')}</button></form></article>`);
  const ch=chronoTxt();
  if(act('mine')) carres.push(carre('mine',nm('mine'),'mine/',epure?'':`<button class="rond" type="button" id="b-chrono" aria-label="${ch?'Chrono en cours : '+ch:'Démarrer le chrono'}">${ch?esc(ch):P('lecture')}</button>`));
  if(act('banque')) carres.push(carre('banque',nm('banque'),'banque/',epure?'':`<button class="rond" type="button" id="b-saisie" aria-label="Nouvelle opération">${P('plus')}</button>`));
  /* plus de carte « Tâches du jour » : les tâches sont sur la feuille du lundi (ampoule du 24.11) */
  if(act('bibliotheque')) carres.push(carre('bibliotheque',nm('bibliotheque'),'bibliotheque/'));
  const avecMarche=act('marche')&&!epure; if(act('marche')&&epure) carres.push(carre('marche',nm('marche'),'marche/'));
  /* le Marché prend 2/3 ou toute la largeur, pour que les carrés remplissent leurs lignes (demande de Nicolas, 18.11) :
     grille de 6 ; un carré = 2. S'il reste 2 carrés seuls sur la dernière ligne, ils prennent la moitié chacun. */
  const n=carres.length, mL=avecMarche?(n%3===1?4:6):0;
  let reste=mL===4?n-1:n; const fin=reste%3===2;
  const cs=carres.map((c,i)=>fin&&i>=n-2?c.replace('<article class="carre"','<article class="carre" style="grid-column:span 3"'):c);
  h+=`<div class="apps">${grandes.join('')}${avecMarche?marche.replace('span MARCHE','span '+mL):''}${cs.join('')}</div>`;

  if(sync&&!navigator.onLine) h+=`<p class="note">Hors ligne : ce que tu notes partira au retour du réseau.</p>`;
  $main.innerHTML=h;
}

/* =============================== La routine du lundi =============================== */
const $plein=document.getElementById('plein');
const R={etape:1, sel:null, note:null, tri:null, coche:new Set()};
/* ordre voulu par Nicolas (19.11, 20.11, 23.11) : humeur, journal, boîtes à vider, Banque, tâches pas faites, vide-tête, tâches de 2 minutes, agenda, projets, entraînements, tâches, Claude */
const ETAPES=['Ta semaine passée','Le journal','Vider les boîtes','La Banque','Les tâches pas faites','Vider la tête','Les tâches de 2 minutes','L’agenda','Placer les projets','Placer les entraînements','Placer les tâches','Pour Claude'];
const CLES=['humeur','journal','boites','banque','report','vide','deuxmin','agenda','projets','forge','taches','claude'];
/* les étapes de la personne (« Mon Locus », 25.11) : celles cochées, sans celles d'un module coupé */
function etapesActives(){ const p=prof(); let L=CLES.slice(); if(p&&window.LocusProfil){ const a=id=>LocusProfil.actif(p,id);
  L=L.filter(k=>(p.etapes||CLES).includes(k)&&!(k==='banque'&&!a('banque'))&&!(k==='projets'&&!a('etabli'))&&!(k==='forge'&&!a('forge'))); } return L.length?L:['vide']; }
const etapeIci=()=>etapesActives()[R.etape-1];
const BOITES=[['mails','Mails'],['messageries','Messageries'],['sms','SMS'],['appels','Appels'],['courrier','Courrier (tiroir)']];
/* =============================== La semaine en cours (toucher le numéro de semaine, demande de Nicolas, 23.11) ===============================
   Tout le planning : projets sur la semaine entière, puis jour par jour en heures (Proton, projets, séances, tâches). Un projet s'ouvre au premier plan. */
let VUE_SEM=false, VUE_MODIF=false, VUE_OBJ=false;
/* ----- Les objectifs de la semaine (25.11) : trois lignes du journal de la semaine (j:<semaine>, Bibliothèque),
   « Objectif principal : … », « Objectif secondaire : … », « Conseil : … ». Coller le bloc de Claude dans un champ le répartit. */
const OBJ_L=[['principal','Objectif principal',/^objectif principal\s*:\s*/i],['secondaire','Objectif secondaire',/^objectif secondaire\s*:\s*/i],['conseil','Conseil',/^conseil(?: perso)?\s*:\s*/i]];
function ouvrirObjectifs(){ VUE_OBJ=true; VUE_SEM=false; $plein.dataset.e=''; $plein.hidden=false; document.body.style.overflow='hidden'; vObjectifs(); }
function vObjectifs(){ const N=CUR(), o=objectifs(N);
  const champ=([k,l])=>`<label class="eyebrow" for="o-${k}" style="margin-top:6px">${l}</label><textarea class="libre" id="o-${k}" data-obj="${k}" rows="2" style="min-height:64px" placeholder="${k==='conseil'?'Un conseil à toi-même pour la semaine':'…'}">${esc(o[k]||'')}</textarea>`;
  $plein.innerHTML=cadrePlein('Objectifs · S'+wkNum(N),wkLabel(N).replace(/^S\d+ \(|\)$/g,''),`<p class="note">Tu peux coller tout le bloc de Claude dans un des champs (« Objectif principal : … », « Objectif secondaire : … », « Conseil : … ») : il se répartit tout seul. Ils vont dans le journal de la semaine de la Bibliothèque.</p>`+OBJ_L.map(champ).join(''),
    `<button class="sec" type="button" data-r="fermer">Annuler</button><button class="pri" type="button" data-r="objOk">Enregistrer</button>`); }
function repartirObjectifs(el){ const t=el.value; if(!/\n/.test(t)||!OBJ_L.some(([,,re])=>new RegExp(re.source,'im').test(t.split('\n').slice(1).join('\n')))) return;
  const v={}; t.split(/\n+/).map(x=>x.replace(/^[\s•*\-–]+/,'').trim()).forEach(x=>{ for(const [k,,re] of OBJ_L) if(re.test(x)){ v[k]=x.replace(re,'').trim(); return; } });
  OBJ_L.forEach(([k])=>{ const f=document.getElementById('o-'+k); if(f&&v[k]!=null) f.value=v[k]; }); }
function ecrireObjectifs(N,v){ const L=lignes('j:'+N); let o=L.length?Math.min(...L.map(x=>x.o||0)):1;
  OBJ_L.slice().reverse().forEach(([k,l,re])=>{ const t=(v[k]||'').replace(/\s+/g,' ').trim(), n=L.find(x=>re.test(String(x.t||'')));
    if(n){ if(!t) ecrireB('n:'+n.id,null); else if(n.t!==l+' : '+t) ecrireB('n:'+n.id,Object.assign({},n,{t:l+' : '+t})); }
    else if(t){ const x={id:uid(),p:'j:'+N,o:--o,t:l+' : '+t,cree:AUJ()}; ecrireB('n:'+x.id,x); } }); }
function ouvrirSemaine(){ VUE_SEM=true; VUE_MODIF=false; $plein.dataset.e=''; $plein.hidden=false; document.body.style.overflow='hidden'; vSemaineVue();
  const P0=protonLocal(); if(!P0||P0.sem!==CUR()||Date.now()-Date.parse(P0.le||0)>5*60000) chargerProton(CUR()); }
function vSemaineVue(){ const N=CUR(), P0=protonLocal(), y=document.getElementById('corps')?document.getElementById('corps').scrollTop:0;
  const TS=PB?PB.liste().filter(p=>!p.closed&&(p.weeks||[]).includes(N)):[], f=forge(), nf=((f&&f.semaines&&f.semaines[N])||[]).filter(s=>typeof s.day!=='number'&&!s.opt&&!s.done);
  const chipP=p=>`<span class="chip" data-ouvrir="${esc(p.id)}" role="button" style="cursor:pointer;background:${esc(p.color||'#888')};color:${clair(p.color)?'#1E1B18':'#FFFFFF'}">${esc(p.emoji||'')} ${esc(p.name)}</span>`;
  let c='';

  if(el.dataset.coche){ if(el.checked) R.coche.add(el.dataset.coche); else R.coche.delete(el.dataset.coche); if(R.tri&&R.tri.id==='*'&&!R.coche.size) R.tri=null; vRoutine(); return; }
  if(el.dataset.r==='triSel'&&el.value){ if(R.tri){ R.tri.ch.push(el.value); vRoutine(); } return; }
  if(el.dataset.tache){ const n=Object.assign({},B['n:'+el.dataset.tache]); if(!n.id) return; if(el.checked){ n.x=true; n.xLe=AUJ(); } else { delete n.x; delete n.xLe; } ecrireB('n:'+n.id,n); vRoutine(); return; }
  if(el.dataset.r!=='ranger'||!el.value) return; const n=Object.assign({},B['n:'+el.dataset.id]); if(!n.id) return;
  n.p=el.value; n.o=Date.now()/1e6; delete B['n:'+n.id]; ecrireB('n:'+n.id,n); toast('Rangée dans '+el.options[el.selectedIndex].text.trim()); vRoutine(); });

/* =============================== Chercher (commun/chercher.js) =============================== */
/* sur l'accueil : dans toutes les apps ; un élément s'ouvre au premier plan quand c'est possible */
function allerA(x){
  if(x.app==='etabli'&&x.type==='projet'){ ouvrirDans('etabli','','p:'+x.id); return; }
  if(x.app==='etabli') { location.href='bibliotheque/#d:'+x.id; return; }
  if(x.app==='bibliotheque'){ vers('bibliotheque',{id:x.id}); return; }
  if(x.app==='mine'){ try{ localStorage.setItem('mine-tab',x.type==='contact'?'contacts':'mandats'); }catch(e){} location.href='mine/'; return; }
  if(x.app==='forge'){ location.href=x.type==='exo'?'forge/#exos':'forge/#s-'+x.wk; return; }
  location.href=x.app+'/'; }
function ouvrirChercher(){ if(window.LocusChercher) LocusChercher.ouvrir({app:null,surClic:allerA}); }

/* =============================== Accueil : actions =============================== */
document.getElementById('b-chercher').addEventListener('click',()=>{ if(UID) ouvrirChercher(); });
$main.addEventListener('submit',e=>{ e.preventDefault();
  if(e.target.id==='f-vide'){ const i=document.getElementById('i-vide'), v=i.value.trim(); if(!v) return; const L=lignes('vide'); const n={id:uid(),p:'vide',o:L.length?Math.min(...L.map(x=>x.o||0))-1:1,t:v,cree:AUJ()}; ecrireB('n:'+n.id,n); i.value=''; toast('Noté dans le vide-tête'); i.focus(); return; }
  if(e.target.id==='f-marche'){ const i=document.getElementById('i-marche'), v=i.value.trim(); if(!v){ location.href='marche/'; return; } i.value=''; i.blur(); ouvrirDans('marche','q='+encodeURIComponent(v)); return; } });
$main.addEventListener('change',e=>{ const el=e.target; if(!el.dataset||!el.dataset.tacheAcc) return; const n=Object.assign({},B['n:'+el.dataset.tacheAcc]); if(!n.id) return;
  if(el.checked){ n.x=true; n.xLe=AUJ(); } else { delete n.x; delete n.xLe; } ecrireB('n:'+n.id,n); if(el.checked) toast('Fait !'); vAccueil(); });
/* toucher une tuile n'importe où (pas seulement son logo) ouvre l'app (25.11, demande de Nicolas) ; ses boutons et champs gardent leur rôle */
$main.addEventListener('click',e=>{ const t=e.target.closest('.apps>.carre,.apps>.carte'); if(!t||e.target.closest('a,button,input,select,textarea,label,form,[data-r],[data-ouvrir],[data-drag]')) return;
  const a=t.querySelector('a.c-tete,:scope>a'); if(a){ e.preventDefault(); a.click(); } });
$main.addEventListener('click',e=>{ if(e.target.closest('section#b-obj')){ ouvrirObjectifs(); return; } const b=e.target.closest('button'); if(!b) return;
  if(b.id==='b-routine'){ ouvrirRoutine(); return; }
  if(b.id==='b-semaine'){ ouvrirSemaine(); return; }
  if(b.dataset.styleInit&&window.LocusProfil){ PROFIL=LocusProfil.nouveauStyle(null,b.dataset.styleInit); LocusProfil.enregistrer(sb,UID,PROFIL); render(); toast(b.dataset.styleInit==='neutre'?'Style Neutre : tout se règle dans Réglages › Mon Locus':'Style Village'); return; }
  if(b.id==='b-obj'){ ouvrirObjectifs(); return; }
  if(b.id==='b-chrono'){ ouvrirDans('mine','act=chrono'); return; }
  if(b.id==='b-saisie'){ ouvrirDans('banque','act=saisie'); return; }
  if(b.dataset.forge){ ouvrirDans('forge','seance='+encodeURIComponent(b.dataset.forge)+'&wk='+CUR()+'&plein=1'); return; } });
/* liens « au premier plan » (projets de l'Établi) */
document.addEventListener('click',e=>{ const a=e.target.closest('a[data-dans]'); if(!a||e.ctrlKey||e.metaKey) return; e.preventDefault(); if(!$plein.hidden) fermerPlein(); ouvrirDans(a.dataset.dans,'',a.dataset.hash||''); });

/* =============================== Une app au premier plan =============================== */
/* Les apps des fenêtres rapides (Marché, Mine, Banque, Établi) sont chargées en arrière-plan, l'une après l'autre,
   peu après l'ouverture de l'accueil (&attente=1) : au toucher, l'accueil leur envoie « ouvrir » et la fenêtre
   s'affiche tout de suite. La Forge (plein écran) se charge à la demande. */
const CHAUDES=['marche','mine','banque','etabli'], CH={};
let $dans=null, $fond=null, $x=null, dansT=null, derToast={t:'',le:0};
const scheme=app=>['forge','banque'].includes(app)?'dark':'light';
function cadre(app,url){ const f=document.createElement('iframe'); f.className='dans'; f.title=app; f.tabIndex=-1; f.style.colorScheme=scheme(app); f.src=url; document.body.appendChild(f); return f; }
function chauffer(app){ if(!CH[app]) CH[app]={f:cadre(app,app+'/?dans=accueil&attente=1'),charge:false,ordre:null}; return CH[app]; }
function prechauffer(){ const p=prof(); CHAUDES.filter(a=>!window.LocusProfil||LocusProfil.actif(p,a)&&!(p&&p.menu==='epure'&&a!=='etabli')).forEach((a,i)=>setTimeout(()=>chauffer(a),1200+i*1500)); }
function ouvrirDans(app,params,hash){
  if($dans) return;
  $fond=document.createElement('div'); $fond.className='dans-fond'; $fond.innerHTML='<span class="att" aria-label="Ouverture…"></span>'; document.body.appendChild($fond);
  $x=document.createElement('button'); $x.type='button'; $x.className='dans-x'; $x.setAttribute('aria-label','Revenir à l’accueil'); $x.innerHTML=P('supprimer'); $x.addEventListener('click',fermerDans); document.body.appendChild($x);
  if(app==='forge') $x.hidden=true;
  document.body.style.overflow='hidden';
  if(CHAUDES.includes(app)&&!/plein=1/.test(params||'')){ const c=chauffer(app), ordre={locus:'ouvrir',p:Object.fromEntries(new URLSearchParams(params||'')),hash:hash||''}; $dans=c.f; $dans.classList.add('actif');
    if(c.charge) c.f.contentWindow.postMessage(ordre,location.origin); else c.ordre=ordre; }
  else { $dans=cadre(app,app+'/?dans=accueil'+(params?'&'+params:'')+(hash?'#'+hash:'')); $dans.classList.add('actif'); }
  dansT=setTimeout(()=>{ if($dans){ $dans.classList.add('vu'); $fond.classList.add('vu'); } },9000); }
function fermerDans(){ if(!$dans) return; const f=$dans; $dans=null; clearTimeout(dansT);
  if(Object.values(CH).some(c=>c.f===f)) f.classList.remove('vu','actif'); else f.remove();
  if($fond) $fond.remove(); if($x) $x.remove(); $fond=$x=null; if($plein.hidden) document.body.style.overflow='';
  Promise.all([tirer(),PB?PB.tirer():null]).then(()=>{ render(); if(VUE_OBJ) return; if(!$plein.hidden&&VUE_SEM) vSemaineVue(); else if(!$plein.hidden&&$plein.dataset.e) vRoutine(); }); }
addEventListener('message',e=>{ const d=e.data; if(e.origin!==location.origin||!d||d.locus!==1) return;
  const c=Object.values(CH).find(x=>x.f.contentWindow===e.source), actif=$dans&&e.source===$dans.contentWindow;
  if(!c&&!actif) return;
  if(d.toast){ if(d.toast!==derToast.t||Date.now()-derToast.le>1500) toast(d.toast); derToast={t:d.toast,le:Date.now()}; }
  if(c&&d.etat==='charge'){ c.charge=true; if(c.ordre){ const o=c.ordre; c.ordre=null; c.f.contentWindow.postMessage(o,location.origin); } }
  if(!actif) return;
  if(d.banque) banqueFaite(d.banque);
  if(d.etat==='pret'||(d.etat==='charge'&&!c)){ clearTimeout(dansT); $dans.classList.add('vu'); $fond.classList.add('vu'); if(c) $x.hidden=true; }
  if(d.etat==='fermer') fermerDans(); });

/* =============================== Connexion (une seule, pour toutes les apps) =============================== */
function vLogin(msg){ $main.innerHTML=`<form class="login" id="f-login"><h2>Bienvenue dans Locus</h2><p class="note">Connecte-toi une fois : toutes les apps s'ouvriront avec ce compte.</p><input type="email" id="l-mail" autocomplete="username" placeholder="Adresse e-mail" aria-label="Adresse e-mail" required><input type="password" id="l-pass" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" required><button type="submit">Se connecter</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</form>`;
  document.getElementById('f-login').addEventListener('submit',async ev=>{ ev.preventDefault(); ev.stopPropagation();
    try{ const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('l-mail').value.trim(),password:document.getElementById('l-pass').value}); if(error) throw error; await entrer(data.user); }
    catch(err){ vLogin(/invalid/i.test((err&&err.message)||'')?'E-mail ou mot de passe incorrect.':'Connexion impossible : '+((err&&err.message)||err)); } }); }
async function entrer(user){
  UID=user.id; reprendre(); PB=Projets.base(sb,UID); try{ AB=window.Achats?Achats.base(sb,UID):null; }catch(e){ AB=null; } PB.surChangement(()=>{ if($plein.hidden) render(); else if($plein.dataset.e) vRoutine(); });
  PROFIL=null; render(); await Promise.all([tirer(),PB.tirer(),window.LocusProfil?LocusProfil.tirer(sb,UID).then(p=>{ PROFIL=p; }):null]); render(); vider(); prechauffer(); }
(async function(){
  const d=new Date(); document.getElementById('date').textContent=JOURS[(d.getDay()+6)%7]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+' · S'+wkNum(wkKey(d));
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  if(!window.supabase||!window.supabase.createClient){ $main.innerHTML='<p class="note">Impossible de charger Locus. Recharge la page.</p>'; return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'orga-auth'}});
  let s=null; try{ s=(await sb.auth.getSession()).data.session; }catch(e){}
  if(s&&s.user) await entrer(s.user); else vLogin();
  addEventListener('online',()=>{ vider(); tirer().then(render); });
  document.addEventListener('visibilitychange',()=>{ if(UID&&document.visibilityState==='visible'){ Promise.all([tirer(),PB.tirer()]).then(()=>{ PROFIL=null; if($plein.hidden) render(); }); } });
  setInterval(()=>{ if(UID&&CHRONO&&$plein.hidden&&document.visibilityState==='visible') render(); },30000);
})();
