<!doctype html>
<html lang="fr" data-lieu="locus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Locus</title>
<meta name="theme-color" content="#413B4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="commun/cadre.css">
<link rel="stylesheet" href="commun/lieux.css">
<style>
/* Accueil de Locus : charte du 15.11 (commun/CHARTE.md). Chaque tuile porte le lieu de son app (data-lieu) :
   fond, texte et plaque du picto viennent de commun/lieux.css. */
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.vt-acc{display:flex;gap:8px;margin:0 0 16px}
.vt-acc input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--pill);padding:11px 16px;font:inherit;font-size:15px}
.vt-acc input::placeholder{color:var(--ink-3)}
.vt-acc button{border:0;background:var(--accent);color:var(--on-acc);border-radius:var(--pill);width:48px;display:grid;place-items:center;cursor:pointer}
.vt-acc button .ic{width:20px;height:20px}
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;list-style:none;margin:0;padding:0}
.tuiles li{display:flex}
.tuile{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:118px;padding:13px;border-radius:18px;
  background:var(--page);color:var(--on-page);text-decoration:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on-page) 10%,transparent)}
.tuile:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.tuile:active{filter:brightness(.94)}
.tuile .nom{display:block;font:700 15px/1.15 var(--f-display);letter-spacing:-.02em}
.tuile .eyebrow{display:block;margin-top:3px;color:var(--on-page-2);font-size:10.5px}
@media (min-width:600px){.tuiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tuile{min-height:132px}}
p.pied{margin:26px 0 0;color:var(--on-page-2);font-size:13px}
</style>
</head>
<body>
<header class="oh"><div class="oh-bar"><span class="oh-orga"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M8.5 8.5h3v3h-3zM10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18"/></svg></span><h1 class="oh-nom">Locus</h1><span class="oh-sub" id="date"></span><span class="oh-sp"></span><button class="oh-b" type="button" data-ampoule><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 15h6M8 18h4M10 2a5 5 0 0 0-3.2 8.8V13h6.4v-2.2A5 5 0 0 0 10 2z"/></svg></button><a class="oh-b" href="reglages/" aria-label="Réglages de Locus"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3M4 4l2.1 2.1M13.9 13.9 16 16M16 4l-2.1 2.1M6.1 13.9 4 16"/></svg></a></div></header>
<main>
  <form class="vt-acc" action="bibliotheque/" method="get" autocomplete="off"><input name="note" placeholder="Vide-tête : une idée, un truc à ne pas oublier…" aria-label="Noter dans le vide-tête" enterkeyhint="send"><button type="submit" aria-label="Noter"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14"/></svg></button></form>
  <ul class="tuiles" aria-label="Mes apps">
    <li><a class="tuile" href="etabli/" data-lieu="etabli">
      <span class="plaque"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M1 4.5h18M3 4.5v11M17 4.5v11M3 10.5h14"/></svg></span>
      <span><span class="nom">L’Établi</span><span class="eyebrow">projets</span></span>
    </a></li>
    <li><a class="tuile" href="banque/" data-lieu="banque">
      <span class="plaque"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 11.5a7 7 0 0 1 14 0zM3 15.5h14"/></svg></span>
      <span><span class="nom">La Banque</span><span class="eyebrow">finances</span></span>
    </a></li>
    <li><a class="tuile" href="forge/" data-lieu="forge">
      <span class="plaque"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17l7-7 7 7M3 10l7-7 7 7"/></svg></span>
      <span><span class="nom">La Forge</span><span class="eyebrow">entraînement</span></span>
    </a></li>
    <li><a class="tuile" href="marche/" data-lieu="marche">
      <span class="plaque"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h16v12H2zM2 10h16"/></svg></span>
      <span><span class="nom">Le Marché</span><span class="eyebrow">courses</span></span>
    </a></li>
    <li><a class="tuile" href="mine/" data-lieu="mine">
      <span class="plaque"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M1 6.5c5-5 13-5 18 0M10 3v14.5"/></svg></span>
      <span><span class="nom">La Mine</span><span class="eyebrow">travail pro</span></span>
    </a></li>
    <li><a class="tuile" href="bibliotheque/" data-lieu="bibliotheque">
      <span class="plaque"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 2.5v15M6.5 2.5v15M10.5 2.5v15M13.5 3l4 14.5"/></svg></span>
      <span><span class="nom">La Bibliothèque</span><span class="eyebrow">notes, journal</span></span>
    </a></li>
  </ul>
  <p class="pied">Une seule app à installer : les autres s'ouvrent depuis ces tuiles, chacune avec son propre style.</p>
</main>
<script>
(function(){
  var d=new Date(), j=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  j.setUTCDate(j.getUTCDate()+4-(j.getUTCDay()||7));
  var sem=Math.ceil(((j-new Date(Date.UTC(j.getUTCFullYear(),0,1)))/864e5+1)/7);
  document.getElementById('date').textContent=d.toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short'})+' · S'+sem;
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
})();
</script>
<script src="commun/ampoule.js" data-app="orga" defer></script>
<script src="commun/cadre.js"></script>
</body>
</html>
