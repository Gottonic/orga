<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORGA</title>
<meta name="theme-color" content="#3C3C3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(commun/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(commun/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url(commun/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
:root{
  color-scheme:light;
  --paper:#F3F1E7; --cell:#FFFFFF; --ink:#1E1E1E; --muted:#6B6A62; --line:#CFCCBF; --band:#3C3C3C; --band-ink:#FFFFFF; --hl:#FFECB0;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.top .in{max-width:760px;margin:0 auto;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top .sub{font-family:var(--mono);font-size:.78rem;opacity:.75}
main{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.tuiles li{display:flex}
.tuile{flex:1;display:flex;flex-direction:column;gap:12px;min-height:132px;padding:14px;background:var(--t-bg,var(--cell));border:1px solid var(--line);color:var(--t-ink,var(--ink));text-decoration:none}
.tuile:hover{border-color:var(--ink)}
.tuile:active{filter:brightness(.92)}
.tuile .logo{width:52px;height:52px;flex:none;display:grid;place-items:center;background:var(--band);color:var(--band-ink);font:700 1.6rem/1 var(--body)}
.tuile .logo img{width:52px;height:52px;display:block}
.tuile .nom{font-weight:700;font-size:1.1rem}
.tuile .etat{margin-top:auto;font-family:var(--mono);font-size:.75rem;opacity:.75}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-style:normal;font-display:swap;src:url(commun/fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
p.pied{margin:28px 0 0;color:var(--muted);font-size:.85rem}
</style>
<link rel="stylesheet" href="commun/cadre.css">
</head>
<body>
<header class="oh" style="--oh-bg:#3C3C3C;--oh-ink:#FFFFFF"><div class="oh-bar"><span class="oh-orga"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="currentColor"/><rect x="9" y="1" width="6" height="6" fill="currentColor"/><rect x="1" y="9" width="6" height="6" fill="currentColor"/><rect x="9" y="9" width="6" height="6" fill="currentColor" opacity=".45"/></svg></span><h1 class="oh-nom">ORGA</h1><span class="oh-sub" id="date"></span><span class="oh-sp"></span><button class="oh-b" type="button" data-ampoule>💡</button><a class="oh-b" href="reglages/" aria-label="Réglages d'ORGA"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a></div></header>
<main>
  <ul class="tuiles" aria-label="Mes apps">
    <li><a class="tuile" href="etabli/" style="--t-bg:#FAF3E0;--t-ink:#2B2722">
      <span class="logo"><img src="etabli/icons/icon-192.png" alt=""></span>
      <span class="nom">L’Établi</span>
    </a></li>
    <li><a class="tuile" href="banque/" style="--t-bg:#1E3A5F;--t-ink:#FFFFFF">
      <span class="logo"><img src="banque/icons/icon-192.png" alt=""></span>
      <span class="nom">La Banque</span>
    </a></li>
    <li><a class="tuile" href="forge/" style="--t-bg:#33353A;--t-ink:#FFFFFF">
      <span class="logo"><img src="forge/icons/icon-192.png" alt=""></span>
      <span class="nom">La Forge</span>
    </a></li>
    <li><a class="tuile" href="marche/" style="--t-bg:#2E6B4E;--t-ink:#FFFFFF">
      <span class="logo"><img src="marche/icons/icon-192.png" alt=""></span>
      <span class="nom">Le Marché</span>
    </a></li>
    <li><a class="tuile" href="mine/" style="--t-bg:#C68A2E;--t-ink:#231C17">
      <span class="logo"><img src="mine/icons/icon-192.png" alt=""></span>
      <span class="nom">La Mine</span>
    </a></li>
  </ul>
  <p class="pied">Une seule app à installer : les autres s'ouvrent depuis ces tuiles, chacune avec son propre style.</p>
</main>
<script>
(function(){
  var d=new Date(), j=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  j.setUTCDate(j.getUTCDate()+4-(j.getUTCDay()||7));
  var sem=Math.ceil(((j-new Date(Date.UTC(j.getUTCFullYear(),0,1)))/864e5+1)/7);
  document.getElementById('date').textContent=d.toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'short'})+' · S'+sem;
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
})();
</script>
<script src="commun/ampoule.js" data-app="orga" defer></script>
<script src="commun/cadre.js"></script>
</body>
</html>
