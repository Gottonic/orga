<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORGA</title>
<meta name="theme-color" content="#3C3C3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(commun/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(commun/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url(commun/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
:root{
  color-scheme:light;
  --paper:#F3F1E7; --cell:#FFFFFF; --ink:#1E1E1E; --muted:#6B6A62; --line:#CFCCBF; --band:#3C3C3C; --band-ink:#FFFFFF; --hl:#FFECB0;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.top .in{max-width:760px;margin:0 auto;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top .sub{font-family:var(--mono);font-size:.78rem;opacity:.75}
main{max-width:760px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.tuiles li{display:flex}
.tuile{flex:1;display:flex;flex-direction:column;gap:10px;min-height:150px;padding:14px;background:var(--cell);border:1px solid var(--line);color:inherit;text-decoration:none}
.tuile:hover{border-color:var(--ink)}
.tuile:active{background:var(--hl)}
.tuile .logo{width:52px;height:52px;flex:none;display:grid;place-items:center;background:var(--band);color:var(--band-ink);font:700 1.6rem/1 var(--body)}
.tuile .logo img{width:52px;height:52px;display:block}
.tuile .nom{font-weight:700;font-size:1.1rem}
.tuile .desc{color:var(--muted);font-size:.9rem;margin-top:-6px}
.tuile .etat{margin-top:auto;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-style:normal;font-display:swap;src:url(commun/fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
.tuile.banque .logo{background:#F0B54A;color:#1A1406;border-radius:14px;font-family:"Bricolage Grotesque",var(--body)}
p.pied{margin:28px 0 0;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>ORGA</h1><span class="sub" id="date"></span></div></header>
<main>
  <ul class="tuiles" aria-label="Mes apps">
    <li><a class="tuile" href="etabli/">
      <span class="logo"><img src="etabli/icons/icon-192.png" alt=""></span>
      <span class="nom">Établi</span>
      <span class="desc">Mes projets, semaine par semaine</span>
    </a></li>
    <li><a class="tuile banque" href="banque/">
      <span class="logo" aria-hidden="true">B</span>
      <span class="nom">Banque</span>
      <span class="desc">Mes comptes et mes dépenses</span>
    </a></li>
    <li><a class="tuile" href="forge/">
      <span class="logo"><img src="forge/icons/icon-192.png" alt=""></span>
      <span class="nom">Forge</span>
      <span class="desc">Mon entraînement parkour</span>
    </a></li>
  </ul>
  <p class="pied">Une seule app à installer : les autres s'ouvrent depuis ces tuiles, chacune avec son propre style.</p>
</main>
<script>
(function(){
  var d=new Date(), j=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  j.setUTCDate(j.getUTCDate()+4-(j.getUTCDay()||7));
  var sem=Math.ceil(((j-new Date(Date.UTC(j.getUTCFullYear(),0,1)))/864e5+1)/7);
  document.getElementById('date').textContent=d.toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'})+' · S'+sem;
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
})();
</script>
</body>
</html>
