<!doctype html>
<html lang="fr" data-lieu="marche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Marché</title>
<meta name="theme-color" content="#CADDB3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icons/tete-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Le Marché : charte commune de Locus (commun/lieux.css, commun/CHARTE.md) — formes de la Forge,
   couleurs de l'étal au soleil : céleri, cagette, tomate pour l'action, carotte et feuille en plus.
   Chaque type de magasin garde sa couleur, en petite pastille. */
:root{--r-m:16px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.3}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{display:inline-block}

main{max-width:760px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right,0px)) calc(116px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.cap{font:400 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--on-page-2);margin:6px 2px -4px}
.titre{margin:0 2px;font:700 1.55rem/1.1 var(--f-display);letter-spacing:-.025em;color:var(--on-page)}
.sous-titre{margin:0 2px;color:var(--on-page-2);font-size:.92rem}
.alerte{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-m);padding:12px 16px;font-size:.92rem}
.alerte b{display:block}

/* « Je suis chez » : un bouton par magasin, avec le nombre d'articles qu'on peut y trouver */
.ici{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 2px}
.ici::-webkit-scrollbar{display:none}
.ici button{flex:none;height:40px;padding:0 6px 0 16px;border:0;border-radius:var(--pill);background:var(--surface);color:var(--ink);font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ici button .n{min-width:26px;height:28px;padding:0 8px;border-radius:var(--pill);background:var(--surface-2);display:inline-grid;place-items:center;font:600 .78rem/1 var(--f-mono)}
.ici button.vide{color:var(--ink-3)}
.ici button[aria-pressed="true"]{background:var(--accent);color:var(--on-acc)}
.ici button[aria-pressed="true"] .n{background:color-mix(in srgb,var(--on-acc) 22%,transparent)}

/* ajout rapide */
.qa{display:flex;gap:8px}
.qa input{flex:1;min-width:0;height:52px;padding:0 20px;border:1px solid transparent;border-radius:var(--pill);background:var(--surface);color:var(--ink);font-size:1.02rem}
.qa input::placeholder{color:var(--ink-3)}
.qa input:focus{outline:none;border-color:var(--accent)}
.qa button{flex:none;width:52px;height:52px;border:0;border-radius:50%;background:var(--accent);color:var(--on-acc);display:grid;place-items:center}
.qa button .ic{width:22px;height:22px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.sg{border:0;background:var(--surface);color:var(--ink);border-radius:var(--pill);padding:8px 14px;font-weight:600;font-size:.92rem;text-align:left}
.sg small{font-weight:400;color:var(--ink-3);margin-left:6px}
.sg.deja{opacity:.6;cursor:default}

/* un étal = un magasin (ou un type de magasin, ou « n'importe où ») */
.etal{--c:var(--ink-3);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:4px 0 6px}
.st-in{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:14px 18px 6px}
.st-ey{display:flex;align-items:center;gap:8px;min-width:0;font:400 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.st-ey .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastille{flex:none;width:10px;height:10px;border-radius:3px;background:var(--c)}
.st-n{grid-row:1/3;grid-column:2;font:600 .8rem/1 var(--f-mono);color:var(--ink-3)}
.st-in h2{margin:0;grid-column:1;font:700 1.1rem/1.25 var(--f-display);letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-in h2 .ic{width:18px;height:18px;margin-right:6px;vertical-align:-.15em;color:var(--feuille)}
.rows{display:flex;flex-direction:column}
.rayon{margin:10px 18px 0;padding-bottom:4px;font:400 10.5px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);border-bottom:1px solid var(--line)}
.art{display:flex;align-items:center;min-height:54px;margin:0 6px;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.rows>.art:first-child,.rayon+.art{border-top:0}
.ck{flex:none;width:50px;height:54px;border:0;background:transparent;display:grid;place-items:center;padding:0;color:var(--on-acc)}
.ck::before{content:"";grid-area:1/1;width:24px;height:24px;border:1.8px solid color-mix(in srgb,var(--ink) 40%,transparent);border-radius:50%;transition:background .12s}
.ck .ic{grid-area:1/1;width:14px;height:14px;stroke-width:2.4;opacity:0}
.art.pris .ck::before{background:var(--accent);border-color:var(--accent)}
.art.pris .ck .ic{opacity:1}
.txt{flex:1;min-width:0;border:0;background:transparent;color:inherit;text-align:left;padding:9px 10px 9px 0;display:flex;flex-direction:column;gap:2px;min-height:54px;justify-content:center}
.txt.pad{padding-left:14px}
.l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nom{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.qte{font:600 .74rem/1 var(--f-mono);padding:4px 8px;border-radius:var(--pill);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.meta{font-size:.83rem;color:var(--ink-3)}
.meta .v{color:var(--feuille);font-weight:600}
.meta .t{color:var(--accent-ink);font-weight:600}
.art.pris .nom{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.bt-fini,.bt-on,.bt-re{flex:none;margin-right:8px;height:38px;padding:0 16px;border-radius:var(--pill);font-weight:600;font-size:.9rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.bt-fini{border:0;background:var(--accent);color:var(--on-acc)}
.bt-on{border:0;background:var(--surface-2);color:var(--feuille)}
.bt-on .ic{width:15px;height:15px}
.bt-re{border:1px solid var(--line);background:transparent;color:var(--ink)}
.fait .st-in h2{color:var(--ink-2)}
.note-bas{margin:0;padding:6px 18px 10px;font-size:.8rem;color:var(--ink-3)}
details.etal>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 18px;font:700 .95rem/1.2 var(--f-display);letter-spacing:-.02em}
details.etal>summary::-webkit-details-marker{display:none}
details.etal>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.8px solid var(--ink-3);border-bottom:1.8px solid var(--ink-3);transform:rotate(45deg) translateY(-3px)}
details.etal[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
.cherche{width:100%;height:48px;padding:0 20px;border:1px solid transparent;border-radius:var(--pill);background:var(--surface);color:var(--ink)}
.cherche:focus{outline:none;border-color:var(--accent)}

.vide{text-align:center;padding:28px 18px 12px;color:var(--on-page-2)}
.vide .gros{display:block;font:700 1.25rem/1.2 var(--f-display);letter-spacing:-.02em;color:var(--on-page);margin-bottom:8px}
.vide .btn2{margin-top:14px}
.btn{min-height:52px;border:0;border-radius:var(--pill);background:var(--accent);color:var(--on-acc);font-weight:600;font-size:1rem;padding:0 22px}
.btn2{min-height:48px;padding:8px 20px;border:0;border-radius:var(--pill);background:var(--surface);color:var(--ink);font-weight:600}
.sheet .btn2{background:var(--surface-2)}
.btn-sup{min-height:46px;border:0;border-radius:var(--pill);background:transparent;color:var(--bad);font-weight:600}
.btn-sup.conf{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.lien{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* magasins, types, rayons */
.liste-v{display:flex;flex-direction:column;gap:8px}
.mag{--c:var(--ink-3);display:flex;align-items:center;background:var(--surface);color:var(--ink);border-radius:var(--r);padding-left:18px}
.mag .txt{padding:14px 8px 14px 12px}
.mag-nom{font:700 1rem/1.25 var(--f-display);letter-spacing:-.02em}
.ord{display:flex;flex-direction:column;justify-content:center;padding-right:6px}
.ord button{width:42px;height:34px;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center}
.ord .ic{width:17px;height:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:var(--pill);padding:6px 14px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
main .chip{background:var(--surface);border-color:transparent}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-acc)}
.chip .o{min-width:20px;height:20px;border-radius:10px;background:color-mix(in srgb,var(--on-acc) 25%,transparent);display:inline-grid;place-items:center;font:600 .72rem/1 var(--f-mono)}
.chip.sw-c{width:40px;padding:0;justify-content:center}
.chip.sw-c.on{outline:2px solid var(--ink);outline-offset:2px}
.typ{--c:var(--ink-3);display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border-radius:var(--r-m);border:0;padding:14px 18px;text-align:left;width:100%}
.typ .em{font-size:1.1rem}
.typ b{flex:1;font-weight:600}
.typ span.meta{flex:none;font-family:var(--f-mono);font-size:.75rem}
.rang{display:flex;align-items:center;background:var(--surface-2);border-radius:var(--r-m);padding-left:16px}
.rang .num{font:600 .75rem/1 var(--f-mono);color:var(--ink-3);width:24px}
.rang b{flex:1;font-weight:600}
.nom-r{flex:1;min-width:0;border:0;background:transparent;color:inherit;text-align:left;font-weight:600;font-size:1rem;padding:14px 4px;cursor:text}
.rang .r-nom{flex:1;min-width:0;height:42px;margin:6px 0;padding:0 14px;background:var(--surface);border-color:var(--accent)}
.rang{flex-direction:column;align-items:stretch;padding:0;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.rang-l{display:flex;align-items:center;min-height:54px;padding-left:4px}
.rang .num{padding-left:2px}
.poignee{flex:none;width:46px;height:54px;display:grid;place-items:center;color:var(--ink-3);touch-action:none;cursor:grab}
.poignee .ic{width:18px;height:18px}
.rang.drag{position:relative;z-index:5;box-shadow:0 10px 24px color-mix(in srgb,var(--ink) 22%,transparent),inset 0 0 0 2px var(--accent);cursor:grabbing}
.rang .plus{flex:none;width:46px;height:46px;margin-right:4px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);display:grid;place-items:center}
.rang .plus .ic{width:17px;height:17px;transition:transform .15s}
.rang.ouvert .plus .ic{transform:rotate(45deg)}
.rang.ouvert{background:var(--surface)}
.ray-ed{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px;user-select:text;-webkit-user-select:text}
.ray-ed .in{background:var(--surface-2)}
.ray-tous{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line)}
.ray-a{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:transparent;color:var(--ink);text-align:left;padding:4px 2px}
.ray-a .cb{flex:none;width:22px;height:22px;border-radius:6px;border:1.8px solid color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;color:var(--on-acc)}
.ray-a .cb .ic{width:13px;height:13px;stroke-width:2.4;opacity:0}
.ray-a.on .cb{background:var(--accent);border-color:var(--accent)}
.ray-a.on .cb .ic{opacity:1}
.ray-a .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;border:0;background:transparent;color:inherit;text-align:left;padding:10px 2px;cursor:text}
.ray-a .nm small{font-weight:400;color:var(--ink-3);font-size:.78rem}
.ray-a .mot-x{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--ink-3);display:grid;place-items:center}
.ray-a .mot-x .ic{width:14px;height:14px}
.ray-a .r-mot{flex:1;height:40px;margin:4px 0;background:var(--surface);border-color:var(--accent)}
.ray-a small{flex:none;max-width:45%;font:400 10.5px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:right}
.ray-art{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.ray-art span{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.ray-art select{flex:none;width:48%;height:40px;font-size:.86rem;border-radius:var(--pill);padding-left:12px;padding-right:30px;background-position:calc(100% - 18px) 17px,calc(100% - 12px) 17px}

/* À mijoter : les envies d'achat qui reposent avant d'aller sur la liste */
html[data-lieu] .oh .ot .ot-t .ot-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--pill);background:var(--accent);color:var(--on-acc);font:600 .72rem/1 var(--f-mono)}
.envie{background:var(--surface);color:var(--ink);border-radius:var(--r);overflow:hidden}
.envie>.txt{width:100%;padding:16px 18px}
.envie.prete{box-shadow:inset 0 0 0 2px var(--accent)}
.jauge{display:block;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:9px}
.jauge>i{display:block;height:100%;background:var(--carotte);border-radius:3px}
.prete .jauge>i,.jauge.ok>i{background:var(--feuille)}
.question{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 16px}
.question b{width:100%;font:700 .95rem/1.3 var(--f-display);letter-spacing:-.02em;margin-bottom:2px}
.mini{min-height:40px;padding:0 16px;border-radius:var(--pill);font-weight:600;font-size:.9rem;border:0;background:var(--surface-2);color:var(--ink)}
.mini.oui{background:var(--accent);color:var(--on-acc)}
.mini.non{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--line)}
.bilan{display:flex;gap:12px;align-items:center;background:var(--surface);color:var(--ink-2);border-radius:var(--r-m);padding:14px 18px;font-size:.92rem}
.bilan .ic{width:20px;height:20px;color:var(--feuille)}
.bilan b{font:700 1rem/1 var(--f-display);color:var(--ink)}
.statut{background:var(--surface);color:var(--ink);border-radius:var(--r-m);padding:14px 16px;font-size:.95rem}
.statut .ic{color:var(--carotte);width:18px;height:18px;margin-right:4px}
.statut.ok{box-shadow:inset 0 0 0 2px var(--feuille)}
.statut.ok .ic{color:var(--feuille)}
.choix{display:flex;align-items:stretch;background:var(--surface);color:var(--ink);border-radius:var(--r-m);overflow:hidden}
.choix.fav{box-shadow:inset 0 0 0 2px var(--accent)}
.choix .txt{padding:12px 6px 12px 16px;min-height:0}
.star{flex:none;width:50px;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center}
.star .ic{width:20px;height:20px}
.choix.fav .star{color:var(--carotte)}
.choix.fav .star .ic{fill:currentColor}
.prix{font:600 .85rem/1.2 var(--f-mono);white-space:nowrap}
.pill{font:600 .68rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:var(--pill);white-space:nowrap}
.pill.v{background:color-mix(in srgb,var(--feuille) 16%,transparent);color:var(--feuille)}
.pill.t{background:var(--accent-soft);color:var(--accent-ink)}
.choix-l{display:flex;flex-direction:column;gap:8px}
textarea.in{height:auto;min-height:80px;padding:12px 16px;resize:vertical;line-height:1.35;border-radius:var(--r-m)}
.btn-l{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.btn-l .btn{margin-top:0}
.lien-ext{color:var(--accent-ink);font-weight:600;word-break:break-all}

/* fenêtre (feuille) */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--on-page) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet>*{flex-shrink:0}
.sheet{background:var(--page);color:var(--on-page);width:100%;max-width:520px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:var(--r) var(--r) 0 0;display:flex;flex-direction:column;gap:8px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:var(--r)}}
.sh{position:sticky;top:0;z-index:2;background:var(--page);display:flex;align-items:center;gap:8px;padding:16px 0 6px}
.sh h2{flex:1;margin:0;font:700 1.2rem/1.2 var(--f-display);letter-spacing:-.02em}
.x{width:44px;height:44px;border:0;background:var(--surface);color:var(--ink);border-radius:50%;display:grid;place-items:center}
.x .ic{width:16px;height:16px}
.lab{font:400 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--on-page-2);margin-top:10px}
.lab .opt{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:.8rem}
.in{width:100%;height:50px;padding:0 16px;border:1px solid transparent;border-radius:var(--r-m);background:var(--surface);color:var(--ink);font-size:1rem}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.in:focus{outline:none;border-color:var(--accent)}
.in::placeholder{color:var(--ink-3)}
.aide{margin:0;font-size:.86rem;color:var(--on-page-2)}
.sw{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:8px;border-radius:var(--r-m);background:var(--surface);color:var(--ink);cursor:pointer}
.sw input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.sw span{display:flex;flex-direction:column}
.sw small{color:var(--ink-3);font-size:.85rem}
.row-in{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--on-page-2)}
.row-in .in{flex:1}
.in-n{width:90px;flex:none!important;text-align:center}
.ligne-r{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.ligne-r span:first-child{color:var(--on-page-2)}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:26;width:60px;height:60px;border:0;border-radius:var(--r);background:var(--accent);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 0 0 4px var(--page)}
.fab .ic{width:24px;height:24px}
@media (min-width:800px){.fab{right:calc(50% - 380px + 16px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:50;width:max-content;max-width:calc(100% - 28px);background:var(--ink);color:var(--surface);border-radius:var(--pill);padding:6px 8px 6px 20px;display:flex;align-items:center;gap:10px;font-size:.93rem}
.toast span{padding:6px 0}
.toast button{border:0;background:transparent;color:#F4B27A;font-weight:600;padding:8px 12px;white-space:nowrap}

.login{position:fixed;inset:0;z-index:100;background:var(--page);display:grid;place-items:center;padding:0 16px}
.lbox{width:100%;max-width:380px;background:var(--surface);color:var(--ink);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:8px}
.lbox .logo{width:52px;height:52px;display:block;border-radius:12px}
.lbox h1{margin:6px 0 0;font:700 1.6rem/1.1 var(--f-display);letter-spacing:-.02em}
.lbox p{margin:0 0 6px;color:var(--ink-3);font-size:.92rem}

  if(DICO) return DICO; const noms=new Map(), multi=[], single=new Map();

  }

/* devine le rayon d'après le nom : ce que Nicolas a appris au Marché, puis les expressions, puis les mots prioritaires, puis le premier mot reconnu */
function deviner(nom){ return trouverRayon(nom)||(S.cats.divers?'divers':''); }
/* le rayon reconnu d'après le nom, ou null si le Marché ne sait pas */
function trouverRayon(nom){
  const d=dico(), n=cleNom(nom); if(!n) return null;
  if(d.noms.has(n)) return d.noms.get(n);
  const n2=' '+n+' '; for(const [k,c] of d.multi) if(n2.includes(' '+k+' ')) return c;
  const ts=n.split(' ');
  for(const t of ts) if(PRIO.has(t)&&d.single.has(t)) return d.single.get(t);
  for(const t of ts){ let best=null, bl=0; for(const [k,c] of d.single){ if(k.length<=3?t===k:t.startsWith(k)){ if(k.length>bl){ best=c; bl=k.length; } } } if(best) return best; }
  return null;
}
/* les noms d'un rayon : ses mots, les noms appris et les articles qui y sont, par ordre alphabétique */
function nomsRayon(id){ const c=S.cats[id]; if(!c) return []; const m=new Map();
  for(const w of String(c.mots||'').split(/\s+/).filter(Boolean)){ const lab=w.replace(/_/g,' '); m.set(cleNom(lab),{lab,mot:w}); }
  for(const n of c.appris||[]){ const e=m.get(n)||{lab:n}; e.appris=n; m.set(n,e); }

}

function ranger1(a){ const d=jourDe(a.panier)||today(); a.achats=[...new Set([...(a.achats||[]),d])].sort().slice(-24); a.liste=false; a.panier=null; a.auto=false; a.depuis=d; }
function surListe(a){ a.liste=true; a.panier=null; a.auto=false; a.ajoute=nowIso(); delete a.pris; }
/* cocher = acheté : l'achat du jour est noté tout de suite ; « pris » garde de quoi annuler pendant la journée */
function acheter(a){ const t=today(), deja=(a.achats||[]).includes(t);
  a.pris={le:nowIso(),ajout:!deja,depuis:a.depuis||null,auto:!!a.auto};
  a.achats=[...new Set([...(a.achats||[]),t])].sort().slice(-24); a.liste=false; a.panier=null; a.auto=false; a.depuis=t; }
function annulerAchat(a){ const p=a.pris||{};
  if(p.ajout) a.achats=(a.achats||[]).filter(d=>d!==jourDe(p.le));
  if(p.depuis) a.depuis=p.depuis; else delete a.depuis;
  a.liste=true; a.panier=null; a.auto=!!p.auto; delete a.pris; }
function estFait(a){ return !a.liste&&!!a.pris&&jourDe(a.pris.le)===today(); }
/* entretien : reprend les anciens paniers (achetés), oublie les achats d'hier pour « Acheté aujourd'hui »,
   remet sur la liste les basiques dont le rythme est échu */
function entretien(){
  if(!booted) return; let ch=false; const t=today();
  for(const a of arts()){
    if(a.pris&&jourDe(a.pris.le)!==t){ delete a.pris; ch=true; }
    if((a.ou||[]).length>1){ a.ou=ouDe(a).slice(0,1); ch=true; }
    if(a.liste&&a.panier){ ranger1(a); ch=true; }
    else if(a.basique&&a.rythme>0&&!a.liste&&prochain(a)<=t){ a.liste=true; a.auto=true; a.panier=null; a.ajoute=nowIso(); ch=true; }
  }
  if(ch){ save(); render(); }
}

/* =============================== Synchro (même principe que Banque) =============================== */
function canon(v){ if(Array.isArray(v)) return '['+v.map(x=>canon(x===undefined?null:x)).join(',')+']'; if(v&&typeof v==='object') return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'; return JSON.stringify(v===undefined?null:v); }
function rowsOf(st){ const r={};
  for(const m of Object.values(st.mags)) r['m:'+m.id]=m; for(const t of Object.values(st.types)) r['y:'+t.id]=t; for(const a of Object.values(st.arts)) r['a:'+a.id]=a;
  for(const e of Object.values(st.envies||{})) r['e:'+e.id]=e;
  for(const c of Object.values(st.cats||{})) r['c:'+c.id]=c;
  if(Object.keys(st.regl).length) r['s:reglages']=st.regl; return r; }
function fromRows(map){ DICO=null; const st={mags:{},types:{},arts:{},envies:{},cats:{},regl:{}};
  for(const k in map){ let d; try{ d=JSON.parse(map[k]); }catch(e){ continue; } if(!d) continue; const p=k[0];
    if(p==='m') st.mags[d.id]=d; else if(p==='y') st.types[d.id]=d; else if(p==='a') st.arts[d.id]=d; else if(p==='e') st.envies[d.id]=d; else if(p==='c') st.cats[d.id]=d; else if(k==='s:reglages') st.regl=d; }
  return st; }
function persist(){ if(!UID) return; try{ localStorage.setItem(CK(),JSON.stringify({prev,dirty:[...dirty],lastPull})); }catch(e){} }
function save(){ DICO=null; if(!UID) return; const cur=rowsOf(S); let ch=false;
  for(const k in cur){ const v=canon(cur[k]); if(prev[k]!==v){ prev[k]=v; dirty.add(k); ch=true; } }
  for(const k in prev){ if(!(k in cur)){ delete prev[k]; dirty.add(k); ch=true; } }
  if(ch){ persist(); schedulePush(); setSync(); } }
function schedulePush(d){ clearTimeout(pushTimer); pushTimer=setTimeout(push,d==null?900:d); }
async function push(){
  if(!sb||!UID||pushing||!dirty.size){ setSync(); return; }
  if(!navigator.onLine){ setSync(); return; }
  pushing=true; setSync('sending');
  const keys=[...dirty].slice(0,250), sent={};
  const rows=keys.map(k=>{ sent[k]=prev[k]; const kind=KIND[k[0]]||'reglage'; return (k in prev)?{user_id:UID,key:k,kind,data:JSON.parse(prev[k]),deleted:false}:{user_id:UID,key:k,kind,data:null,deleted:true}; });
  try{
    const {error}=await sb.from(TABLE).upsert(rows,{onConflict:'user_id,key'}); if(error) throw error;
    keys.forEach(k=>{ if(prev[k]===sent[k]) dirty.delete(k); });
    persist(); const avait=syncErr; syncErr=''; pushing=false; setSync(); if(avait) render();
    if(dirty.size) schedulePush(200);
  }catch(e){ pushing=false; const avait=syncErr; syncErr=(e&&e.message)||String(e); setSync(); if(!avait) render(); schedulePush(15000); }
}
async function pull(full){
  if(!sb||!UID) return false;
  if(!navigator.onLine){ setSync(); return false; }
  try{
    const since=full?null:lastPull; let changed=false, maxTs=lastPull, from=0;
    for(;;){
      let q=sb.from(TABLE).select('key,data,deleted,updated_at').order('updated_at',{ascending:true}).range(from,from+999);
      if(since) q=q.gte('updated_at',since);
      const {data,error}=await q; if(error) throw error;
      data.forEach(r=>{ if(!maxTs||r.updated_at>maxTs) maxTs=r.updated_at; if(dirty.has(r.key)) return;
        if(r.deleted||r.data==null){ if(r.key in prev){ delete prev[r.key]; changed=true; } }
        else { const v=canon(r.data); if(prev[r.key]!==v){ prev[r.key]=v; changed=true; } } });
      if(data.length<1000) break; from+=1000;
    }
    lastPull=maxTs; persist();
    const avait=syncErr; syncErr='';
    if(changed){ S=fromRows(prev); render(); } else if(avait) render();
    setSync(); return true;
  }catch(e){ const avait=syncErr; syncErr=(e&&e.message)||String(e); setSync(); if(!avait) render(); return false; }
}
function etatSync(){
  if(!navigator.onLine) return ['hors ligne'+(dirty.size?' · '+dirty.size:''),'Hors ligne : les changements partiront au retour du réseau'];
  if(syncErr) return ['⚠'+(dirty.size?' '+dirty.size:''),'Problème de synchro : '+syncErr];
  if(pushing||dirty.size) return ['↻'+(dirty.size?' '+dirty.size:''),'Envoi en cours'];
  return ['✓','Tout est enregistré'];
}
function setSync(){ const el=document.getElementById('sync'); const [txt,tip]=etatSync(); el.textContent=txt; el.title=tip; el.setAttribute('aria-label','Synchro : '+tip); }
function tableManque(){ return !!syncErr&&/marche_rows|could not find the table|does not exist|schema cache/i.test(syncErr); }

  if(ui.ici&&!S.mags[ui.ici]){ ui.ici=''; lsSet('marche-ici',''); }
  /* garde le champ en cours de saisie (le clavier reste ouvert) */
  const ae=document.activeElement, fid=ae&&ae.id&&$view.contains(ae)?ae.id:null; let sel=null; try{ if(fid) sel=[ae.selectionStart,ae.selectionEnd]; }catch(e){}

}

  h+=`<button class="btn2" data-act="cat-new">+ Nouveau rayon</button>`;
  return h;
}

  const row=h.closest('.rang'), r=row.getBoundingClientRect();
  drag={row,grab:e.clientY-r.top,ty:0,y:e.clientY,id:e.pointerId,timer:null};
  row.classList.add('drag'); try{ h.setPointerCapture(e.pointerId); }catch(x){} e.preventDefault();

    if(drag.y<sr.top+70) d=-10; else if(drag.y>sr.bottom-70) d=10;

  return ('Courses'+(mi?' · '+mi.nom:'')+'\n'+gs.map(g=>'\n'+refNom(g.ref)+'\n'+trierRayons(g.items,magDeRef(g.ref)).map(a=>'– '+a.nom+(a.qte?' ('+a.qte+')':'')+(a.note?' · '+a.note:'')).join('\n')).join('\n')).trim();
}
async function partager(){ const t=texteListe();
  if(navigator.share){ try{ await navigator.share({text:t}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(t); toast('Liste copiée'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Liste copiée'); }catch(x){ toast('Copie impossible'); } ta.remove(); } }

function showLogin(msg){ booted=false; document.getElementById('login').hidden=false; const er=document.getElementById('l-err'); er.hidden=!msg; er.textContent=msg||''; try{ document.getElementById('l-mail').focus(); }catch(e){} }
async function enter(user){
  UID=user.id; EMAIL=user.email||''; document.getElementById('login').hidden=true;
  let c=null; try{ c=JSON.parse(localStorage.getItem(CK())||'null'); }catch(e){}
  if(c){ prev=c.prev||{}; dirty=new Set(c.dirty||[]); lastPull=c.lastPull||null; }
  S=fromRows(prev); booted=true; render(); setSync();
  await pull(!c);
  if(!Object.keys(S.types).length){ semer(); save(); render(); }
  if(!Object.keys(S.cats).length){ semerRayons(); save(); render(); }
  if(accentuerRayons()){ save(); render(); }
  entretien(); push();
  try{ if(/[?&]dans=accueil/.test(location.search)&&window.parent!==window) parent.postMessage({locus:1,etat:'charge'},location.origin); }catch(e){} /* prête pour les fenêtres rapides de l'accueil */
  /* depuis l'accueil : la ligne d'achat, et les idées du vide-tête envoyées au Marché par la routine du lundi */
  const v=versLocus('marche'); if(DANS_ACC){ if(v&&v.q) dansAjout(v.q); return; }
  let L=[]; try{ L=JSON.parse(localStorage.getItem('locus-vers-marche')||'[]'); localStorage.removeItem('locus-vers-marche'); }catch(e){}
  if(v&&v.q) L.push(v.q);
  L.forEach(q=>{ ui.q=q; ajoutRapide(); });
}
/* passage depuis l'accueil de Locus (18.11) : lu une seule fois */
const DANS_ACC=/[?&]dans=accueil/.test(location.search)&&window.parent!==window; /* ouverte au premier plan sur l'accueil (commun/cadre.js) */
const versLocus=app=>{ try{ if(DANS_ACC) return Object.fromEntries(new URLSearchParams(location.search)); const v=JSON.parse(sessionStorage.getItem('locus-vers')||'null'); if(v&&v.app===app){ sessionStorage.removeItem('locus-vers'); return v; } }catch(e){} return null; };

document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); const mail=document.getElementById('l-mail').value.trim(), pass=document.getElementById('l-pass').value;
  try{ const {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass}); if(error) throw error; await enter(data.user); }
  catch(err){ showLogin('Connexion impossible : '+((err&&err.message)||err)); }
});
async function start(){
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('../sw.js',{scope:'../'}); }catch(e){} }
  if(!window.supabase||!window.supabase.createClient){ $view.innerHTML='<div class="vide">Impossible de charger l’app. Recharge la page.</div>'; return; }
  try{ if(!localStorage.getItem('orga-auth')&&localStorage.getItem('etabli-auth')) localStorage.setItem('orga-auth',localStorage.getItem('etabli-auth')); }catch(e){}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'orga-auth'}});
  let session=null; try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(session&&session.user) await enter(session.user); else showLogin();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'&&UID){ UID=null; showLogin(); } });
  addEventListener('online',()=>{ setSync(); pull().then(()=>push()); });
  addEventListener('offline',()=>setSync());
  document.addEventListener('visibilitychange',()=>{ if(!UID) return; if(document.visibilityState==='visible'){ entretien(); pull().then(()=>push()); } else push(); });
  setInterval(()=>{ if(UID&&document.visibilityState==='visible'){ entretien(); pull(); } },60000);
}
render(); start();
